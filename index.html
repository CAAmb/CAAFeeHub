<!-- Content Security Policy. Nothing is fetched from a CDN at runtime: the XLSX
     reader is hand-rolled against the browser's own DecompressionStream, so the
     only remote origins here are the ones Microsoft sign-in will need in phase 2. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://coastaladvicegroup.sharepoint.com; frame-src 'self' https://login.microsoftonline.com; base-uri 'none'; form-action 'none'">
<script>
/* Clickjacking guard, matching the other Coastal apps. MSAL's silent-renewal
   iframe loads this page to hand a token back, so leave that one framed. */
(function () {
  if (window.top === window.self) return;
  if (/[?#].*\b(code|error|state|id_token|session_state)=/.test(location.href)) return;
  document.documentElement.style.display = "none";
  window.top.location = window.self.location;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

@font-face{font-family:"Halyard Display";font-style:normal;font-weight:400;font-display:swap;src:local("Halyard Display Book"),local("HalyardDisplay-Book"),local("Halyard Display")}
@font-face{font-family:"Halyard Display";font-style:normal;font-weight:500 700;font-display:swap;src:local("Halyard Display Regular"),local("HalyardDisplay-Regular"),local("Halyard Display")}

/* ---------------------------------------------------------------------------
   Theme tokens.
   Three states, not two: an explicit choice stamps data-theme on <html>, and
   the default "system" setting stamps nothing — so bare :root carries the
   complete light palette, the media query redefines tokens for an unstamped
   dark OS, and [data-theme] wins over both. Every colour in this sheet comes
   from a token; nothing is declared only inside a media or [data-theme] block.
   --------------------------------------------------------------------------- */
:root{
  color-scheme:light;
  --navy:#0f2433; --navy-2:#16344a; --navy-3:#1f4761;
  --sky:#def5ff; --peach:#eba380;

  --plane:#eef3f6; --plane-wash:linear-gradient(180deg,#eaf1f5 0%,#f4f7f8 46%,#f8f5f2 100%);
  --surface:#ffffff; --surface-2:#f6f9fb; --surface-glass:rgba(255,255,255,.82);
  --ink:#0f2433; --ink-2:#4a5b68; --ink-muted:#7b8b97;
  --line:#e3e9ee; --line-strong:#cdd8e0;

  --s1:#2a78d6; --focus-ring:rgba(42,120,214,.16);
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --info:#2a78d6;
  --toast-bg:var(--navy); --toast-good:#0e7a3c;

  --ok-bg:#e7f7e7;  --ok-fg:#0a7a0a;  --ok-line:#c4ebc4;
  --warn-bg:#fff6e0; --warn-fg:#8a6100; --warn-line:#f3dfae;
  --bad-bg:#fdeaea;  --bad-fg:#a52a2a;  --bad-line:#f2c9c9;
  --info-bg:#e8f1fc; --info-fg:#1b5aa8; --info-line:#c9dcf5;
  --mute-bg:#eef2f5;
  --row-hover:#f2f8fc; --row-hover-2:#eaf3f9;
  --scrim:rgba(15,36,51,.45);
  --shadow:0 1px 2px rgba(15,36,51,.05),0 6px 20px rgba(15,36,51,.06);
  --shadow-lift:0 18px 60px rgba(15,36,51,.24);

  /* The sidebar: the one place the design is allowed to be loud.
     The brand portrait sits on top; the gradient underneath is what shows if
     the image ever fails to load, so the two are tuned to match.
     Light theme takes the portrait whole — its navy text stays legible over
     every part of it, horizon included. */
  /* Sampled straight out of "Light Portrait.png" by build-sidebar-art.ps1: every
     row of the centre strip averaged, smoothed, and emitted as stops. Grain-free
     by construction — the grain is in the source pixels, so shipping the image
     ships the grain, and a resize can only average it down. Also ~800 bytes
     instead of ~100KB, resolution-independent, and the browser interpolates
     between stops so it cannot band.
     Light takes the portrait whole: navy text is legible over all of it. */
  --side-img:linear-gradient(180deg,#c8deea 0%,#b9d5e4 1.82%,#b9d5e4 3.64%,#b9d5e4 5.45%,#b9d5e4 7.27%,#b9d5e4 9.09%,#bad6e4 10.91%,#bbd6e4 12.73%,#bbd6e5 14.55%,#bcd6e5 16.36%,#bdd7e6 18.18%,#bdd7e6 20%,#bed8e7 21.82%,#bfd9e7 23.64%,#c1d9e8 25.45%,#c2dae8 27.27%,#c3dae9 29.09%,#c5dbea 30.91%,#c6dcea 32.73%,#c7ddeb 34.55%,#c8ddec 36.36%,#cadeed 38.18%,#ccdfed 40%,#cee0ee 41.82%,#d0e1ef 43.64%,#d1e1f0 45.45%,#d3e2f1 47.27%,#d5e3f2 49.09%,#d7e4f3 50.91%,#d9e5f4 52.73%,#dbe6f5 54.55%,#dde7f6 56.36%,#e0e8f7 58.18%,#e2eaf8 60%,#e4ebf9 61.82%,#e6ecf9 63.64%,#e8edfa 65.45%,#eaeefb 67.27%,#edeffb 69.09%,#eff0fc 70.91%,#f1f1fc 72.73%,#f2f2fc 74.55%,#f4f3fc 76.36%,#f5f3fb 78.18%,#f6f0f6 80%,#f6eaeb 81.82%,#f4ded8 83.64%,#f1cbbb 85.45%,#edb9a0 87.27%,#eaa989 89.09%,#e79e79 90.91%,#e69971 92.73%,#e6976e 94.55%,#e6976e 96.36%,#e6976e 98.18%,#e7976e 100%);
  --side-ink:#12303f; --side-ink-dim:rgba(18,48,63,.58); --side-rule:rgba(15,36,51,.12);
  --side-hover:rgba(15,36,51,.07); --side-active-bg:var(--navy); --side-active-ink:#ffffff;
  --side-count:rgba(15,36,51,.1);
  --side-foot-bg:rgba(255,255,255,.34);
  /* The brand mark ships white-on-transparent; on the pale sidebar it has to be
     driven back to navy, which a filter does without shipping a second asset. */
  --logo-filter:brightness(0) saturate(100%) invert(13%) sepia(24%) saturate(1420%) hue-rotate(168deg) brightness(94%) contrast(96%);

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --font:"Halyard Display","Figtree","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}

/* Unstamped document on a dark OS. Guarded so an explicit light choice wins. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --plane:#08161f; --plane-wash:linear-gradient(180deg,#071620 0%,#0a1e29 52%,#102630 100%);
    --surface:#0f2733; --surface-2:#14303d; --surface-glass:rgba(15,39,51,.82);
    --ink:#e6f0f6; --ink-2:#a8c1cf; --ink-muted:#7d97a6;
    --line:#1c3846; --line-strong:#2a5064;

    --s1:#63a9ef; --focus-ring:rgba(99,169,239,.22);
    --good:#3ecb7a; --warning:#f5c451; --critical:#f0736f; --info:#63a9ef;
    --toast-bg:#1b3f52; --toast-good:#15734a;

    --ok-bg:#10352a;  --ok-fg:#66dc9b;  --ok-line:#1d5a43;
    --warn-bg:#3a2f12; --warn-fg:#f2c869; --warn-line:#63501f;
    --bad-bg:#3d1d1e;  --bad-fg:#f79490;  --bad-line:#6a3230;
    --info-bg:#12304a; --info-fg:#8dc4f6; --info-line:#215079;
    --mute-bg:#17323f;
    --row-hover:#173442; --row-hover-2:#1a3b4a;
    --scrim:rgba(3,10,15,.62);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.28);
    --shadow-lift:0 20px 64px rgba(0,0,0,.55);

    /* Sampled from "Dark Portrait.png", but not linearly. The portrait is a phone
       wallpaper: its horizon sits near 55% with a pale band above it, which in a
       242px sidebar puts white nav labels on near-white from halfway down. The
       sampling curve gives 70% of the sidebar to the portrait's dark upper half,
       compresses the pale band, and hands the last 12% to the horizon — where it
       is the best thing on the screen and nothing has to be read over it. */
    --side-img:linear-gradient(180deg,#020614 0%,#020615 1.82%,#020616 3.64%,#020716 5.45%,#030717 7.27%,#020817 9.09%,#020918 10.91%,#020a19 12.73%,#030b1a 14.55%,#030d1c 16.36%,#030e1d 18.18%,#03101f 20%,#031121 21.82%,#041322 23.64%,#041524 25.45%,#051827 27.27%,#061a29 29.09%,#071c2b 30.91%,#091f2e 32.73%,#0a2130 34.55%,#0c2433 36.36%,#0e2736 38.18%,#102a39 40%,#122d3c 41.82%,#15313f 43.64%,#193443 45.45%,#1c3847 47.27%,#1f3c4b 49.09%,#23404e 50.91%,#264452 52.73%,#2a4857 54.55%,#2e4c5b 56.36%,#32505f 58.18%,#365463 60%,#3a5967 61.82%,#3f5d6b 63.64%,#436170 65.45%,#486674 67.27%,#4c6a79 69.09%,#557381 70.91%,#658290 72.73%,#74909e 74.55%,#829eab 76.36%,#90abb8 78.18%,#9db7c4 80%,#aac2cf 81.82%,#b5cdd9 83.64%,#bfd6e1 85.45%,#cadae1 87.27%,#d4d0cd 89.09%,#ddbcaa 90.91%,#e3a788 92.73%,#e59b74 94.55%,#e6976e 96.36%,#e6976e 98.18%,#e7976e 100%);
    --side-ink:#ffffff; --side-ink-dim:rgba(226,240,247,.76); --side-rule:rgba(222,245,255,.14);
    --side-hover:rgba(222,245,255,.12); --side-active-bg:var(--sky); --side-active-ink:var(--navy);
    --side-count:rgba(255,255,255,.18);
    --side-foot-bg:rgba(4,12,18,.58);
    --logo-filter:none;
  }
}

/* Explicit choices win in both directions. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#08161f; --plane-wash:linear-gradient(180deg,#071620 0%,#0a1e29 52%,#102630 100%);
  --surface:#0f2733; --surface-2:#14303d; --surface-glass:rgba(15,39,51,.82);
  --ink:#e6f0f6; --ink-2:#a8c1cf; --ink-muted:#7d97a6;
  --line:#1c3846; --line-strong:#2a5064;

  --s1:#63a9ef; --focus-ring:rgba(99,169,239,.22);
  --good:#3ecb7a; --warning:#f5c451; --critical:#f0736f; --info:#63a9ef;
  --toast-bg:#1b3f52; --toast-good:#15734a;

  --ok-bg:#10352a;  --ok-fg:#66dc9b;  --ok-line:#1d5a43;
  --warn-bg:#3a2f12; --warn-fg:#f2c869; --warn-line:#63501f;
  --bad-bg:#3d1d1e;  --bad-fg:#f79490;  --bad-line:#6a3230;
  --info-bg:#12304a; --info-fg:#8dc4f6; --info-line:#215079;
  --mute-bg:#17323f;
  --row-hover:#173442; --row-hover-2:#1a3b4a;
  --scrim:rgba(3,10,15,.62);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.28);
  --shadow-lift:0 20px 64px rgba(0,0,0,.55);

  /* Kept byte-for-byte in step with the media-query block above. */
  --side-img:linear-gradient(180deg,#020614 0%,#020615 1.82%,#020616 3.64%,#020716 5.45%,#030717 7.27%,#020817 9.09%,#020918 10.91%,#020a19 12.73%,#030b1a 14.55%,#030d1c 16.36%,#030e1d 18.18%,#03101f 20%,#031121 21.82%,#041322 23.64%,#041524 25.45%,#051827 27.27%,#061a29 29.09%,#071c2b 30.91%,#091f2e 32.73%,#0a2130 34.55%,#0c2433 36.36%,#0e2736 38.18%,#102a39 40%,#122d3c 41.82%,#15313f 43.64%,#193443 45.45%,#1c3847 47.27%,#1f3c4b 49.09%,#23404e 50.91%,#264452 52.73%,#2a4857 54.55%,#2e4c5b 56.36%,#32505f 58.18%,#365463 60%,#3a5967 61.82%,#3f5d6b 63.64%,#436170 65.45%,#486674 67.27%,#4c6a79 69.09%,#557381 70.91%,#658290 72.73%,#74909e 74.55%,#829eab 76.36%,#90abb8 78.18%,#9db7c4 80%,#aac2cf 81.82%,#b5cdd9 83.64%,#bfd6e1 85.45%,#cadae1 87.27%,#d4d0cd 89.09%,#ddbcaa 90.91%,#e3a788 92.73%,#e59b74 94.55%,#e6976e 96.36%,#e6976e 98.18%,#e7976e 100%);
  --side-ink:#ffffff; --side-ink-dim:rgba(226,240,247,.76); --side-rule:rgba(222,245,255,.14);
  --side-hover:rgba(222,245,255,.12); --side-active-bg:var(--sky); --side-active-ink:var(--navy);
  --side-count:rgba(255,255,255,.18);
  --side-foot-bg:rgba(4,12,18,.58);
  --logo-filter:none;
}
*{box-sizing:border-box}
html,body{height:100%}
/* The viewer paints its own ground behind an artifact, so body must set an
   explicit background — a transparent body borrows the host's theme. */
body{margin:0;font-family:var(--font);background:var(--plane);background-image:var(--plane-wash);
  background-attachment:fixed;color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--s1)}
h1,h2,h3{font-weight:500;margin:0}
.hide{display:none !important}
.mono{font-variant-numeric:tabular-nums}

#app{display:flex;min-height:100vh}
#sidebar{width:242px;flex:0 0 242px;
  background-image:var(--side-img);background-size:100% 100%;background-repeat:no-repeat;
  background-color:var(--navy);
  color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:24px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;border-bottom:1px solid var(--side-rule)}
.brand-logo-img{width:86%;max-width:184px;height:auto;display:block;filter:var(--logo-filter)}
/* The pill. Solid peach with navy on it, the same pairing the avatar already
   uses, so it reads as part of the brand rather than a sticker. A single fill
   works in both themes because --peach and --navy are fixed: it sits on near
   black at the top of the dark sidebar and on pale blue in the light one, and
   carries navy text comfortably either way.

   Long enough to need two lines if the wording grows, so it wraps inside
   itself and stays centred rather than stretching the brand block. */
.brand-sub{display:inline-block;max-width:100%;background:var(--peach);color:var(--navy);
  font-size:.56rem;font-weight:700;letter-spacing:.15em;line-height:1.5;text-transform:uppercase;
  text-align:center;padding:5px 13px;border-radius:var(--r-pill);
  box-shadow:0 1px 4px rgba(0,0,0,.18)}
nav{padding:12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-sec{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--side-ink-dim);padding:14px 12px 5px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);background:transparent;border:0;
  color:var(--side-ink);opacity:.82;cursor:pointer;text-align:left;width:100%;font-size:.88rem;transition:background .12s ease,opacity .12s ease}
.nav-btn:hover{background:var(--side-hover);opacity:1}
.nav-btn.active{background:var(--side-active-bg);color:var(--side-active-ink);opacity:1;font-weight:500}
.nav-btn .count{margin-left:auto;font-size:.7rem;background:var(--side-count);border-radius:var(--r-pill);padding:1px 8px;font-variant-numeric:tabular-nums}
.nav-btn.active .count{background:rgba(127,127,127,.22)}
.nav-btn .count.alert{background:var(--critical);color:#fff}
.nav-btn svg{width:18px;height:18px;flex:0 0 18px}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Its own ground, because the peach horizon lands right behind it. */
.side-foot{padding:14px;border-top:1px solid var(--side-rule);font-size:.76rem;color:var(--side-ink-dim);
  background:var(--side-foot-bg);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}

/* Collapsed rail. Width is the only thing that animates — laying out icons and
   labels differently between the two states makes the transition jump. */
#sidebar{transition:width .18s ease,flex-basis .18s ease}
.nav-toggle{position:absolute;top:16px;right:-11px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;font-size:.7rem;line-height:1;padding:0;z-index:30;box-shadow:var(--shadow)}
.nav-toggle:hover{background:var(--surface-2);color:var(--navy)}
#sidebar{position:sticky}
body.nav-mini #sidebar{width:62px;flex:0 0 62px}
body.nav-mini .brand{padding:16px 8px 12px}
body.nav-mini .brand-logo-img,body.nav-mini .brand-sub,body.nav-mini .nav-sec,
body.nav-mini .nav-label,body.nav-mini .who-name,body.nav-mini .who-role{display:none}
body.nav-mini .nav-btn{justify-content:center;padding:10px 0}
body.nav-mini .nav-btn .count{position:absolute;transform:translate(14px,-10px);padding:0 5px;font-size:.62rem}
body.nav-mini .nav-btn{position:relative}
body.nav-mini nav{padding:12px 8px}
body.nav-mini .side-foot{display:flex;justify-content:center;padding:12px 0}
body.nav-mini .who{margin:0}
@media (prefers-reduced-motion:reduce){#sidebar{transition:none}}
.side-foot .who{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--side-ink);font-size:.8rem}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--peach);color:var(--navy);display:grid;place-items:center;font-size:.7rem;font-weight:600;flex:0 0 26px;box-shadow:0 1px 4px rgba(0,0,0,.18)}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:var(--surface-glass);backdrop-filter:saturate(150%) blur(10px);-webkit-backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--line);padding:15px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top h1{font-size:1.18rem}
header.top .sub{color:var(--ink-muted);font-size:.8rem}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main.page{padding:20px 24px 60px;flex:1}

.btn{border:0;border-radius:var(--r-pill);padding:9px 18px;cursor:pointer;background:var(--navy);color:#fff;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:500;white-space:nowrap;transition:background .12s ease,transform .12s ease}
.btn:hover{background:var(--navy-3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sky{background:var(--sky);color:var(--navy)}
.btn.sky:hover{background:#c9edff}
.btn.danger{background:var(--critical);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 12px;font-size:.7rem}
.field label,.filter label{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=month],input[type=email],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--s1);box-shadow:0 0 0 3px var(--focus-ring)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
textarea{min-height:70px;resize:vertical}
textarea.grow{min-height:0;overflow:hidden;resize:none;line-height:1.4;padding:6px 8px}
/* Sized to its content by fitInputWidth(), so a long category name is readable
   without the column having to be wide enough for the longest one. */
input.grow-x{width:auto;min-width:110px;max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:1rem}
.card-h .sub{color:var(--ink-muted);font-size:.78rem}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:18px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.stat .v{font-size:1.5rem;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .n{font-size:.74rem;color:var(--ink-muted)}
.stat.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.stat.warn .k,.stat.warn .n{color:var(--warn-fg)}
.stat.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.stat.bad .k,.stat.bad .n{color:var(--bad-fg)}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-weight:500;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:9px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:2}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.acct td{background:var(--surface-2);font-size:.8rem;color:var(--ink-2)}
tbody tr:hover td{background:var(--row-hover)}
tbody tr.acct:hover td{background:var(--row-hover-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 300px);border-radius:0 0 var(--r-lg) var(--r-lg)}
/* For a table inside a card body rather than filling one: scrolls sideways if
   it has to, instead of pushing its own card open and spilling over the edge. */
.tbl-scroll{overflow-x:auto;max-width:100%}

/* ---------------------------------------------------------------------------
   The sign-in screen.
   Nothing of the application is drawn yet, so it gets the whole window rather
   than a card floating inside empty app chrome. The brand gradient is the same
   one the sidebar wears, so signing in and being signed in feel like the same
   product.
   --------------------------------------------------------------------------- */
body.gate #sidebar, body.gate header.top, body.gate #demoBar{display:none !important}
body.gate #main{background-image:var(--side-img);background-size:cover;background-position:center}
body.gate main.page{display:grid;place-items:center;padding:24px;min-height:100vh}

.gate-card{width:min(420px,100%);background:var(--surface-glass);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lift);padding:36px 34px 30px;text-align:center;
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
.gate-card .mark{width:150px;max-width:64%;height:auto;margin:0 auto 22px;display:block;filter:var(--logo-filter)}
.gate-card h2{font-size:1.3rem;margin-bottom:8px;letter-spacing:-.01em}
.gate-card .lead{color:var(--ink-2);font-size:.88rem;line-height:1.55;margin-bottom:22px}
.gate-card .btn{width:100%;padding:12px 18px;font-size:.78rem}
.gate-card .foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  font-size:.72rem;color:var(--ink-muted);word-break:break-word}
.gate-card .banner{text-align:left;margin:0 0 18px}
.gate-card .kv{text-align:left;margin-bottom:18px}
/* A spinner rather than a static word, so a slow tenant does not look stuck. */
.gate-spin{width:26px;height:26px;margin:0 auto 18px;border-radius:50%;
  border:2.5px solid var(--line-strong);border-top-color:var(--s1);animation:gspin .7s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gate-spin{animation:none}}

/* Deliberately loud, and deliberately not dismissible. */
.demo-bar{background:var(--warn-bg);color:var(--warn-fg);border-bottom:1px solid var(--warn-line);
  padding:8px 24px;font-size:.8rem}
.demo-bar code{background:rgba(127,127,127,.18);padding:1px 5px;border-radius:4px}
td input,td select{padding:5px 7px;font-size:.82rem;border-radius:6px}
td input.num{text-align:right}
/* Qualified with the element, because `input[type=number]{width:100%}` above
   outranks a bare class and these were silently doing nothing on number fields. */
.w80,input.w80,select.w80{width:88px}
.w110,input.w110,select.w110{width:118px}
.w140,input.w140,select.w140{width:148px}

.pill{display:inline-block;padding:2px 10px;border-radius:var(--r-pill);font-size:.7rem;letter-spacing:.04em;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-line)}
.pill.info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-line)}
.pill.mute{background:var(--mute-bg);color:var(--ink-2);border-color:var(--line-strong)}

.drop{border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:40px 24px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .12s ease,background .12s ease}
.drop:hover{border-color:var(--s1)}
.drop.over{border-color:var(--s1);background:var(--info-bg)}
.drop h3{font-size:1.05rem;margin-bottom:6px}
.drop p{color:var(--ink-muted);margin:0}

.banner{border-radius:var(--r-md);padding:12px 15px;margin-bottom:16px;font-size:.86rem;border:1px solid}
.banner.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-fg)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-fg)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-fg)}
.banner code{background:var(--mute-bg);padding:1px 5px;border-radius:4px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(370px,1fr))}
/* Grid items stretch to the tallest in their row by default, which is fine for
   cards of similar height and absurd next to a folded one — a single header row
   stretched to match a table. `top` lets each card be its own height. */
.grid2.top{align-items:start}
/* Compact delete: a word-length button crowds a three-column row off the card. */
.icon-x{width:28px;height:28px;min-width:28px;padding:0;border-radius:50%;
  display:inline-grid;place-items:center;font-size:1.05rem;line-height:1;letter-spacing:0}
.icon-x:hover{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-line)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.85rem}
.kv .k{color:var(--ink-muted)}
.kv .v{font-variant-numeric:tabular-nums;text-align:right}

.toggle-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-pill);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:.76rem;color:var(--ink-2)}
.seg button.on{background:var(--navy);color:#fff}

.modal-back{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:9998;padding:20px;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal-h{padding:18px 22px 0}
.modal-h h2{font-size:1.05rem}
.modal-b{padding:16px 22px;overflow:auto}
.modal-f{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}

#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:var(--toast-bg);color:#fff;padding:11px 16px;border-radius:var(--r-sm);box-shadow:var(--shadow-lift);font-size:.85rem;max-width:380px}
.toast.bad{background:var(--critical)}
.toast.good{background:var(--toast-good)}

.expand{cursor:pointer;user-select:none;color:var(--s1);font-size:.78rem;background:none;border:0;padding:0}
.muted{color:var(--ink-muted)}
.small{font-size:.78rem}
.right{text-align:right}
.nowrap{white-space:nowrap}
.spacer{height:16px}

/* A figure and its label on one line, for the pricing calculator's running
   totals. The last one in a run is the answer, so it is given the weight. */
.result-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.result-line:last-of-type{border-bottom:0}
.result-line strong{font-size:.95rem}
.result-line .mono{font-variant-numeric:tabular-nums}
.result-line:has(strong){font-size:1rem}

/* Foldable cards on the pricing calculator. A closed section keeps its total in
   the header, so folding hides empty rows rather than money. */
.card-h.fold{cursor:pointer;user-select:none}
.card-h.fold:hover{background:var(--mute-bg)}
.card-h.fold:focus-visible{outline:2px solid var(--accent,var(--peach));outline-offset:-2px}
.fold-total{font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums}
.fold-caret{display:inline-block;width:9px;height:9px;margin-left:2px;
  border-right:2px solid var(--ink-muted);border-bottom:2px solid var(--ink-muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s ease}
.fold-caret.open{transform:rotate(-135deg) translate(-3px,-3px)}

/* The answer, told apart from the inputs by being a different thing entirely
   rather than a slightly heavier card. Navy with peach labels is the sidebar
   pill's pairing, so it reads as the brand and not as a highlight box.
   Peach on navy is 7.75:1 and white on navy 16.3:1, both fixed values, so one
   fill serves light and dark. */
.quote-head{position:sticky;top:var(--topbar-h,64px);z-index:10;margin-bottom:18px;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,var(--navy-3) 100%);
  border:1px solid rgba(235,163,128,.22);border-radius:var(--r-lg);
  padding:16px 20px;box-shadow:0 10px 30px rgba(15,36,51,.22)}
.quote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px}
.quote-grid .q{min-width:0}
.quote-grid .q + .q{border-left:1px solid rgba(255,255,255,.13);padding-left:24px}
.quote-grid .k{font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--peach);font-weight:600}
.quote-grid .v{font-size:1.7rem;font-weight:500;line-height:1.15;margin-top:4px;color:#fff;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.quote-grid .n{font-size:.72rem;color:rgba(255,255,255,.66);margin-top:3px}
/* Pinning costs height that a short viewport cannot spare, and the cells stack
   at narrow widths, so below that it simply scrolls with everything else. */
@media (max-width:899px),(max-height:620px){
  .quote-head{position:static}
  .quote-grid .q + .q{border-left:0;padding-left:0}
}
@media print{.quote-head{position:static;box-shadow:none}}

/* The inputs that move nearly every figure, together at the top. */
.keys{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 16px;margin-bottom:16px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.keys .kb{display:flex;flex-direction:column;gap:5px}
.keys .k{font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-muted);font-weight:600}
.keys .seg button{padding:7px 18px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.keys .fum{width:180px}
.keys-note{margin-left:auto;max-width:42ch}

/* Priced lines as rows on a rule rather than cells in a boxed table. Section
   totals ride the rule, so each one is answered where it is asked. */
.rowsec{margin-bottom:26px}
.rowsec:last-child{margin-bottom:0}
.rowsec-h{display:flex;align-items:baseline;gap:12px;padding-bottom:7px;border-bottom:2px solid var(--navy)}
.rowsec-h .t{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.rowsec-h .tot{margin-left:auto;font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums}
.rrow{display:flex;align-items:center;gap:14px;padding:9px 2px;border-bottom:1px solid var(--line)}
.rrow .lbl{flex:1;min-width:0;font-size:.9rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rrow .rnote,.rrow .once{font-size:.76rem;color:var(--ink-muted)}
.rrow .once{white-space:nowrap}
.rrow .price{font-size:.78rem;color:var(--ink-muted);font-variant-numeric:tabular-nums;
  min-width:74px;text-align:right;white-space:nowrap}
.rrow .amt{font-variant-numeric:tabular-nums;font-size:.92rem;min-width:86px;text-align:right}
.rrow.off .lbl,.rrow.off .amt{color:var(--ink-muted)}
.secnote{margin-top:11px}

/* Counts go up one at a time; hours do not, so the middle stays typeable. */
.stepper{display:flex;align-items:center;border:1px solid var(--line-strong);
  border-radius:var(--r-pill);overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:28px;height:28px;font-size:.95rem;
  color:var(--ink-2);cursor:pointer;font-family:inherit;line-height:1;padding:0}
.stepper button:hover{background:var(--mute-bg)}
.stepper .n{width:44px;border:0;background:transparent;text-align:center;font-family:inherit;
  font-size:.85rem;font-variant-numeric:tabular-nums;padding:0;color:inherit;
  -moz-appearance:textfield;appearance:textfield}
.stepper .n::-webkit-outer-spin-button,.stepper .n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .n:focus{outline:0;background:var(--mute-bg)}

/* FUM bands, indented under the ongoing lines they add to. */
.band{display:flex;align-items:center;gap:14px;padding:6px 2px 6px 20px;font-size:.82rem;
  color:var(--ink-2);border-bottom:1px solid var(--line)}
.band .lbl{flex:1;min-width:0}
.band .r{font-variant-numeric:tabular-nums;color:var(--ink-muted);min-width:56px;text-align:right}
.band .a{min-width:86px;text-align:right;font-variant-numeric:tabular-nums}
.band.off{color:var(--ink-muted)}
.band.sum{font-weight:600;color:var(--ink)}

@media (max-width:620px){
  .keys-note{margin-left:0}
  .rrow{flex-wrap:wrap}
  .rrow .lbl{flex:1 0 100%}
}

/* ---------------------------------------------------------------------------
   The report.
   Built into its own container rather than printed from the working screen: a
   thirteen-column table of live inputs is not a document. Everything here is
   drawn with rules and borders, never fills — a browser only prints background
   colour if the person ticks "background graphics", so anything that depends on
   a fill is a report that arrives blank.
   --------------------------------------------------------------------------- */
#report{display:none}
.rep{color:#000;background:#fff;font-family:var(--font);font-size:9.4pt;line-height:1.42}
.rep-head{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid #0f2433;padding-bottom:9px;margin-bottom:12px}
.rep-head img{width:132px;height:auto;filter:brightness(0) saturate(100%) invert(13%) sepia(24%)
  saturate(1420%) hue-rotate(168deg) brightness(94%) contrast(96%)}
.rep-title{margin-left:auto;text-align:right}
.rep-title h1{font-size:15pt;font-weight:600;letter-spacing:-.01em;margin:0;color:#0f2433}
.rep-title .who{font-size:11pt;margin-top:1px}
.rep-title .when{font-size:8.4pt;color:#555;margin-top:2px}
.rep-meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:8.4pt;color:#333;margin-bottom:12px}
.rep-meta b{color:#000;font-weight:600}

.rep-sum{display:flex;gap:8px;margin-bottom:14px}
.rep-sum div{flex:1;border:1px solid #b9c3cb;border-radius:4px;padding:6px 9px}
.rep-sum .k{font-size:6.9pt;letter-spacing:.09em;text-transform:uppercase;color:#555}
.rep-sum .v{font-size:12pt;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}

.rep h2{font-size:10.5pt;font-weight:600;color:#0f2433;margin:16px 0 6px;
  border-bottom:1px solid #0f2433;padding-bottom:3px}
.rep table{width:100%;border-collapse:collapse;font-size:8.8pt}
/* Repeated on every page the table spans, which is the whole reason a report is
   not just the screen with the chrome hidden. */
.rep thead{display:table-header-group}
.rep tfoot{display:table-footer-group}
/* The screen stylesheet gives every th a surface fill and sticky positioning,
   both wrong here — and a fill that only appears when the person happens to
   have background graphics on is worse than no fill at all. */
.rep th{text-align:left;font-size:6.9pt;letter-spacing:.07em;text-transform:uppercase;color:#333;
  font-weight:600;padding:4px 5px;border-bottom:1.2px solid #6b7883;white-space:nowrap;
  background:transparent;position:static}
.rep td{padding:4px 5px;border-bottom:1px solid #dfe4e8;vertical-align:top}
.rep .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rep .nm{font-weight:600}
.rep .id{font-size:7.6pt;color:#555;font-variant-numeric:tabular-nums}
.rep .cmt td{border-bottom:1px solid #dfe4e8;font-size:8.2pt;color:#333;padding:0 5px 5px 5px}
.rep .fnd td{border-bottom:1px dotted #e6eaee;font-size:8.2pt;color:#333}
.rep tfoot td{border-top:1.2px solid #6b7883;border-bottom:0;font-weight:600;padding-top:5px}

/* Adviser sections. Rule weight and whitespace do the sectioning, because a
   tinted band only shows up if the person happens to have background graphics
   switched on — and the section would be invisible for everyone else. */
.rep .grp td{padding:17px 5px 5px;border-top:1.6px solid #0f2433;border-bottom:1px solid #c2cad1;
  font-size:11.5pt;font-weight:700;color:#0f2433;letter-spacing:-.01em}
.rep .grp .meta{font-size:8pt;font-weight:400;color:#555;letter-spacing:0}
/* The first section opens straight under the column headers, so it needs no
   rule of its own — the header's own rule already sits above it. */
.rep tbody tr.grp:first-child td{border-top:0;padding-top:7px}
/* Don't leave a heading stranded as the last line of a page. */
.rep .grp{break-after:avoid}
/* The closing line of a section: bold, and a double rule underneath — the
   accounting convention for a total that ends something. */
.rep .sub td{font-size:9.4pt;font-weight:700;color:#0f2433;padding:6px 5px 7px;
  border-top:1px solid #6b7883;border-bottom:3px double #6b7883}
.rep .cli{break-inside:avoid}
.rep .flag{font-size:7.2pt;border:1px solid #8d98a1;border-radius:8px;padding:0 4px;
  white-space:nowrap;margin-left:3px}
.rep .legend{font-size:7.8pt;color:#444;margin-top:10px;line-height:1.5}
.rep .brk{break-before:page}
.rep .note{font-size:8.4pt;color:#333;border:1px solid #b9c3cb;border-left:3px solid #0f2433;
  border-radius:3px;padding:6px 9px;margin-bottom:12px}
.rep .empty{font-size:9pt;color:#555;padding:8px 0}

@media print{
  @page{size:A4 portrait;margin:11mm 10mm 13mm}
  /* Paper is always light, whatever the screen was showing. The report draws its
     own colours, so this only matters to the fallback below. */
  :root{color-scheme:light;--surface:#fff;--surface-2:#fff;--ink:#000;--ink-2:#333;
    --ink-muted:#555;--line:#ccc;--line-strong:#999;--plane:#fff;--plane-wash:none;
    --row-hover:#fff;--row-hover-2:#fff}
  html,body{height:auto;background:#fff;background-image:none}
  #toasts,.modal-back{display:none !important}
  /* Gated on the class rather than on print alone, so Ctrl+P from a screen with
     no report button still prints that screen instead of a blank page. */
  body.printing #app{display:none !important}
  body.printing #report{display:block !important}

  /* The fallback: printing the working screen, as it did before the report
     existed. Chrome or paper, one of them is always wrong for a live input. */
  body:not(.printing) #sidebar,
  body:not(.printing) header.top,
  body:not(.printing) .no-print{display:none !important}
  body:not(.printing) main.page{padding:0}
  body:not(.printing) .tbl-wrap{max-height:none;overflow:visible}
  body:not(.printing) .card{box-shadow:none;border:0}
  body:not(.printing) th{position:static}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-logo-img" src="CAA_White.png" alt="Coastal Advisory">
      <div class="brand-sub">The Amazing Fee Hub</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="who"><span class="avatar" id="whoAvatar">?</span><span class="who-name" id="whoName">Local mode</span></div>
      <div class="small who-role" id="whoRole">Ops / Admin</div>
    </div>
    <button id="navToggle" class="nav-toggle" type="button" aria-label="Collapse menu">&laquo;</button>
  </aside>

  <div id="main">
    <header class="top">
      <div>
        <h1 id="pgTitle">Run/Dashboard</h1>
        <div class="sub" id="pgSub">No run loaded</div>
      </div>
      <div class="top-actions" id="topActions"></div>
      <span id="saveState" class="pill no-print" hidden></span>
      <button id="themeBtn" class="icon-btn no-print" type="button" aria-label="Theme"></button>
    </header>
    <div id="demoBar" class="demo-bar no-print" hidden></div>
    <main class="page" id="page"></main>
  </div>
</div>
<!-- Filled by buildReport() the moment before printing, and empty the rest of
     the time so it costs nothing to carry. -->
<div id="report"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   CAA Fee Calculator Platform — Coastal Advisory
   Single-file SPA. Phase 1 runs entirely in the browser: drop the monthly
   Xplan extract in, the engine reproduces the workbook's column M–AK maths,
   and advisers review by master client rather than by subfund row.

   Phase 2 swaps the storage layer for MSAL → Graph → SharePoint. Every read
   and write already goes through store.* so only that object changes.
   ========================================================================= */

/* ---------------- configuration ----------------
   Fill these in once IT has registered the Entra app and provisioned the
   lists described in SETUP.md. Until then the app runs in local mode. */
const CONFIG = {
  /* "CAA Fee Calculator Platform", registered 6 Sep 2026. */
  clientId: "366f7021-eae7-4f1b-b5cc-dfa133a57348",
  tenantId: "c315932a-57bd-4717-a27e-dd4a7fb23342",
  sitePath: "coastaladvicegroup.sharepoint.com:/sites/AdviceRequests"
};
const SCOPES = ["Sites.ReadWrite.All", "User.Read"];

/* Set true to work without signing in: the role switcher comes back, identity
   is whatever you click, and everything stays in this browser. For developing
   against a file with no Entra app behind it. Never true in anything anyone
   else opens — a warning bar says so on every screen while it is on. */
let FORCE_LOCAL_MODE = false;

/* No client ID means no sign-in is possible, so there is nobody to be. */
const localMode = () => FORCE_LOCAL_MODE || !connected();
/* All prefixed "Fee Calculator" so they group together in Site Contents and it
   stays obvious which app owns them as more are added to this site. These are

/* Only ever fills a gap. Anyone who has configured real pricing keeps it — the
   sample run then simply shows most of its clients unpriced, which is the
   correct answer rather than a helpful-looking wrong one. */
function installSampleReference() {
  if (!state.rateCard.categories.length) {
    state.rateCard = JSON.parse(JSON.stringify(SAMPLE_RATE_CARD));
    saveRateCard();
  }

  }
  if (!state.funds.length) {
    state.funds = JSON.parse(JSON.stringify(SAMPLE_FUNDS)).map(normaliseFund);
    saveFunds();
  }
}

function sampleRows() {
  let seed = 20260901;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const between = (lo, hi) => lo + rnd() * (hi - lo);

  const SURNAMES = ["Ashford", "Bellamy", "Crane", "Dunmore", "Ellery", "Fairlie", "Gough", "Harlow",
    "Ingram", "Jarratt", "Kellow", "Lonsdale", "Merrick", "Norwood", "Oakley", "Pemberton",
    "Quillan", "Rathbone", "Standish", "Thackeray", "Underhill", "Vane", "Westbrook", "Yardley"];
  const FIRSTS = ["Alan", "Bridget", "Callum", "Delia", "Eamon", "Frances", "Gordon", "Helena",
    "Ivan", "Jenna", "Keith", "Lorna", "Marcus", "Nadia", "Owen", "Petra", "Roland", "Sylvia"];
  /* Fictional, and matching SAMPLE_ADVISERS — except Fairweather, Ivy, who is
     deliberately absent from it so the "adviser not in the directory" exception
     has something to catch. */
  const ADVISERS = ["Aldridge, Petra", "Brannigan, Cole", "Castellan, Ruth",
                    "Deverell, Marcus", "Enfield, Georgia", "Fairweather, Ivy"];
  const VENDORS = ["CFS FirstChoice", "AMP North", "IOOF Group", "OnePath", "HUB24", "Netwealth", "Panorama", "Macquarie WRAP"];
  /* Weighted so the mix mirrors the real book: mostly Essential and the legacy
     letter codes, which is what makes the mapping screen worth showing. */
  const CATEGORIES = ["Essential", "Essential", "Essential", "Essential", "Essential", "Essential", "Essential",
    "F", "F", "F", "F", "F", "E", "E", "E", "Premium", "Premium", "Basic", "Basic",
    "Platinum", "Platinum", "C", "C", "Exclusive", "SMSF"];
  const BASE_FEE = { Essential: 5200, Platinum: 10400, C: 12800, Exclusive: 19500, Premium: 7900,
    Basic: 2400, F: 3500, E: 4700, SMSF: 4200 };

  const rows = [];
  let masterNo = 5100000;
  let groupNo = 7600000;

  for (let i = 0; i < CATEGORIES.length; i++) {
    const category = CATEGORIES[i];
    const adviser = pick(ADVISERS);
    const surname = SURNAMES[i % SURNAMES.length];
    const masterId = String(masterNo += Math.floor(between(700, 9000)));
    const masterName = surname + ", " + pick(FIRSTS);
    /* Roughly one client in five sits in a family group, which is the branch
       that changes how total FUM is aggregated. */
    const grouped = rnd() < 0.2;
    const groupId = grouped ? String(groupNo += 431) : "N/A";
    const currentFee = Math.round(BASE_FEE[category] * between(0.85, 1.15) / 10) * 10;

    const members = [{ id: masterId, name: masterName, entityCat: category }];
    if (rnd() < 0.45) members.push({ id: String(+masterId + 3), name: surname + ", " + pick(FIRSTS), entityCat: category });
    if (rnd() < 0.3)  members.push({ id: String(+masterId + 7), name: surname + " Family Trust", entityCat: "Family" });
    if (rnd() < 0.2)  members.push({ id: String(+masterId + 9), name: surname + " Superannuation Fund", entityCat: "SMSF" });
    if (rnd() < 0.12) members.push({ id: String(+masterId + 11), name: surname + " Holdings Pty Ltd", entityCat: "Client Company" });

    for (const mem of members) {
      /* Every member carries a "Default" line with no value and no vendor —
         the noise the old process filtered out by hand every month. */
      rows.push({ groupId, masterId, masterName, memberId: mem.id, memberName: mem.name,
        adviser, category, entityCat: mem.entityCat, subfundName: "Default", vendor: "N/A",
        value: 0, currentFee });

      const accounts = 1 + Math.floor(rnd() * 3);
      for (let a = 0; a < accounts; a++) {
        const vendor = VENDORS[Math.floor(rnd() * VENDORS.length)];
        const kind = pick(["Super", "Pension", "Investment", "Super Account", "Wrap"]);
        rows.push({ groupId, masterId, masterName, memberId: mem.id, memberName: mem.name,
          adviser, category, entityCat: mem.entityCat,
          subfundName: vendor + " " + kind + " - " + Math.floor(between(100000000, 999999999)) + " - " + mem.name.split(",")[0],
          vendor, value: Math.round(between(38000, 1250000)), currentFee });
      }
      /* A handful of accounts arrive with the platform only in the description,
         which is what the platform-name recovery exists to catch. */
      if (rnd() < 0.25) {
        rows.push({ groupId, masterId, masterName, memberId: mem.id, memberName: mem.name,
          adviser, category, entityCat: mem.entityCat,
          subfundName: pick(["MyNorth", "Expand", "Generation Life", "Challenger"]) + " Investment - " + mem.name.split(",")[0],
          vendor: "N/A", value: Math.round(between(25000, 480000)), currentFee });
      }
    }
  }
  return rows;
}


/* =========================================================================
   State + persistence
   Phase 1 persists to localStorage. store.* is the seam the SharePoint layer
   drops into: same four reads, same four writes.
   ========================================================================= */
const LS = {
  rateCard: "caaFee.rateCard",
  advisers: "caaFee.advisers",
  funds:    "caaFee.funds",
  runs:     "caaFee.runs",
  ui:       "caaFee.ui"
};

const store = {
  read(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { toast("Could not save locally — storage is full or blocked.", "bad"); return false; }
  }
};

/* A card written by an earlier build will not have every key this one reads, so
   fill the gaps from the seed rather than letting a missing key throw on boot.
   A plain spread only reaches the top level — `pricing` is a nested object and
   has to be merged in its own right, or a card saved before the pricing
   calculator existed arrives with `pricing` undefined. */
function hydrateCard(raw) {
  const seed = JSON.parse(JSON.stringify(EMPTY_RATE_CARD));
  if (!raw) return seed;
  const p = raw.pricing || {};
  return { ...seed, ...raw,
    aliases: raw.aliases || {},
    legacyRates: raw.legacyRates || {},
    pricing: { ...seed.pricing, ...p,
      ladders: { ...seed.pricing.ladders, ...(p.ladders || {}) },
      noCsa:   { ...seed.pricing.noCsa,   ...(p.noCsa   || {}) },
      claims:  { ...seed.pricing.claims,  ...(p.claims  || {}) } } };
}

function loadAll() {
  const stored = store.read(LS.rateCard, null);
  state.rateCard = hydrateCard(stored);
  state.advisers = store.read(LS.advisers, null) || JSON.parse(JSON.stringify(EMPTY_ADVISERS));
  state.funds = (store.read(LS.funds, null) || JSON.parse(JSON.stringify(EMPTY_FUNDS))).map(normaliseFund);

  /* Platform names used to be a plain list on the rate card, used only to
     recover a vendor Xplan reported as N/A. They are funds now. Carry them over
     with no caps set rather than making anyone retype them — a fund with no cap
     still does the matching it always did. */
  if (!state.funds.length && stored && Array.isArray(stored.platforms) && stored.platforms.length) {
    state.funds = stored.platforms.map(p => normaliseFund({ name: p }));
    saveFunds();
  }

  state.runs = store.read(LS.runs, {}) || {};
  const ui = store.read(LS.ui, {}) || {};
  state.runKey = ui.runKey && state.runs[ui.runKey] ? ui.runKey : (Object.keys(state.runs).sort().pop() || null);
  /* Only local mode remembers a role, because only local mode lets you choose
     one. Connected, it is a fact about the directory and is resolved at sign-in
     — starting from empty means an unresolved session can do nothing rather
     than briefly being whatever this browser was last time. */
  state.role = localMode() ? (ROLES.includes(ui.role) ? ui.role : "Admin") : "";
  state.asAdviser = localMode() ? (ui.asAdviser || null) : null;
  state.navCollapsed = ui.navCollapsed === undefined ? null : ui.navCollapsed;
  state.theme = ui.theme || "system";
  state.showEmptyDefaults = !!ui.showEmptyDefaults;
  migrateRuns();
}

/* Payment source used to be settable on the client line, which meant one pick
   covered every fund. That control is gone — sources live on the funds now — so
   push any client-level source that was already chosen down onto its own funds.
   Without this a run reviewed under the old build would silently lose the
   payment side of its work. Runs at rest, so it only ever runs once each. */
function migrateRuns() {
  let touched = false;
  for (const key of Object.keys(state.runs)) {
    const run = state.runs[key];
    if (!run || run.fundPayMigrated || !run.rows) continue;
    run.overrides = run.overrides || {};
    run.rows.forEach((r, i) => {
      const mov = run.overrides["master:" + r.masterId];
      const src = mov && mov.paymentSource;
      if (src !== "Direct Debit" && src !== "Platform") return;
      const rk = "row:" + rowKey(r, i);
      const rov = run.overrides[rk] || {};
      if (!rov.paymentSource) { rov.paymentSource = src; run.overrides[rk] = rov; }
    });
    run.fundPayMigrated = true;
    touched = true;
  }
  if (touched) saveRuns();
}

/* "system" deliberately stamps nothing, leaving prefers-color-scheme to decide;
   an explicit choice stamps the root so it beats the OS in both directions. */
function applyTheme() {
  const root = document.documentElement;
  if (state.theme === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", state.theme);
  const btn = $("#themeBtn");
  if (!btn) return;
  const label = { system: "Match system", light: "Light", dark: "Dark" }[state.theme];
  btn.innerHTML = THEME_ICON[state.theme];
  btn.title = "Theme: " + label + " — click to change";
  btn.setAttribute("aria-label", btn.title);
}

const THEME_ICON = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20h8"/></svg>',
  light:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9 6.3 6.3m11.4 11.4 1.4 1.4M19.1 4.9 17.7 6.3M6.3 17.7 4.9 19.1"/></svg>',
  dark:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>'
};
/* One shape, whether the record came from the list, the seed, an older build's
   platform list, or somebody's typing. Everything downstream can then assume
   aliases is an array and the caps are numbers. */
/* One alias per line is the house style, but a comma or a semicolon does the
   same thing — the list is pasted out of a spreadsheet as often as it is typed,
   and a run-together "CFS, FirstChoice" that silently matches nothing is a
   miserable thing to debug. Applied on every path in: typing, the seed, and the
   SharePoint read. */
function splitAliases(v) {
  return (Array.isArray(v) ? v : [v])
    .flatMap(s => String(s == null ? "" : s).split(/[\n,;]+/))
    .map(s => s.trim())
    .filter(Boolean);
}

function normaliseFund(f) {
  f = f || {};
  return {
    name: String(f.name || "").trim(),
    aliases: splitAliases(f.aliases),
    capPct: num(f.capPct),
    capAmount: num(f.capAmount),
    /* Most platforms state their cap inclusive of GST; a few (Macquarie, Grow
       Wrap, Voyage) state it exclusive. Wrong by 10% either way, so it is
       recorded per fund rather than assumed. */
    capInclGst: f.capInclGst !== false,
    minBalance: num(f.minBalance),
    active: f.active !== false,
    notes: String(f.notes || "")
  };
}

/* What a fund will actually allow on a balance, converted onto the same GST
   basis as our own fees so the two are comparable. Returns null when the fund
   has no cap at all, which is a real answer — several platforms have none. */
function fundCap(fund, balance) {
  if (!fund) return null;
  const rc = state.rateCard;
  const gst = 1 + num(rc.gstRate || 0);
  /* Our fees and their cap have to be on the same footing before comparing. */
  const toOurBasis = v => {
    if (fund.capInclGst === !!rc.feesInclGst) return v;
    return fund.capInclGst ? v / gst : v * gst;
  };
  const parts = [];
  /* capPct is held as a percentage, not a fraction — 2.2 for 2.20% — because it
     is copied straight off a PDS forty times over and 0.022 invites a typo. */
  if (fund.capPct > 0) parts.push({ kind: "percentage", value: toOurBasis(fund.capPct / 100 * Math.max(balance, 0)) });
  if (fund.capAmount > 0) parts.push({ kind: "dollar", value: toOurBasis(fund.capAmount) });
  if (!parts.length) return null;
  /* "2.20% pa, capped at $18,000" — the lower of the two is what binds. */
  return parts.reduce((lo, p) => p.value < lo.value ? p : lo);
}

/* Everything down to words, separated by single spaces and wrapped in them.
   " bt " is then a substring of " bt panorama " but not of " debt securities ",
   which is the whole difference between a short alias being usable and being a
   trap. Punctuation, case and runs of spaces all stop mattering, so "HUB 24",
   "HUB-24" and "hub24 " land in the same place. */
const normText = s => " " + String(s == null ? "" : s).toLowerCase()
  .replace(/[^a-z0-9]+/g, " ")
  /* Letters and digits are always split apart, so "HUB24", "HUB 24", "HUB-24"
     and even "HUB24Super" all reduce to the same "hub 24" and agree with each
     other. Without this, whether an alias matched came down to whether whoever
     typed it put a space in — which is not a rule anyone could follow. */
  .replace(/([a-z])(\d)/g, "$1 $2").replace(/(\d)([a-z])/g, "$1 $2")
  .replace(/\s+/g, " ").trim() + " ";

/* Longest token first, so "AMP North" beats a bare "North" no matter what order
   the aliases were typed in. The workbook took the last match in list order,
   which made the answer depend on how the list happened to be sorted. */
function buildFundIndex(funds) {
  const toks = [];
  for (const f of funds) {
    if (f.active === false) continue;
    for (const n of [f.name, ...(f.aliases || [])]) {
      const tok = normText(n);
      if (tok.trim()) toks.push({ tok, fund: f, raw: String(n).trim() });
    }
  }
  return toks.sort((a, b) => b.tok.length - a.tok.length);
}

/* Returns the winning fund, and — when more than one fund's names fit the same
   account — every other fund that also fitted, so the clash can be named rather
   than silently resolved by whichever alias happened to be longer. */
function matchFundDetail(r, index) {
  const vendor = normText(r.vendor);
  const hay = normText(r.subfundName);
  const useVendor = vendor.trim() && vendor.trim() !== "n a";

  const hit = [];
  for (const t of index) {
    /* Vendor is compared both ways: Xplan may report "HUB24" against a fund
       called "HUB24 Super", or the reverse. */
    const onVendor = useVendor && (vendor.includes(t.tok) || t.tok.includes(vendor));
    if (onVendor || hay.includes(t.tok)) hit.push({ t, onVendor });
  }
  if (!hit.length) return { fund: null, rivals: [] };

  /* A vendor match is a statement of fact from Xplan; a name match is an
     inference from free text, so the fact wins wherever there is one. */
  const best = hit.find(h => h.onVendor) || hit[0];
  const rivals = [...new Set(hit.map(h => h.t.fund).filter(f => f !== best.t.fund))];
  return { fund: best.t.fund, rivals, via: best.onVendor ? "vendor" : "name" };
}


/* Local mode writes to this browser; connected, the same call queues a write to
   SharePoint. Every caller in the app is unchanged either way — this is the
   seam the whole thing was built around. */
const saveRateCard = () => localMode() ? store.write(LS.rateCard, state.rateCard) : queueSave("rateCard");
const saveAdvisers = () => localMode() ? store.write(LS.advisers, state.advisers) : queueSave("advisers");
const saveFunds = () => localMode() ? store.write(LS.funds, state.funds) : queueSave("funds");
const saveRuns = () => localMode() ? store.write(LS.runs, state.runs) : queueSave("runs");
const saveUi = () => store.write(LS.ui, {
  runKey: state.runKey, role: state.role, asAdviser: state.asAdviser,
  navCollapsed: state.navCollapsed, theme: state.theme,
  showEmptyDefaults: state.showEmptyDefaults
});

/* =========================================================================
   Microsoft sign-in and Graph

   MSAL is fetched only when a sign-in is actually attempted, so a build with no
   client ID — the shared demo, for instance — never loads it at all.
   ========================================================================= */
const MSAL_SRC = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js";
const MSAL_SRI = "sha384-B5PXeUfgiegchZiX5iMRssMrHd9NfPhFnITob1HyW1CY76udptWpBsniaDsH/+BY";

const connected = () => !!CONFIG.clientId;
let msalApp = null;

function loadMsal() {
  if (window.msal) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = MSAL_SRC;
    s.integrity = MSAL_SRI;          // a tampered CDN is refused rather than run
    s.crossOrigin = "anonymous";
    s.referrerPolicy = "no-referrer";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Could not load the Microsoft sign-in library."));
    document.head.appendChild(s);
  });
}

/* The folder this file sits in, so /repo/ and /repo/index.html resolve to the
   one URI registered in Entra. */
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/i, "");

async function ensureMsal() {
  if (msalApp) return msalApp;
  await loadMsal();
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: "https://login.microsoftonline.com/" + CONFIG.tenantId, redirectUri: redirectUri() },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true },
    system: { iframeHashTimeout: 10000, loadFrameTimeout: 10000 }
  });
  if (msalApp.initialize) await msalApp.initialize();
  await msalApp.handleRedirectPromise();
  const accounts = msalApp.getAllAccounts();
  if (accounts.length && !msalApp.getActiveAccount()) msalApp.setActiveAccount(accounts[0]);
  return msalApp;
}

async function getToken(interactive = true) {
  const app = await ensureMsal();
  const account = app.getActiveAccount();
  if (!account) {
    if (!interactive) throw new Error("Not signed in.");
    await app.loginRedirect({ scopes: SCOPES });
    return "";                                   // navigating away
  }
  try {
    const r = await app.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  } catch (e) {
    if (!interactive) throw e;
    await app.acquireTokenRedirect({ scopes: SCOPES });
    return "";
  }
}

/* Entra's errors are precise but unreadable. These four account for almost every
   first-connection failure, and each has a specific fix. */
function explainAuthError(e) {
  const msg = String((e && e.message) || e || "");
  if (/AADSTS9002326|cross-origin token redemption/i.test(msg)) {
    return "The app registration is set up as a <strong>Web</strong> app rather than a " +
      "<strong>Single-page application</strong>. In Entra → the app → Authentication, remove the Web platform " +
      "and add the same redirect URI under <em>Single-page application</em>.";
  }
  if (/AADSTS50011|redirect_uri|reply url/i.test(msg)) {
    return "The redirect URI isn't registered. This page is served from <code>" + esc(redirectUri()) +
      "</code> — that exact URL, trailing slash and all, must be listed under Authentication → " +
      "Single-page application.";
  }
  if (/AADSTS65001|consent_required|AADSTS90008/i.test(msg)) {
    return "Admin consent hasn't been granted for <code>Sites.ReadWrite.All</code>. In Entra → the app → " +
      "API permissions, an administrator needs to press <em>Grant admin consent</em>.";
  }
  if (/AADSTS700016|unauthorized_client|AADSTS900023/i.test(msg)) {
    return "The tenant doesn't recognise this client ID. Check <code>CONFIG.clientId</code> against the " +
      "Application (client) ID in Entra — it is not the Object ID or the Directory ID.";
  }
  if (/AADSTS50105|not assigned/i.test(msg)) {
    return "Your account isn't assigned to the application. Either assign it in Entra → Enterprise " +
      "applications → Users and groups, or turn off <em>Assignment required</em>.";
  }
  const blocked = explainFetchFailure(e);
  if (blocked) return blocked;
  return esc(msg);
}

async function graph(path, opts = {}) {
  const token = await getToken(opts.interactive !== false);
  const res = await fetch("https://graph.microsoft.com/v1.0" + path, {
    method: opts.method || "GET",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 204) return null;
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const detail = data && data.error ? (data.error.message || data.error.code) : res.statusText;
    throw new Error(res.status + " " + detail);
  }
  return data;
}

/* =========================================================================
   SharePoint

   Reads happen once, into state, so the four hundred places that read
   state.runs or state.rateCard stay synchronous and unchanged. Only writes
   are asynchronous, and they go through a debounced queue — the app saves on
   every keystroke, which is free against localStorage and a PATCH per
   character against Graph.

   Client data is never cached. The monthly extract is fetched into memory when
   a run is opened and is gone when the tab closes, which is the point: nothing
   client-identifying is left in a browser profile on a shared machine.
   ========================================================================= */
const sp = {
  siteId: null,
  lists: {},              // key -> list id
  driveId: null,          // the document library, addressed as a drive
  rateCardId: null,
  fundIds: [],            // parallel to state.funds
  adviserIds: [],         // parallel to state.advisers
  runIds: {},             // runKey -> item id
  overrideIds: {},        // runKey -> adviser -> item id
  lastOverride: {}        // runKey -> adviser -> the JSON last written, to skip no-op writes
};

const normTitle = s => String(s || "").toLowerCase().replace(/[\s_-]/g, "");

async function spResolve() {
  if (sp.siteId) return;
  const site = await graph("/sites/" + CONFIG.sitePath + "?$select=id");
  sp.siteId = site.id;
  const lists = (await graph("/sites/" + sp.siteId + "/lists?$select=id,name,displayName")).value || [];
  const find = (title, optional) => {
    const hit = lists.find(l => normTitle(l.displayName) === normTitle(title))
             || lists.find(l => normTitle(l.name) === normTitle(title));
    if (!hit && !optional) throw new Error('The list "' + title + '" was not found on the site. Settings → Check lists says exactly what is missing.');
    return hit || null;
  };
  for (const k of Object.keys(LIST_TITLES)) {
    const hit = find(LIST_TITLES[k], OPTIONAL_LISTS.includes(k));
    sp.lists[k] = hit ? hit.id : null;
  }
  const lib = find(DOC_LIBRARY);
  sp.driveId = (await graph("/sites/" + sp.siteId + "/lists/" + lib.id + "/drive?$select=id")).id;
}

const spPath = key => "/sites/" + sp.siteId + "/lists/" + sp.lists[key];
const spItems = async key => (await graph(spPath(key) + "/items?expand=fields&$top=999")).value || [];
const spCreate = (key, fields) => graph(spPath(key) + "/items", { method: "POST", body: { fields } });
const spUpdate = (key, id, fields) => graph(spPath(key) + "/items/" + id + "/fields", { method: "PATCH", body: fields });
const spDelete = (key, id) => graph(spPath(key) + "/items/" + id, { method: "DELETE" });

/* The extract is a file, not list items: ~1,800 rows a month would be 22,000
   list items a year against a 5,000-item view threshold. */
const runFilePath = key => key.slice(0, 4) + "/" + key + "/rows.json";

async function spPutFile(path, text) {
  const token = await getToken(false);
  const res = await fetch("https://graph.microsoft.com/v1.0/drives/" + sp.driveId +
    "/root:/" + encodeURI(path) + ":/content",
    { method: "PUT", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: text });
  if (!res.ok) throw new Error("Could not save the extract (" + res.status + " " + res.statusText + ").");
  return res.json();
}

/* Graph does not hand back file content: it answers /content with a 302 to a
   pre-authenticated SharePoint URL, and fetch follows it. That redirected
   request has to satisfy the page's CSP as well, so the tenant's SharePoint
   origin is in connect-src at the top of this file. Without it the browser
   blocks the redirect and fetch rejects with a bare "Failed to fetch" that
   names nothing — the console does, but the app cannot see it.

   Uploading has no such problem: a PUT under 4MB is handled by Graph directly.
   So this fails only on read, and only once a run exists to read. */
async function spGetFile(path) {
  const token = await getToken(false);
  const res = await fetch("https://graph.microsoft.com/v1.0/drives/" + sp.driveId +
    "/root:/" + encodeURI(path) + ":/content", { headers: { Authorization: "Bearer " + token } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("Could not read the extract (" + res.status + " " + res.statusText + ").");
  return res.json();
}

/* "Failed to fetch" is what a CSP-blocked request looks like from inside the
   page, and it says nothing about which request or why. Since the one thing
   that can produce it here is the SharePoint redirect above, say so rather
   than passing the browser's word along. */
function explainFetchFailure(e) {
  const msg = String((e && e.message) || e || "");
  if (!/failed to fetch|networkerror|load failed/i.test(msg)) return "";
  const host = "https://" + CONFIG.sitePath.split(":")[0];
  return "The browser blocked a request before it was sent. Reading the monthly extract " +
    "redirects to <code>" + esc(host) + "</code>, so that address has to be listed in this page's " +
    "<code>connect-src</code> Content-Security-Policy — check the <code>&lt;meta&gt;</code> tag at the top of " +
    "<code>index.html</code>. The browser console names the exact address it blocked.";
}

/* ---- shapes: list row <-> the objects the app already works in ---- */

function adviserFromRow(f) {
  return {
    name: String(f.Title || ""),
    role: ROLES.includes(f.AccessRole) ? f.AccessRole : "Adviser",
    region: String(f.Region || ""),
    email: String(f.Email || ""),
    active: f.IsActive !== false,
    /* Set in SharePoint, not here — writing a person column needs the site
       user id, and Email is the match that matters anyway. */
    userName: personName(f.AdviserUser)
  };
}
function adviserToFields(a) {
  const f = { Title: a.name || "", AccessRole: a.role || "Adviser", Email: a.email || "", IsActive: a.active !== false };
  if (a.region) f.Region = a.region;     // a Choice column rejects ""
  return f;
}

function fundFromRow(f) {
  return normaliseFund({
    name: f.Title, aliases: f.Aliases, capPct: f.CapPercent, capAmount: f.CapAmount,
    capInclGst: f.CapInclGst !== false, minBalance: f.MinBalance,
    active: f.IsActive !== false, notes: f.Notes
  });
}
function fundToFields(f) {
  return {
    Title: f.name || "", Aliases: (f.aliases || []).join("\n"),
    CapPercent: num(f.capPct), CapAmount: num(f.capAmount),
    CapInclGst: !!f.capInclGst, MinBalance: num(f.minBalance),
    IsActive: !!f.active, Notes: f.notes || ""
  };
}

/* One row per adviser per run, so two advisers reviewing at the same moment
   never write the same item. The app holds overrides as one flat object, so
   they are split on the way out by whose client each one touches. */
function partitionOverrides(run) {
  const owner = new Map();
  if (state.calc) for (const m of state.calc.masters) owner.set(m.masterId, m.adviser || "");
  const bucket = new Map();
  const put = (adviser, k, v) => {
    if (!bucket.has(adviser)) bucket.set(adviser, {});
    bucket.get(adviser)[k] = v;
  };
  for (const k of Object.keys(run.overrides || {})) {
    const body = k.slice(k.indexOf(":") + 1);
    let masterId = "";
    if (k.startsWith("master:") || k.startsWith("add:")) masterId = body;
    else if (k.startsWith("row:")) {
      masterId = body.startsWith("add~") ? (masterOfAddedFund(body.slice(4)) || "") : body.split("~")[1] || "";
    }
    put(owner.get(masterId) || "(unassigned)", k, run.overrides[k]);
  }
  /* Every adviser in the run gets a row even with no edits, because the row is
     also where their status lives. */
  for (const a of owner.values()) if (a && !bucket.has(a)) bucket.set(a, {});
  for (const a of Object.keys(run.adviserStatus || {})) if (!bucket.has(a)) bucket.set(a, {});
  return bucket;
}

/* =========================================================================
   Who you are

   The role decides which screens open, and it comes from the adviser directory
   rather than from anything the browser can be talked into. This is not the
   security boundary — that is who can reach the SharePoint site at all, see
   SETUP.md — but it is what stops an adviser wandering into someone else's
   book, and it has to be a fact about the directory rather than a preference.
   ========================================================================= */

/* SharePoint hands a person column back in several shapes depending on how the
   item was written, so take whatever is there. */
function personName(v) {
  if (!v) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.map(personName).filter(Boolean).join(" ");
  return String(v.LookupValue || v.DisplayName || v.displayName || v.Title || "");
}

async function resolveIdentity() {
  const me = await graph("/me?$select=id,displayName,mail,userPrincipalName", { interactive: false });
  const email = String(me.mail || me.userPrincipalName || "").toLowerCase();
  const name = String(me.displayName || "").trim();

  await spResolve();
  const items = await spItems("advisers");
  /* Kept so the directory does not have to be read twice on the way in. */
  sp.adviserIds = items.map(i => i.id);
  state.advisers = items.map(i => adviserFromRow(i.fields || {}));
  const rows = items.map(i => i.fields || {}).filter(f => f.Title || f.AccessRole);

  /* Email first: it is an exact string we control, and it survives someone's
     display name changing. The person column and the Title are fallbacks for
     rows where the email was never filled in. */
  const lower = s => String(s || "").trim().toLowerCase();
  let matchedBy = "";
  let row = email && rows.find(f => lower(f.Email) === email);
  if (row) matchedBy = "email";
  if (!row && name) {
    row = rows.find(f => lower(personName(f.AdviserUser)) === lower(name));
    if (row) matchedBy = "directory name";
  }
  if (!row && name) {
    row = rows.find(f => lower(f.Title) === lower(name));
    if (row) matchedBy = "Title";
  }

  const anyAdmin = rows.some(f => f.AccessRole === "Admin" && f.IsActive !== false);
  const id = { me, name, email, row: row || null, matchedBy, anyAdmin, rows: rows.length,
               role: null, bootstrap: false, inactive: false };

  if (!row) {
    /* Nobody is an Admin yet, so the first person in has to be one or the site
       owner is locked out of their own app. Loud about it, and it closes the
       moment a real Admin row exists. */
    if (!anyAdmin) { id.role = "Admin"; id.bootstrap = true; }
    return id;
  }
  if (row.IsActive === false) { id.inactive = true; return id; }
  if (ROLES.includes(row.AccessRole)) id.role = row.AccessRole;
  return id;
}

/* ---- reads ---- */

async function loadReference() {
  const cards = await spItems("rateCard");
  const active = cards.find(i => (i.fields || {}).IsActive) || cards[cards.length - 1];
  if (!active) {
    sp.rateCardId = null;
    state.rateCard = JSON.parse(JSON.stringify(EMPTY_RATE_CARD));
  } else {
    sp.rateCardId = active.id;
    const f = active.fields || {};
    let card;
    try { card = JSON.parse(f.CardJson || "{}"); }
    catch (e) { throw new Error("The rate card row's CardJson is not valid JSON. Fix it in SharePoint, or clear it and set the pricing again here."); }
    state.rateCard = hydrateCard(card);
    if (!state.rateCard.version) state.rateCard.version = String(f.Title || "");
  }

  const funds = await spItems("funds");
  sp.fundIds = funds.map(i => i.id);
  state.funds = funds.map(i => fundFromRow(i.fields || {}));
}

/* Metadata only. The extract behind each run is a file and is fetched when
   somebody actually opens that month. */
async function loadRunIndex() {
  const items = await spItems("runs");
  state.runs = {};
  sp.runIds = {};
  for (const i of items) {
    const f = i.fields || {};
    const key = String(f.Title || "");
    if (!/^\d{4}-\d{2}$/.test(key)) continue;
    sp.runIds[key] = i.id;
    let snap = {};
    try { snap = JSON.parse(f.RateCardSnapshot || "{}"); } catch (e) { /* a run with an unreadable snapshot still opens */ }
    state.runs[key] = {
      key,
      status: RUN_STATUS.includes(f.RunStatus) ? f.RunStatus : "Draft",
      sourceName: String(f.SourceFile || ""),
      rowCount: num(f.RowCount),
      createdAt: i.createdDateTime || "",
      rateCardSnapshot: snap.rateCard || null,
      fundsSnapshot: snap.funds || [],
      /* Read back so a later save of the same run rewrites it rather than
         blanking the column. */
      summary: (() => { try { return f.SummaryJson ? JSON.parse(f.SummaryJson) : null; } catch (e) { return null; } })(),
      rows: null,               // not loaded yet — everything guards on this
      overrides: {},
      adviserStatus: {},
      loaded: false
    };
  }
  const keys = Object.keys(state.runs).sort();
  if (!state.runKey || !state.runs[state.runKey]) state.runKey = keys.pop() || null;
}

async function loadRun(key) {
  const run = state.runs[key];
  if (!run || run.loaded) return;
  const data = await spGetFile(runFilePath(key));
  run.rows = (data && Array.isArray(data.rows)) ? data.rows : [];
  run.isSample = false;

  const items = await spItems("overrides");
  run.overrides = {};
  run.adviserStatus = {};
  sp.overrideIds[key] = {};
  sp.lastOverride[key] = {};
  for (const i of items) {
    const f = i.fields || {};
    if (String(f.RunKey || "") !== key) continue;
    const adviser = String(f.Adviser || "");
    sp.overrideIds[key][adviser] = i.id;
    let ov = {};
    try { ov = JSON.parse(f.OverridesJson || "{}"); } catch (e) { /* one bad row must not sink the month */ }
    Object.assign(run.overrides, ov);
    sp.lastOverride[key][adviser] = JSON.stringify(ov);
    run.adviserStatus[adviser] = {
      status: ADVISER_STATUS.includes(f.AdviserStatus) ? f.AdviserStatus : "Not started",
      submittedAt: f.SubmittedAt || null,
      approvedAt: f.ApprovedAt || null,
      approver: personName(f.Approver),
      note: String(f.ReturnNote || "")
    };
  }
  run.loaded = true;
}

/* ---- writes ----
   Debounced and coalesced: twenty keystrokes in a row are one PATCH. The state
   is shown in the top bar and leaving with something unsaved is warned about,
   because a save that quietly failed is worse than no save at all. */
const saver = { pending: new Set(), timer: null, busy: false, failed: 0 };

function queueSave(what) {
  if (localMode()) return;
  saver.pending.add(what);
  state.saveState = "pending";
  paintSaveState();
  clearTimeout(saver.timer);
  saver.timer = setTimeout(flushSaves, 1200);
}

async function flushSaves() {
  if (saver.busy || !saver.pending.size) return;
  saver.busy = true;
  const doing = [...saver.pending];
  saver.pending.clear();
  state.saveState = "saving";
  paintSaveState();
  try {
    for (const what of doing) {
      if (what === "rateCard") await writeRateCard();
      else if (what === "funds") await writeFunds();
      else if (what === "advisers") await writeAdvisers();
      else if (what === "runs") await writeRun();
    }
    saver.failed = 0;
    state.saveState = "saved";
    state.saveError = "";
  } catch (e) {
    /* Put the work back so the next edit, or the retry, picks it up again. */
    for (const w of doing) saver.pending.add(w);
    saver.failed++;
    state.saveState = "error";
    state.saveError = (e && e.message) || String(e);
    if (saver.failed <= 3) setTimeout(flushSaves, 4000 * saver.failed);
  }
  saver.busy = false;
  paintSaveState();
  if (saver.pending.size && state.saveState !== "error") setTimeout(flushSaves, 200);
}

async function writeRateCard() {
  const card = JSON.parse(JSON.stringify(state.rateCard));
  const fields = { CardJson: JSON.stringify(card), IsActive: true, Title: card.version || "Current" };
  if (sp.rateCardId) await spUpdate("rateCard", sp.rateCardId, fields);
  else sp.rateCardId = (await spCreate("rateCard", { ...fields, EffectiveFrom: new Date().toISOString() })).id;
}

/* Row by row, because the fund table is edited a row at a time and a whole-list
   rewrite would churn every item's Modified stamp on one cap change. */
async function writeFunds() {
  for (let i = 0; i < state.funds.length; i++) {
    const fields = fundToFields(state.funds[i]);
    if (sp.fundIds[i]) await spUpdate("funds", sp.fundIds[i], fields);
    else sp.fundIds[i] = (await spCreate("funds", fields)).id;
  }
  while (sp.fundIds.length > state.funds.length) {
    const gone = sp.fundIds.pop();
    if (gone) await spDelete("funds", gone);
  }
}

async function writeAdvisers() {
  for (let i = 0; i < state.advisers.length; i++) {
    const fields = adviserToFields(state.advisers[i]);
    if (sp.adviserIds[i]) await spUpdate("advisers", sp.adviserIds[i], fields);
    else sp.adviserIds[i] = (await spCreate("advisers", fields)).id;
  }
  while (sp.adviserIds.length > state.advisers.length) {
    const gone = sp.adviserIds.pop();
    if (gone) await spDelete("advisers", gone);
  }
}

async function writeRun() {
  const run = currentRun();
