    ? '<div class="banner ' + (sections.some(s => s.count && s.tone === "bad") ? "warn" : "info") +
      ' no-print"><strong>' + open + " of " + sections.length + " checks have something in them.</strong> " +
      "Anything in red is open below; the rest are folded with their count on the header. Click a tile to jump to one.</div>"
    : '<div class="banner ok no-print"><strong>Nothing outstanding.</strong> Every check on this run is clear.</div>';

  html += exceptionTiles(sections, extras);
  html += sections.map(exceptionSection).join("");
  return html;
}

/* ---------------- Approvals ---------------- */
function viewApprovals() {
  const run = currentRun(), c = state.calc;
  if (!run) return '<div class="banner warn">Load a run first.</div>';

  const advisers = [...new Set(c.masters.map(m => m.adviser))].filter(Boolean).sort();
  let html = '<div class="banner info no-print">Advisers submit their own book. Ops or a manager then approves or returns it. ' +
    'A run can only be locked once every adviser is approved.</div>';

  html += '<div class="card"><div class="card-h"><h2>Adviser sign-off</h2>' +
    '<div class="sub">Click an adviser to see their book without leaving this screen</div>' +
    '<div class="right no-print">' +
    /* The recovery path. Opening a run queues the invitations once, and if the
       directory was wrong at that moment nothing was written and the button
       that would have done it is gone. This re-runs it for anybody still
       without one, and is safe to press repeatedly. */
    (run.status === "Open for Review" && can("approve")
      ? '<button class="btn ghost" id="btnNotify">Notify advisers</button>' : "") +
    '<button class="btn ghost" id="btnRemindAll">Copy chase list</button></div></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th></th><th>Adviser</th><th>Region</th><th class="num">Clients</th>' +
    '<th class="num">Total FUM</th><th class="num">Current</th><th class="num">New</th><th class="num">Movement</th>' +
    '<th>Needs a look</th><th>Status</th><th class="no-print"></th></tr></thead><tbody>';

  for (const a of advisers) {
    const ms = c.masters.filter(m => m.adviser === a);
    const cur = ms.reduce((x, m) => x + (m.currentFee || 0), 0);
    const nw = ms.reduce((x, m) => x + (m.fee || 0), 0);
    const fum = [...new Set(ms.map(m => m.fumKey))]
      .reduce((x, k) => x + (ms.find(m => m.fumKey === k).totalFum || 0), 0);
    const st = adviserState(a);
    const dir = state.advisers.find(x => x.name === a);
    const open = !!state.expandedAdviser[a];
    const att = attentionFor(ms, (c.removed || []).filter(m => m.adviser === a));

    html += '<tr><td><button class="expand" data-expa="' + esc(a) + '">' + (open ? "&minus;" : "+") + "</button></td>" +
      "<td><strong>" + esc(a) + "</strong>" + (dir && dir.email ? '<div class="small muted">' + esc(dir.email) + "</div>" : "") + "</td>" +
      "<td>" + esc(dir ? dir.region : "—") + '</td><td class="num">' + ms.length + "</td>" +
      '<td class="num">' + money(fum) + '</td>' +
      '<td class="num">' + money(cur) + '</td><td class="num">' + money(nw) + '</td><td class="num">' + money(nw - cur) + "</td>" +
      "<td>" + (att.total
        ? att.parts.map(p => '<span class="pill ' + p.cls + '">' + esc(p.label) + "</span>").join(" ")
        : '<span class="pill ok">nothing flagged</span>') + "</td>" +
      '<td><span class="pill ' + statusPill(st.status) + '">' + esc(st.status) + "</span>" +
        (st.note ? '<div class="small muted">' + esc(st.note) + "</div>" : "") + "</td>" +
      '<td class="no-print nowrap">' +
        (st.status === "Submitted"
          ? '<button class="btn btn-sm" data-appr="' + esc(a) + '">Approve</button> ' +
            '<button class="btn ghost btn-sm" data-ret="' + esc(a) + '">Return</button>'
          : '<button class="btn ghost btn-sm" data-sub="' + esc(a) + '">Mark submitted</button>') +
        /* Anyone who is not finished can be chased by hand. This is also the
           only thing that reaches someone whose work was sent back after they
           had submitted — their scheduled reminder is gone by then. */
        (["Not started", "In progress", "Returned"].includes(st.status)
          ? ' <button class="btn ghost btn-sm" data-remind="' + esc(a) + '">Send reminder</button>'
          : "") +
      "</td></tr>";

    if (open) html += approvalDetail(a, ms);
  }
  html += "</tbody></table></div></div>";
  return html;
}

/* What a manager is actually scanning for. Deliberately the same three things
   the completion email will report, so the screen and the email never disagree
   about whether an adviser's book needs looking at. */
/* `removed` is passed separately because removed clients are deliberately not in
   `masters` — and a client taken out of the month is the one thing here a
   manager most needs told about, since it is invisible everywhere else. */
function attentionFor(ms, removed) {
  const parts = [];
  const band = ms.filter(m => m.outsideBand).length;
  const platform = ms.filter(m => m.overCap || m.underMinBalance.length).length;
  const below = ms.filter(m => m.belowCurrent).length;
  const gone = (removed || []).length;
  const tier = ms.filter(m => m.aboveTier).length;
  if (gone) parts.push({ label: gone + " removed", cls: "bad" });
  /* Singular reads badly in an email, and this line goes in one. */
  if (tier) parts.push({ label: tier + (tier === 1 ? " requires a tier upgrade" : " require tier upgrades"), cls: "warn" });
  if (band) parts.push({ label: band + " off band", cls: "warn" });
  if (platform) parts.push({ label: platform + " platform issue" + (platform > 1 ? "s" : ""), cls: "bad" });
  if (below) parts.push({ label: below + " below current", cls: "bad" });
  return { parts, total: gone + tier + band + platform + below };
}

/* The adviser's book, inline. Read-only on purpose: this screen is for deciding
   whether to approve, and an approver editing an adviser's numbers under their
   name is a different thing that ought to go through Return. */
function approvalDetail(adviser, ms) {
  let h = '<tr class="acct"><td></td><td colspan="10" style="padding:0">' +
    '<table style="width:100%"><thead><tr><th>Client</th><th>Category</th><th class="num">Total FUM</th>' +
    '<th class="num">Current</th><th class="num">New</th><th class="num">Movement</th><th>Fee type</th>' +
    "<th>Flags</th></tr></thead><tbody>";

  for (const m of [...ms].sort((a, b) => (b.fee || 0) - (a.fee || 0))) {
    const flags = reportFlags(m);
    h += "<tr><td><strong>" + esc(m.name) + '</strong><div class="small muted mono">Xplan ' + esc(m.masterId) + "</div></td>" +
      "<td>" + esc(m.category || "—") + '</td><td class="num">' + money(m.totalFum) + "</td>" +
      '<td class="num">' + money(m.currentFee) + '</td><td class="num">' + money(m.fee) +
      '</td><td class="num">' + signed(m.variance) + "</td>" +
      "<td>" + esc(feeTypeLabel(m)) + "</td>" +
      "<td>" + (flags.length
        ? flags.map(f => '<span class="pill ' + (/off band/.test(f) ? "warn" : "bad") + '">' + esc(f) + "</span>").join(" ")
        : '<span class="small muted">&mdash;</span>') + "</td></tr>";
    if (m.comment) {
      h += '<tr><td colspan="8" class="small muted" style="padding-top:0"><strong>Note:</strong> ' + esc(m.comment) + "</td></tr>";
    }
  }
  h += "</tbody></table></td></tr>";
  return h;
}

/* ---------------- Rate Card ---------------- */
/* =========================================================================
   Pricing calculator
   Quotes a new or existing client off the internal pricing sheet, and prices an
   insurance claim. It reads pricing and writes nothing: no client is named, no
   quote is saved, and every figure is gone when the tab closes.
   ========================================================================= */

const pricing = () => (state.rateCard && state.rateCard.pricing) || EMPTY_PRICING;

/* Held in memory on purpose. A FUM figure typed in here is client information
   and has no business in localStorage. */
const pricingInputs = {
  tab: "advice",              // "advice" | "claims"
  clientType: "EXISTING",
  qty: {},                    // item id -> count, or hours for an hourly line
  fum: 0,
  onAgreement: true,
  meansTested: false,
  /* claims */
  benefit: 0,
  commissions: 0,
  rateIdx: 0,
  compHours: 0,
  totalHours: 0,
  multiClaim: false,
  /* The monthly management fee is income protection only, so it is asked for
     rather than assumed — a TPD or trauma claim carries no monthly charge and
     the results panel should not imply one. */
  ipOngoing: false,
  /* Only the reference panel folds now. Every priced section is on show, which
     is the point of this layout — the folding was hiding the thing people came
     to look at. */
  open: { reference: false }
};

/* The advice fee sections, which is also the order the Line items editor shows
   them in. ANCILLARY is deliberately absent: it is edited on its own card and
   totalled on its own, because it is not an advice fee. */
const PRICE_SECTIONS = [
  { id: "soa",    label: "SOA fees",        group: "Upfront" },
  { id: "impl",   label: "Implementation",  group: "Upfront" },
  { id: "csa",    label: "Ongoing (CSA)",   group: "Ongoing" },
  { id: "hourly", label: "Fee for service", group: "Hourly"  }
];

function priceAdvice() {
  const p = pricing();
  const ct = pricingInputs.clientType;
  const items = (p.items || []).map((it, i) => {
    const raw = ct === "NEW" ? it.newPrice : it.existingPrice;
    const price = (raw === null || raw === undefined || raw === "") ? null : num(raw);
    return { ...it, i, price, na: price === null,
             qty: it.kind === "min" ? 1 : num(pricingInputs.qty[it.id] || 0) };
  });

  /* An insurance-only engagement carries no base SOA fee. One line cancelling
     another is the sheet's rule, kept as a flag on the line that does it. */
  const suppressed = {};
  for (const i of items) if (i.suppressesMin && !i.na && i.qty > 0) suppressed[i.section] = true;

  for (const i of items) {
    i.suppressed = i.kind === "min" && !!suppressed[i.section];
    i.amount = i.na || i.suppressed ? 0 : (i.kind === "min" ? i.price : i.qty * i.price);
  }

  const sum = s => items.filter(i => i.section === s).reduce((a, i) => a + i.amount, 0);
  const soa = sum("soa"), impl = sum("impl"), csa = sum("csa"), hourly = sum("hourly");

  /* Ancillary splits by how often it is charged rather than by section, because
     a one-off lending fee and an annual accounting retainer are two different
     numbers and adding them together would be arithmetic nobody asked for.
     `ancSet` is whether any are configured at all — the section and its card
     appear on that, not on whether a quantity has been typed, so the figures
     can repaint in place instead of the card arriving mid-keystroke. */
  const ancSum = yearly => items
    .filter(i => i.section === ANCILLARY && (i.kind === "year") === yearly)
    .reduce((a, i) => a + i.amount, 0);
  const ancOnce = ancSum(false), ancYear = ancSum(true);
  const ancSet = items.some(i => i.section === ANCILLARY);

  const ladder = ((p.ladders || {})[ct] || []).map(b => ({ from: num(b.from), rate: num(b.rate) }));
  const fum = num(pricingInputs.fum);
  const fumFee = ladder.length ? surchargeFor(fum, ladder) : 0;

  const ongoing = csa + fumFee;
  const upfront = soa + impl;

  /* The service tier a client lands in is decided by the ongoing fee, not by
     what they hold — a small balance on a lot of entities still climbs. */
  const packs = [...(p.packages || [])].sort((a, b) => num(a.from) - num(b.from));
  let pack = null;
  for (const k of packs) if (ongoing >= num(k.from)) pack = k;

  /* Centrelink admin sits outside the agreement and is invoiced or direct
     debited, so it is never rolled into either total. */
  const src = pricingInputs.onAgreement ? pack : p.noCsa;
  const centrelink = src ? num(pricingInputs.meansTested ? src.mtf : src.cas) : null;

  return { items, soa, impl, csa, hourly, ladder, fum, fumFee, ongoing, upfront,
           pack, centrelink, packs, ancOnce, ancYear, ancSet,
           pctOfFum: fum > 0 ? ongoing / fum : null };
}

function priceClaim() {
  const c = pricing().claims || {};
  const tiers = (c.tiers || []).map(t => ({ from: num(t.from), rate: num(t.rate) }));
  const benefit = num(pricingInputs.benefit);
  const tierFee = tiers.length ? surchargeFor(benefit, tiers) : 0;
  const comms = num(pricingInputs.commissions);
  /* Commissions already earned offset this claim's fee but cannot push it below
     zero — a long commission history reduces the fee to nil, it does not create
     a credit that eats into the hourly charge. */
  const commsApplied = Math.min(comms, tierFee);
  const lump = Math.max(0, tierFee - comms);

  const rateRow = (c.rates || [])[pricingInputs.rateIdx] || null;
  const rate = rateRow ? num(rateRow.hourly) : 0;
  const billable = Math.max(0, num(pricingInputs.totalHours) - num(pricingInputs.compHours));
  const hoursFee = billable * rate;

  const disc = pricingInputs.multiClaim ? num(c.multiDiscount) : 0;
  /* The monthly management fee is an ongoing charge rather than a claim fee, so
     the multi-claim discount does not touch it. */
  const ipMonthly = rateRow ? num(rateRow.ipMonthly) : 0;
  return { tiers, benefit, tierFee, comms, commsApplied, capped: comms > tierFee,
           lump, lumpNet: lump * (1 - disc), rateRow, rate, billable, hoursFee,
           hoursNet: hoursFee * (1 - disc), disc, ipMonthly,
           ipOngoing: !!(pricingInputs.ipOngoing && ipMonthly) };
}

/* A figure in the pinned results panel. Its own builder rather than stat(),
   which is for the white cards the rest of the app uses. */
const quoteCard = (k, v, n) =>
  '<div class="q"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + "</div>" +
  '<div class="n">' + esc(n || "") + "</div></div>";
const quoteHead = cells => '<div class="quote-head"><div class="quote-grid">' + cells + "</div></div>";

/* One card carrying two different kinds of money. Leading with whichever is
   actually on the quote beats showing $0 beside a real annual figure, so a
   client with only a retainer sees the retainer. Shared with paintPricing() so
   the pinned panel and a rebuild cannot word it differently. */
function ancCard(a) {
  const yearOnly = !a.ancOnce && a.ancYear;
  return {
    v: money(yearOnly ? a.ancYear : a.ancOnce),
    n: yearOnly ? "per year, outside both totals"
      : a.ancYear ? "plus " + money(a.ancYear) + " per year"
      : "one-off, outside both totals"
  };
}

const pricingTabBtn = (id, label) =>
  '<button class="btn' + (pricingInputs.tab === id ? "" : " ghost") + '" data-ptab="' + id + '">' + esc(label) + "</button>";

/* =========================================================================
   CSA Tracker
   The weekly Incomplete task report, with the two fee figures joined on from
   the current run, the ageing worked out, and a way to take one off the chase.
   ========================================================================= */

/* An adviser may tick off their own; Advice Operations and above, anybody's. */
const csaCanMark = i => can("csaLoad") ||
  (can("ownBook") && (i.adviser === state.asAdviser || i.taskAdviser === state.asAdviser));

const CSA_FILTERS = [
  { id: "open",    label: "Being chased" },
  { id: "expired", label: "Already expired" },
  { id: "marked",  label: "Marked off" },
  { id: "all",     label: "Everything" }
];

function csaFiltered(csa, list) {
  switch (state.csaFilter) {
    case "expired": return list.filter(i => i.expired && !i.suppressed);
    case "marked":  return list.filter(i => i.marked);
    case "all":     return list;
    default:        return list.filter(i => !i.suppressed);
  }
}

function csaRow(i) {
  const stage = '<span class="pill ' +
    ({ overdue: "bad", due: "warn", soon: "info", upcoming: "", unknown: "warn" }[i.stage] || "") +
    '">' + esc(CSA_STAGE_LABEL[i.stage]) + "</span>";
  const aged = i.expired
    ? '<span class="pill bad">' + i.expiredDays + " day" + (i.expiredDays === 1 ? "" : "s") + "</span>"
    : i.csaEnd ? '<span class="small muted">ends ' + esc(dayLabel(i.csaEnd)) + "</span>"
    : '<span class="small muted">&mdash;</span>';

  /* Two notes that change who should act, so they sit on the row rather than
     only in the exceptions block further down. */
  const flags =
    (i.mismatch ? '<span class="pill warn" title="The fee run says ' + esc(i.adviser) +
      '; the Xplan task says ' + esc(i.taskAdviser) + '">adviser differs</span> ' : "") +
    (!i.master ? '<span class="pill warn" title="No matching client in the current fee run">not in run</span> ' : "") +
    (i.marked && i.marked.disputedAt
      ? '<span class="pill bad" title="Marked signed on ' + esc(dayLabel(i.marked.markedAt.slice(0, 10))) +
        ' but still on the report">still showing</span> '
      : i.marked ? '<span class="pill good">marked off</span> ' : "");

  return "<tr" + (i.suppressed ? ' class="muted"' : "") + "><td>" + esc(i.client) +
    (i.tier ? ' <span class="small muted">' + esc(i.tier) + "</span>" : "") +
    (flags ? "<br>" + flags : "") + "</td>" +
    "<td>" + esc(i.adviser || "—") + "</td>" +
    "<td>" + aged + "</td>" +
    "<td>" + esc(dayLabel(i.due)) + "<br>" + stage + "</td>" +
    '<td class="num">' + money(i.currentFee) + "</td>" +
    '<td class="num">' + money(i.calcFee) + "</td>" +
    '<td class="no-print">' + (csaCanMark(i)
      ? (i.marked
          ? '<button class="btn ghost btn-sm" data-csaundo="' + esc(i.threadId) + '">Undo</button>'
          : '<button class="btn ghost btn-sm" data-csamark="' + esc(i.threadId) + '">Mark signed</button>')
      : "") + "</td></tr>";
}

function csaExceptionBlocks(csa) {
  const blocks = [
    { key: "mismatch", title: "Adviser differs between the run and the task",
      list: csa.exMismatch,
      why: "The fee run and the Xplan task name different advisers. The chase goes to the one on the " +
           "<strong>fee run</strong> &mdash; it is a fresh monthly snapshot, while a task carries whoever was on it " +
           "when it was raised, and most of these were raised months ago. Worth correcting in Xplan either way.",
      cols: ["Client", "Fee run says", "Task says"],
      row: i => "<tr><td>" + esc(i.client) + "</td><td>" + esc(i.adviser) + "</td><td>" + esc(i.taskAdviser) + "</td></tr>" },
    { key: "nomaster", title: "No matching client in the fee run",
      list: csa.exNoMaster,
      why: "Nothing in the current run carries this Xplan id, so neither fee figure can be shown. " +
           "Usually a client who joined after the extract was taken &mdash; but if <em>every</em> row is here, " +
           "the two reports are not using the same id and nothing on this screen should be trusted.",
      cols: ["Client", "Xplan id", "Adviser"],
      row: i => "<tr><td>" + esc(i.client) + '</td><td class="mono">' + esc(i.entityId) + "</td><td>" + esc(i.adviser) + "</td></tr>" },
    { key: "noadviser", title: "Nobody to email",
      list: csa.exNoAdviser,
      why: "The adviser is not in <code>" + esc(LIST_TITLES.advisers) + "</code>, or has no email address there. " +
           "No reminder can be sent for these, so they are chased by nobody until the directory is fixed.",
      cols: ["Client", "Adviser", "In the directory"],
      row: i => "<tr><td>" + esc(i.client) + "</td><td>" + esc(i.adviser || "—") + "</td><td>" +
                (i.knownAdviser ? "yes, but no email address" : "no") + "</td></tr>" },
    { key: "notier", title: "Tier could not be read",
      list: csa.exNoTier,
      why: "The tier is typed by hand into the thread name and these rows have none. Cosmetic &mdash; " +
           "the chase and both fee figures are unaffected.",
      cols: ["Client", "Thread name"],
      row: i => "<tr><td>" + esc(i.client) + "</td><td>" + esc(i.threadName || "—") + "</td></tr>" },
    { key: "nodue", title: "No due date",
      list: csa.exNoDue,
      why: "Without a due date there is no schedule to put them on, so they are listed here and never emailed.",
      cols: ["Client", "Adviser"],
      row: i => "<tr><td>" + esc(i.client) + "</td><td>" + esc(i.adviser) + "</td></tr>" }
  ].filter(b => b.list.length);

  if (!blocks.length) {
    return '<div class="banner good">Every row matched a client in the fee run, an adviser in the directory ' +
      "and a due date. Nothing needs a look.</div>";
  }
  return blocks.map(b => foldShell({
    id: "csx-" + b.key, attr: "data-csafold", key: b.key,
    title: b.title, sub: "",
    /* Open on arrival: a folded exception is an exception nobody reads, and the
       whole point of this block is that somebody notices. */
    open: state.csaOpen[b.key] === undefined ? true : !!state.csaOpen[b.key],
    badge: '<span class="pill warn">' + b.list.length + "</span>",
    body: () => '<div class="small muted" style="margin-bottom:12px">' + b.why + "</div>" +
      '<div class="tbl-scroll"><table><thead><tr>' + b.cols.map(c => "<th>" + esc(c) + "</th>").join("") +
      "</tr></thead><tbody>" + b.list.map(b.row).join("") + "</tbody></table></div>"
  })).join("");
}

function viewCsa() {
  const csa = buildCsa();

  const dropZone = can("csaLoad")
    ? '<div class="card"><div class="card-h"><h2>Weekly report</h2>' +
      '<div class="sub">Xplan &rarr; Incomplete task report</div></div>' +
      '<div class="card-b"><div class="drop" id="csaDrop"><h3>Drop the report here</h3>' +
      "<p>or click to choose a file &mdash; the sheet is picked by its columns, so the " +
      "<em>CSA Baseline</em> tab is ignored</p></div>" +
      '<input type="file" id="csaFile" accept=".xlsx,.csv" class="hide"></div></div>' +
      '<div class="spacer"></div>'
    : "";

  if (!csa) {
    return dropZone + '<div class="banner warn"><strong>No CSA report loaded yet.</strong> ' +
      (can("csaLoad")
        ? "Drop the weekly <em>Incomplete task report</em> above and the tracker fills in."
        : "Advice Operations load this each week.") + "</div>";
  }

  const mine = csaVisible(csa.items);
  const liveMine = mine.filter(i => !i.suppressed);
  const expiredMine = liveMine.filter(i => i.expired);
  const soonMine = liveMine.filter(i => i.stage === "soon" || i.stage === "due");
  const pricedMine = liveMine.filter(i => i.currentFee != null);
  /* Null rather than zero when nothing could be priced — "$0 at risk" reads as
     good news, and it is the opposite of what an unpriced list means. */
  const atRisk = pricedMine.length ? pricedMine.reduce((a, i) => a + i.currentFee, 0) : null;
  const unpriced = liveMine.length - pricedMine.length;

  let html = "";

  if (!state.calc) {
    html += '<div class="banner warn"><strong>No fee run is loaded</strong>, so neither fee column can be ' +
      "filled in. The chase still works &mdash; open a month on Run/Dashboard to price these.</div>";
  }
  if (csa.notUnactioned) {
    html += '<div class="banner bad"><strong>' + csa.notUnactioned + " row" +
      (csa.notUnactioned === 1 ? " is" : "s are") + " not marked <em>Unactioned</em>.</strong> " +
      "This report is meant to be filtered to incomplete work, so its filter has changed. " +
      "Check the export before trusting what is below.</div>";
  }
  if (can("csaLoad") && state.csa && !state.csa.queuedAt) {
    html += '<div class="banner warn"><strong>No reminders have been queued from this report.</strong> ' +
      "Loading it does not chase anybody by itself &mdash; press <strong>Queue reminders</strong> below once " +
      "you have checked the list.</div>";
  }
  if (csa.disputed.length && can("csaLoad")) {
    html += '<div class="banner warn"><strong>' + csa.disputed.length + " marked off but still on the report.</strong> " +
      "Either they were ticked before Xplan caught up, or the signing did not save. They are not being " +
      "chased for another " + CSA_DISPUTE_GRACE_DAYS + " days, then they go back on the list.</div>";
  }

  html += '<div class="stats">' +
    stat("Outstanding", String(liveMine.length), csa.takenAt ? "as at " + dayLabel(csa.takenAt.slice(0, 10)) : "") +
    stat("Value at risk", money(atRisk),
         unpriced ? unpriced + " not priced" : "current ongoing fees") +
    stat("Already expired", String(expiredMine.length),
         expiredMine.length ? "oldest " + expiredMine[0].expiredDays + " days" : "none", expiredMine.length ? "bad" : "") +
    stat("Due soon", String(soonMine.length),
         soonMine.length ? "earliest " + dayLabel(soonMine.map(i => i.due).sort()[0]) : "none in the reminder window") +
    "</div><div class=\"spacer\"></div>";

  html += dropZone;

  /* Chasing is Advice Operations' button, not an adviser's. */
  if (can("csaLoad")) {
    /* The preview is scoped like the table — a Manager sees their own region's
       messages. Queueing still writes everybody's: it is one weekly operation,
       and whichever of Advice Operations or a Manager presses it, the same
       messages go out. */
    const pend = csaNotifications({ ...csa, live: csaVisible(csa.live) });
    html += '<div class="card"><div class="card-h"><h2>Reminders</h2>' +
      '<div class="sub">What the current report calls for over the next ' + CSA_WEEKLY_DAYS + " days</div>" +
      '<div class="right no-print"><button class="btn" id="btnCsaQueue">Queue reminders</button></div></div>' +
      '<div class="card-b">' +
      (pend.length
        ? '<div class="tbl-scroll"><table><thead><tr><th>Sends</th><th>Kind</th><th>Adviser</th>' +
          "<th>Also to</th></tr></thead><tbody>" +
          pend.map(r => "<tr><td>" + esc(dayLabel(localDay(r.DueAt))) + "</td><td>" + esc(r.Kind) +
            "</td><td>" + esc(r.Adviser) + "</td><td>" +
            (r.CcEmail ? esc(r.CcEmail.split(";").join(", ")) : '<span class="muted">adviser only</span>') +
            "</td></tr>").join("") + "</tbody></table></div>"
        : '<div class="muted">Nothing to send &mdash; every outstanding CSA is either marked off or has nobody to email.</div>') +
      '<div class="spacer"></div><div class="small muted">Queueing replaces anything still waiting to go out, ' +
      "so a CSA signed since the last dump is not chased by a message written before anybody knew. " +
      "One message per adviser per day at most: two stages landing together travel under the more serious one.</div>" +
      "</div></div><div class=\"spacer\"></div>";
  }

  const rows = csaFiltered(csa, mine);
  html += '<div class="toggle-row no-print" style="margin-bottom:12px"><span class="seg">' +
    CSA_FILTERS.map(f => '<button class="' + (state.csaFilter === f.id ? "on" : "") + '" data-csafilter="' + f.id +
      '" aria-pressed="' + (state.csaFilter === f.id) + '">' + esc(f.label) + "</button>").join("") +
    '</span><span class="small muted">' + rows.length + " of " + mine.length + " shown</span></div>";

  html += '<div class="card"><div class="card-b">' +
    (rows.length
      ? '<div class="tbl-scroll"><table><thead><tr><th>Client</th><th>Adviser</th><th>Agreement</th>' +
        '<th>Task due</th><th class="num">Current fee</th><th class="num">Calculated</th>' +
        '<th class="no-print"></th></tr></thead><tbody>' +
        rows.map(csaRow).join("") + "</tbody></table></div>"
      : '<div class="muted">Nothing here.</div>') +
    '<div class="spacer"></div><div class="small muted"><strong>Current fee</strong> is what the client pays ' +
    "today &mdash; what is at risk while the agreement is unsigned. <strong>Calculated</strong> is what this " +
    "month's rate card makes it. Both come from the fee run; a dash means that client is not in it." +
    "</div></div></div><div class=\"spacer\"></div>";

  html += '<h2 style="font-size:1rem;margin:0 0 12px">Needs a look</h2>' + csaExceptionBlocks(csa);
  return html;
}

function viewPricing() {
  const p = pricing();
  let html = "";
  if (!(p.items || []).length) {
    html += '<div class="banner warn">' + (can("rateCardEdit")
      ? "<strong>No pricing loaded yet.</strong> Rate/Fee Settings &rarr; <strong>Pricing calculator</strong> &rarr; " +
        "<strong>Load pricing</strong> takes the pricing sheet as JSON and fills this screen in."
      : "<strong>No pricing loaded yet.</strong> A Manager or Admin sets this up on the Rate/Fee Settings screen.") +
      "</div>";
  }
  html += '<div class="toggle-row no-print" style="margin-bottom:16px">' +
    pricingTabBtn("advice", "Advice fees") + pricingTabBtn("claims", "Insurance claims") + "</div>";
  return html + (pricingInputs.tab === "claims" ? pricingClaimsView(p) : pricingAdviceView(p));
}

/* A line nobody has touched has no amount, and printing $0 against eighteen of
   them buries the three that matter. An untouched line shows a dash; a line
   priced at zero that somebody actually entered still shows $0, because that is
   a real answer. */
const lineAmount = it => it.na ? null
  : it.kind === "min" ? (it.suppressed ? null : it.amount)
  : (it.qty > 0 ? it.amount : null);
const amt = v => v === null ? "&mdash;" : money(v);

/* One row per priced line. `min` lines show no quantity box because they apply
   once or not at all, and a line that does not exist for this client type reads
   n/a rather than being silently priced at zero. */
/* A card that folds away, keeping its total in the header while shut. Only the
   reference panel uses it now — the priced sections are all on show. */
function foldCard(key, title, sub, total, bodyHtml) {
  const open = !!pricingInputs.open[key];
  return '<div class="card"><div class="card-h fold" data-pfold="' + key + '" role="button" tabindex="0" ' +
    'aria-expanded="' + open + '"><h2>' + esc(title) + "</h2>" +
    (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") +
    '<div class="right"><span class="mono fold-total" data-pfoldtotal="' + key + '">' +
    (total ? money(total) : "") + "</span>" +
    '<span class="fold-caret' + (open ? " open" : "") + '" aria-hidden="true"></span></div></div>' +
    (open ? '<div class="card-b">' + bodyHtml + "</div>" : "") + "</div>";
}

/* One priced line as a row on a rule rather than a cell in a table. The
   quantity is a stepper with the number editable in its middle: counts go up
   one at a time, and hours do not. */
function priceRow(it) {
  if (it.na) {
    return '<div class="rrow off"><span class="lbl">' + esc(it.label) + "</span>" +
      '<span class="once">n/a for ' + esc(pricingInputs.clientType.toLowerCase()) + "</span>" +
      '<span class="price">&mdash;</span><span class="amt" data-pamt="' + it.i + '">&mdash;</span></div>';
  }
  const step = it.kind === "hour" ? "0.25" : "1";
  const ctl = it.kind === "min"
    ? '<span class="once" data-ponce="' + it.i + '">' + (it.suppressed ? "waived" : "applies once") + "</span>"
    : '<span class="stepper"><button type="button" data-pstep="' + esc(it.id) + '" data-d="-1" ' +
      'aria-label="One fewer ' + esc(it.label) + '">&minus;</button>' +
      '<input class="n" type="number" min="0" step="' + step + '" data-pq="' + esc(it.id) +
      '" value="' + (pricingInputs.qty[it.id] || "") + '" placeholder="0" aria-label="' + esc(it.label) + '">' +
      '<button type="button" data-pstep="' + esc(it.id) + '" data-d="1" ' +
      'aria-label="One more ' + esc(it.label) + '">+</button></span>';
  const amount = lineAmount(it);
  const per = { hour: "/hr", year: "/yr" }[it.kind] || "";
  return '<div class="rrow' + (amount === null ? " off" : "") + '"><span class="lbl">' + esc(it.label) +
    (it.note ? '<span class="rnote">' + esc(it.note) + "</span>" : "") + "</span>" + ctl +
    '<span class="price">' + money(it.price) + per + "</span>" +
    '<span class="amt" data-pamt="' + it.i + '">' + amt(amount) + "</span></div>";
}

/* A run of rows under one rule, with the section's total sitting on that rule. */
function rowSection(title, totalId, total, body, note) {
  return '<div class="rowsec"><div class="rowsec-h"><span class="t">' + esc(title) + "</span>" +
    '<span class="tot" id="' + totalId + '">' + money(total) + "</span></div>" + body +
    (note ? '<div class="secnote small muted">' + note + "</div>" : "") + "</div>";
}

function pricingAdviceView(p) {
  const a = priceAdvice();
  const ct = pricingInputs.clientType;
  /* The app's own segmented control, not two .btn pills — `.seg button` already
     styles its children and outranks `.btn`, so a pill here comes out looking
     like the opposite of what is selected. */
  const typeBtn = t => '<button class="' + (ct === t ? "on" : "") + '" data-ptype="' + t +
    '" aria-pressed="' + (ct === t) + '">' + t + "</button>";
  const rows = s => a.items.filter(i => i.section === s);
  const sum = s => rows(s).reduce((x, i) => x + i.amount, 0);

  /* quoteCard() escapes what it is given, so these carry real characters rather
     than entities — "&mdash;" would print as those seven letters. */
  let html = quoteHead(
    quoteCard("Total upfront", money(a.upfront), "SOA and implementation") +
    quoteCard("Total ongoing", money(a.ongoing), "per year, including FUM") +
    quoteCard("Fee as % of FUM", a.pctOfFum === null ? "—" : (a.pctOfFum * 100).toFixed(2) + "%",
              a.fum > 0 ? "on " + money(a.fum) : "enter FUM below") +
    quoteCard("Service package", a.pack ? a.pack.name : "—",
              a.pack ? "from " + money(num(a.pack.from)) + " ongoing" : "set by the ongoing fee") +
    /* Shown whenever ancillary services exist, not whenever one is used: a card
       that appears halfway through typing moves everything beside it. */
    (a.ancSet ? quoteCard("Ancillary services", ancCard(a).v, ancCard(a).n) : ""));

  /* The two inputs that move nearly every figure, lifted out of the sections
     they used to be buried in. */
  html += '<div class="keys no-print">' +
    '<div class="kb"><span class="k">Client type</span><span class="seg">' +
      typeBtn("NEW") + typeBtn("EXISTING") + "</span></div>" +
    '<div class="kb"><span class="k">Total FUM</span>' +
    '<input class="fum" type="number" min="0" step="1000" data-pf="fum" value="' +
      (pricingInputs.fum || "") + '" placeholder="0"></div>' +
    '<div class="small muted keys-note">Existing includes anyone who came across through a merger ' +
    "or acquisition.</div></div>";

  html += '<div class="card"><div class="card-b">';

  /* Upfront before ongoing: it is the conversation's first question, and the
     ongoing fee is the one the client lives with afterwards. */
  html += rowSection("Upfront — SOA fees", "ptSoa", sum("soa"),
    rows("soa").length ? rows("soa").map(priceRow).join("") : '<div class="rrow off"><span class="lbl">No SOA lines set.</span></div>');

  html += rowSection("Upfront — implementation", "ptImpl", sum("impl"),
    rows("impl").length ? rows("impl").map(priceRow).join("") : '<div class="rrow off"><span class="lbl">No implementation lines set.</span></div>');

  /* Ongoing carries the FUM ladder under its own lines, band by band, so the
     number in the header can be traced without opening anything. */
  let ongoing = rows("csa").length
    ? rows("csa").map(priceRow).join("")
    : '<div class="rrow off"><span class="lbl">No ongoing lines set.</span></div>';
  ongoing += a.ladder.length
    ? a.ladder.map((b, i) => {
        const to = i + 1 < a.ladder.length ? a.ladder[i + 1].from : null;
        const slice = Math.min(Math.max(a.fum - b.from, 0), (to === null ? Infinity : to - b.from));
        return '<div class="band' + (slice > 0 ? "" : " off") + '"><span class="lbl">' + money(b.from) +
          (to === null ? "+" : " &ndash; " + money(to)) + "</span>" +
          '<span class="r">' + (b.rate * 100).toFixed(2) + "%</span>" +
          '<span class="a" data-pband="' + i + '">' + (slice > 0 ? money(slice * b.rate) : "&mdash;") + "</span></div>";
      }).join("") +
      '<div class="band sum"><span class="lbl">FUM fee</span><span class="r"></span>' +
      '<span class="a" id="ptFum">' + money(a.fumFee) + "</span></div>"
    : '<div class="band off"><span class="lbl">No FUM bands set for ' + esc(ct) +
      " clients, so FUM adds nothing.</span><span class=\"r\"></span><span class=\"a\">&mdash;</span></div>";

  html += rowSection("Ongoing — every year", "ptOngoing", a.ongoing, ongoing,
    "<strong>Marginal, like tax brackets.</strong> The first band charges nothing &mdash; it is the stretch of " +
    "FUM the minimum above already covers. Each band after that charges its rate only on the part of the balance " +
    "inside it, so the minimum and the FUM fee add together rather than one replacing the other.");

  html += rowSection("Fee for service — hourly", "ptHourly", sum("hourly"),
    rows("hourly").length ? rows("hourly").map(priceRow).join("") : '<div class="rrow off"><span class="lbl">No hourly rates set.</span></div>',
    "Charged by the hour and outside any agreement, so it is not part of either total above.");

  html += rowSection("Centrelink administration", "ptCentrelink", a.centrelink,
    '<div class="rrow"><label class="lbl" style="cursor:pointer"><input type="checkbox" data-pb="onAgreement"' +
      (pricingInputs.onAgreement ? " checked" : "") + "> Client is on a Service Agreement</label></div>" +
    '<div class="rrow"><label class="lbl" style="cursor:pointer"><input type="checkbox" data-pb="meansTested"' +
      (pricingInputs.meansTested ? " checked" : "") + "> Means tested fee, with quarterly updates</label></div>",
    "Priced off the service package above &mdash; currently <strong>" +
    (pricingInputs.onAgreement ? (a.pack ? esc(a.pack.name) : "no package") : "no agreement") +
    "</strong>. Payable personally by direct debit or invoice, never included in the Client Service Agreement, " +
    "and not part of either total above.");

  /* Coastal's other services, at the bottom and on the same screen, so a quote
     covering advice and accounting is one conversation. Split by how often each
     is charged — the two numbers are not addable — and each half only appears
     if something is set up for it. */
  const ancRows = yearly => a.items.filter(i => i.section === ANCILLARY && (i.kind === "year") === yearly);
  if (a.ancSet) {
    const outside = "Coastal's other services, priced separately from advice. <strong>Outside both totals above</strong> " +
      "&mdash; the service package and the FUM percentage are measured on the advice fee alone.";
    if (ancRows(false).length) {
      html += rowSection("Ancillary services — one-off", "ptAncOnce", a.ancOnce,
        ancRows(false).map(priceRow).join(""), outside);
    }
    if (ancRows(true).length) {
      html += rowSection("Ancillary services — every year", "ptAncYear", a.ancYear,
        ancRows(true).map(priceRow).join(""),
        ancRows(false).length ? "Charged every year for as long as the service runs." : outside);
    }
  }

  html += "</div></div>";
  html += pricingReference(p);
  return html;
}

function pricingClaimsView(p) {
  const c = priceClaim();
  const rates = (p.claims && p.claims.rates) || [];

  let html = quoteHead(
    quoteCard("Lump sum fee", money(c.lumpNet), c.capped ? "commissions cover the tier fee" : "TPD, after commissions") +
    quoteCard("Hourly fee", money(c.hoursNet), c.billable ? c.billable + " billable hrs" : "Life, Trauma, Income Protection") +
    (c.ipOngoing ? quoteCard("IP monthly management", money(c.ipMonthly), "per month, once a claim is paid") : ""));

  html += '<div class="grid2 wide top">';

  html += '<div class="card"><div class="card-h"><h2>TPD &mdash; lump sum</h2>' +
    '<div class="sub">A one-off fee on the insured benefit</div></div><div class="card-b">' +
    (c.tiers.length
      ? '<div class="tbl-scroll"><table><thead><tr><th>Benefit band</th><th class="num">Rate</th>' +
        '<th class="num">Charged</th></tr></thead><tbody>' +
        c.tiers.map((t, i) => {
          const to = i + 1 < c.tiers.length ? c.tiers[i + 1].from : null;
          const slice = Math.min(Math.max(c.benefit - t.from, 0), (to === null ? Infinity : to - t.from));
          return "<tr" + (slice > 0 ? "" : ' class="muted"') + "><td>" + money(t.from) +
            (to === null ? "+" : " &ndash; " + money(to)) + "</td>" +
            '<td class="num">' + (t.rate * 100).toFixed(2) + "%</td>" +
            '<td class="num mono" data-ptband="' + i + '">' + money(slice * t.rate) + "</td></tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="muted">No claim tiers set.</div>') +
    '<div class="spacer"></div>' +
    '<div class="field"><label>TPD benefit amount</label>' +
    '<input type="number" min="0" step="1000" data-pf="benefit" value="' + (pricingInputs.benefit || "") + '" placeholder="0"></div>' +
    '<div class="spacer"></div>' +
    '<div class="field"><label>Commissions received (last 12 months)</label>' +
    '<input type="number" min="0" step="100" data-pf="commissions" value="' + (pricingInputs.commissions || "") + '" placeholder="0"></div>' +
    '<div class="spacer"></div>' +
    '<div class="result-line"><span>Gross tier fee</span><span class="mono" id="pcGross">' + money(c.tierFee) + "</span></div>" +
    '<div class="result-line"><span>Less commissions</span><span class="mono" id="pcComms">' +
      (c.commsApplied ? "&minus;" : "") + money(c.commsApplied) + "</span></div>" +
    '<div class="result-line"><strong>Lump sum fee</strong><span class="mono" id="pcLump">' + money(c.lumpNet) + "</span></div>" +
    '<div class="spacer"></div><div class="small muted" id="pcNote">' + claimLumpNote(c) + "</div>" +
    "</div></div>";

  html += '<div class="card"><div class="card-h"><h2>Life, Trauma, Income Protection &mdash; hourly</h2>' +
    '<div class="sub">Charged by the hour for every other claim type</div></div><div class="card-b">' +
    (rates.length
      ? '<div class="field"><label>Policy type</label><select data-pf="rateIdx">' +
        rates.map((r, i) => '<option value="' + i + '"' + (pricingInputs.rateIdx === i ? " selected" : "") + ">" +
          esc(r.label) + " &mdash; " + money(num(r.hourly)) + "/hr</option>").join("") + "</select></div>"
      : '<div class="muted">No hourly rates set.</div>') +
    '<div class="spacer"></div>' +
    '<div class="field"><label>Complimentary hours</label>' +
    '<input type="number" min="0" step="0.25" data-pf="compHours" value="' + (pricingInputs.compHours || "") + '" placeholder="0"></div>' +
    '<div class="spacer"></div>' +
    '<div class="field"><label>Approximate total hours</label>' +
    '<input type="number" min="0" step="0.25" data-pf="totalHours" value="' + (pricingInputs.totalHours || "") + '" placeholder="0"></div>' +
    '<div class="spacer"></div>' +
    '<div class="result-line"><strong>Hourly fee</strong><span class="mono" id="pcHours">' + money(c.hoursNet) + "</span></div>" +
    '<div class="spacer"></div><div class="small muted" id="pcHoursNote">' + claimHoursNote(c) + "</div>" +
    "</div></div>";

  html += "</div>";

  /* The two questions that change the answer without being a number. */
  const discount = num((p.claims || {}).multiDiscount);
  const anyIp = ((p.claims || {}).rates || []).some(r => num(r.ipMonthly) > 0);
  if (discount > 0 || anyIp) {
    html += '<div class="card" style="margin-top:16px"><div class="card-b">';
    if (anyIp) {
      html += '<label class="toggle-row" style="cursor:pointer"><input type="checkbox" data-pb="ipOngoing"' +
        (pricingInputs.ipOngoing ? " checked" : "") + "> Ongoing income protection claim management</label>" +
        '<div class="spacer"></div><div class="small muted">Income protection claims can be managed month to month at ' +
        (c.ipMonthly ? money(c.ipMonthly) : "the rate set for that policy type") +
        " a month, starting only once the first claim payment reaches the client. Tick it and the monthly fee joins the " +
        "figures at the top. TPD and trauma claims carry no monthly charge, and clients may manage an income protection " +
        "claim themselves at no cost.</div>";
    }
    if (discount > 0) {
      if (anyIp) html += '<div class="spacer"></div><hr style="border:0;border-top:1px solid var(--line)"><div class="spacer"></div>';
      html += '<label class="toggle-row" style="cursor:pointer"><input type="checkbox" data-pb="multiClaim"' +
        (pricingInputs.multiClaim ? " checked" : "") + "> Multiple claims lodged with the same insurer</label>" +
        '<div class="spacer"></div><div class="small muted">Two claims with one insurer &mdash; income protection and trauma, ' +
        "say &mdash; discount <strong>both</strong> claim fees by " + (discount * 100).toFixed(0) +
        "%. Ticking this applies the discount to the lump sum and the hourly fee above. The monthly management fee is an " +
        "ongoing charge rather than a claim fee, so it is not discounted.</div>";
    }
    html += "</div></div>";
  }

  return html;
}

function claimLumpNote(c) {
  if (!c.benefit) return "Enter a benefit amount to price the lump sum.";
  let s = "Marginal, like tax brackets &mdash; each band charges only on the part of the benefit inside it.";
  if (c.capped) s += " Commissions of " + money(c.comms) + " exceed the tier fee, so the deduction is capped at " +
    money(c.tierFee) + " and the lump sum is nil rather than a credit.";
  if (c.disc) s += " A " + (c.disc * 100).toFixed(0) + "% multi-claim discount is applied.";
  return s;
}

function claimHoursNote(c) {
  if (!num(pricingInputs.totalHours)) return "Enter hours to price the claim.";
  let s = c.billable + " billable hr" + (c.billable === 1 ? "" : "s") + " (" + num(pricingInputs.totalHours) +
    " total &minus; " + num(pricingInputs.compHours) + " complimentary) &times; " + money(c.rate) + "/hr.";
  if (c.ipOngoing) s += " Ongoing management adds " + money(c.ipMonthly) +
    " a month, starting only once the first claim payment reaches the client.";
  if (c.disc) s += " A " + (c.disc * 100).toFixed(0) + "% multi-claim discount is applied.";
  return s;
}

/* Preferred insurers, preferred platforms, Centrelink criteria — reference text
   that decides which price applies. Consulted once in a while rather than on
   every quote, so it starts shut. Advice fees only; the claims screen names its
   own two policy types in the rate picker and needs none of this. */
function pricingReference(p) {
  const list = p.reference || [];
  if (!list.length) return "";
  return '<div style="margin-top:16px">' + foldCard("reference", "Reference",
    "Which list a fund or insurer falls on decides which price applies", 0,
    '<div class="grid2 wide">' +
    list.map(r => '<div><div style="font-weight:600;margin-bottom:6px">' + esc(r.title) + "</div>" +
      '<div class="small muted" style="white-space:pre-line">' + esc(r.body) + "</div></div>").join("") +
    "</div>") + "</div>";
}

/* Repaints every computed figure without rebuilding the screen, so typing in a
   box does not take the focus out of it. */
function paintPricing() {
  const set = (sel, v) => { const el = document.querySelector(sel); if (el) el.innerHTML = v; };
  if (pricingInputs.tab === "claims") {
    const c = priceClaim();
    c.tiers.forEach((t, i) => {
      const to = i + 1 < c.tiers.length ? c.tiers[i + 1].from : null;
      const slice = Math.min(Math.max(c.benefit - t.from, 0), (to === null ? Infinity : to - t.from));
      const cell = document.querySelector('[data-ptband="' + i + '"]');
      if (cell) { cell.textContent = money(slice * t.rate); cell.closest("tr").classList.toggle("muted", !(slice > 0)); }
    });
    set("#pcGross", money(c.tierFee));
    set("#pcComms", (c.commsApplied ? "&minus;" : "") + money(c.commsApplied));
    set("#pcLump", money(c.lumpNet));
    set("#pcHours", money(c.hoursNet));
    set("#pcNote", claimLumpNote(c));
    set("#pcHoursNote", claimHoursNote(c));
    /* The pinned panel is the first thing read, so it cannot lag the detail. */
    const qv = document.querySelectorAll(".quote-grid .v");
    const qn = document.querySelectorAll(".quote-grid .n");
    if (qv.length >= 2) {
      qv[0].textContent = money(c.lumpNet);
      qv[1].textContent = money(c.hoursNet);
      if (qn.length >= 2) {
        qn[0].textContent = c.capped ? "commissions cover the tier fee" : "TPD, after commissions";
        qn[1].textContent = c.billable ? c.billable + " billable hrs" : "Life, Trauma, Income Protection";
      }
    }
    return;
  }

  const a = priceAdvice();
  a.items.forEach(it => {
    const cell = document.querySelector('[data-pamt="' + it.i + '"]');
    if (!cell) return;
    const amount = lineAmount(it);
    cell.innerHTML = amt(amount);
    const row = cell.closest(".rrow");
    if (row) row.classList.toggle("off", amount === null);
    /* A minimum that an insurance-only line has cancelled says so where its
       quantity would otherwise be. */
    const once = document.querySelector('[data-ponce="' + it.i + '"]');
    if (once) once.textContent = it.suppressed ? "waived" : "applies once";
  });
  const sum = s => a.items.filter(i => i.section === s).reduce((x, i) => x + i.amount, 0);
  set("#ptSoa", money(sum("soa")));
  set("#ptImpl", money(sum("impl")));
  set("#ptHourly", money(sum("hourly")));
  a.ladder.forEach((b, i) => {
    const to = i + 1 < a.ladder.length ? a.ladder[i + 1].from : null;
    const slice = Math.min(Math.max(a.fum - b.from, 0), (to === null ? Infinity : to - b.from));
    const cell = document.querySelector('[data-pband="' + i + '"]');
    if (cell) {
      cell.innerHTML = slice > 0 ? money(slice * b.rate) : "&mdash;";
      const band = cell.closest(".band");
      if (band) band.classList.toggle("off", !(slice > 0));
    }
  });
  set("#ptFum", money(a.fumFee));
  set("#ptOngoing", money(a.ongoing));
  set("#ptCentrelink", money(a.centrelink));
  set("#ptAncOnce", money(a.ancOnce));
  set("#ptAncYear", money(a.ancYear));

  /* The headline figures in the pinned panel move with every keystroke too. */
  const vals = document.querySelectorAll(".quote-grid .v");
  const notes = document.querySelectorAll(".quote-grid .n");
  if (vals.length >= 4) {
    vals[0].textContent = money(a.upfront);
    vals[1].textContent = money(a.ongoing);
    vals[2].textContent = a.pctOfFum === null ? "—" : (a.pctOfFum * 100).toFixed(2) + "%";
    vals[3].textContent = a.pack ? a.pack.name : "—";
    if (notes.length >= 4) {
      notes[2].textContent = a.fum > 0 ? "on " + money(a.fum) : "enter FUM below";
      notes[3].textContent = a.pack ? "from " + money(num(a.pack.from)) + " ongoing" : "set by the ongoing fee";
    }
    /* The fifth card is there only when ancillary services are set up. */
    if (vals.length >= 5) {
      const ac = ancCard(a);
      vals[4].textContent = ac.v;
      if (notes.length >= 5) notes[4].textContent = ac.n;
    }
  }
}

/* =========================================================================
   Rate/Fee Settings
   Two tabs, because the screen holds two different price lists: what the
   monthly review charges, and what the Pricing Calculator quotes. Every block
   folds, and starts folded — this is a screen people arrive at to change one
   thing, not to read. Anything wanting attention says so on its tile and opens
   itself.
   ========================================================================= */

/* One folding block. `body` is a function so a closed section costs nothing to
   build — several of these are long tables. */
/* The shell both folding screens share. `body` is a function so a closed
   section costs nothing to build — several of these are long tables. */
function foldShell(o) {
  return '<div class="card rcs" id="' + o.id + '">' +
    '<div class="card-h fold" ' + o.attr + '="' + o.key + '" role="button" tabindex="0" ' +
    'aria-expanded="' + o.open + '"><h2>' + esc(o.title) + "</h2>" +
    (o.sub ? '<div class="sub">' + esc(o.sub) + "</div>" : "") +
    '<div class="right">' + (o.badge || "") +
    '<span class="fold-caret' + (o.open ? " open" : "") + '" aria-hidden="true"></span></div></div>' +
    (o.open ? '<div class="card-b">' + (o.actions || "") + o.body() + "</div>" : "") + "</div>";
}

function settingsSection(s) {
  /* Closed unless somebody has said otherwise — except a section carrying a
     warning, which opens itself, because a folded warning is a warning nobody
     reads. Once it is toggled by hand that choice sticks. */
  return foldShell({
    id: "rcs-" + s.key, attr: "data-rcfold", key: s.key, title: s.title, sub: s.sub,
    open: state.rcOpen[s.key] === undefined ? !!s.warn : !!state.rcOpen[s.key],
    badge: s.warn ? '<span class="pill warn">' + esc(s.warn) + "</span>"
         : s.meta ? '<span class="small muted">' + esc(s.meta) + "</span>" : "",
    actions: s.actions, body: s.body
  });
}

/* The index across the top. A tile carries whatever the section's header would
   have said, so the warnings are visible without opening anything. */
function settingsTiles(sections) {
  return '<div class="tiles no-print">' + sections.map(s =>
    '<button class="tile' + (s.warn ? " warn" : "") + '" data-rcjump="' + s.key + '">' +
    '<span class="t">' + esc(s.title) + "</span>" +
    '<span class="n">' + esc(s.warn || s.meta || "") + "</span></button>").join("") + "</div>";
}

/* What the monthly review prices against. */

  const fundTrouble = c ? (c.unknownFunds.length + c.noPlatform.length + c.fundClashes.length) : 0;
  const noRate = c ? c.categories.filter(e => e.rate == null).length : 0;

  return [
    { key: "cats", title: "Category rates",
      meta: rc.categories.length + (rc.categories.length === 1 ? " tier" : " tiers") +

      body: () => {

        return '<div class="tbl-scroll"><table><thead><tr><th>Category</th>' +

          bands.map(b =>
            '<tr><td><input type="text" class="grow-x" data-rc="cat" data-i="' + b.i + '" data-f="name" value="' +
              esc(b.c.name) + '"' + ro + "></td>" +
            '<td class="num"><input type="number" class="w110 num" data-rc="cat" data-i="' + b.i +
              '" data-f="annual" value="' + b.c.annual + '"' + ro + "></td>" +
            /* Derived, so it is shown rather than typed — two typed limits can
               disagree and leave a client in the gap between two tiers. */
            '<td class="num mono">' + (b.to == null ? "&mdash;" : money(b.to)) + "</td>" +
            '<td class="small muted">' + esc(bandLabel(b)) +
              (b.sharedWith ? "<div>shares this band with " + b.sharedWith + " other" +

            (ro ? "" : '<td class="no-print"><button class="btn ghost icon-x" data-delcat="' + b.i +

          "</tbody></table></div>" +
          '<div class="spacer"></div><div class="small muted"><strong>Only the lower limit is typed.</strong> ' +
          "The upper one is whatever sits just below the next tier, so the tiers always meet and no client can fall " +
          "between two of them. Move a tier's lower limit and the one beneath it grows or shrinks to match." +
          "<br><br>Tiers sharing a lower limit share a band &mdash; <code>A</code>, <code>B</code> and " +

          "<br><br>The lower limit is also the <strong>base fee</strong> for that tier: it is what a client in it starts " +
          "at before entities and the FUM surcharge are added.</div>";
      } },

    { key: "entities", title: "Additional entities",
      sub: "What a client group costs beyond its master client",
      meta: rc.entityWeights.length + " type" + (rc.entityWeights.length === 1 ? "" : "s"),
      actions: ro ? "" : '<div class="no-print" style="margin-bottom:12px"><button class="btn ghost btn-sm" id="btnAddWt">Add entity type</button></div>',
      body: () =>
        '<div class="field"><label>Fee per weighted entity</label><input type="number" data-rc="scalar" data-f="additionalEntityFee" value="' + rc.additionalEntityFee + '"' + ro + "></div>" +
        '<div class="spacer"></div>' +
        (rc.entityWeights.length
          ? '<div class="tbl-scroll"><table><thead><tr><th>Entity type</th><th class="num">Weight</th><th class="num">Adds</th>' +
            (ro ? "" : '<th class="no-print"></th>') + "</tr></thead><tbody>" +

              '<td class="num"><input type="number" step="0.5" class="w80 num" data-rc="wt" data-i="' + i + '" data-f="weight" value="' + w.weight + '"' + ro + "></td>" +

    '<button class="' + (tab === id ? "on" : "") + '" data-rctab="' + id + '" aria-pressed="' + (tab === id) + '">' +
    esc(label) + "</button>";

  let html = '<div class="toggle-row no-print" style="margin-bottom:16px"><span class="seg">' +
    tabBtn("review", "Fee review pricing") + tabBtn("pricing", "Pricing calculator") + "</span>" +
    '<span class="small muted" style="max-width:52ch">' +
    (tab === "pricing"
      ? "What the Pricing Calculator quotes &mdash; Coastal's own price list for new and existing clients."
      : "What the monthly review prices clients against.") +
    "</span></div>";

  html += '<div class="banner info no-print">This is the single source of truth for pricing. Runs keep a snapshot of the card ' +

function newItemId(items) {
  let n = 1;
  const taken = new Set(items.map(i => i.id));
  while (taken.has("i" + n)) n++;
  return "i" + n;
}

/* "Marginal" is a word people nod at and then get wrong, so show it happening on
   a real number rather than explaining it twice. Built from whatever bands are
   currently set, so it stays true as they are edited. */
/* Category tiers in band order, each with the upper limit worked out from the
   next tier's lower one. Only the lower limit is ever typed: a pair of typed
   limits can leave a gap between two tiers — or overlap them — and a client
   landing in that gap has no tier at all. The top tier is open-ended.

   Returns the original index alongside, because the editing table writes back
   by position in `rc.categories` and this list is sorted. */
function categoryBands(rc) {
  const rows = (rc.categories || []).map((c, i) => ({ c, i, from: num(c.annual) }));
  /* Several tiers share a floor — A, B and Private Wealth all start at 22,000 —
     so the ceiling comes from the next *distinct* floor. Taking it from the next
     row would give the first of any duplicate pair a band ending below where it
     starts. */
  const floors = [...new Set(rows.map(r => r.from))].sort((a, b) => a - b);
  const ceilOf = f => {
    const n = floors.indexOf(f);
    return n + 1 < floors.length ? floors[n + 1] - 1 : null;
  };
  return rows
    .sort((a, b) => a.from - b.from || String(a.c.name).localeCompare(String(b.c.name)))
    .map(x => ({ ...x, to: ceilOf(x.from), sharedWith: rows.filter(r => r.from === x.from).length - 1 }));
}

const bandLabel = b => b.to == null ? money(b.from) + " and above"
                     : money(b.from) + " – " + money(b.to);

function surchargeWorkedExample(rc) {
  const bands = [...(rc.surchargeBands || [])]
    .map(b => ({ from: num(b.from), rate: num(b.rate) }))
    .sort((a, b) => a.from - b.from);
  if (!bands.length) return "";

  /* Big enough to reach every band, and a round number to read. */
  const top = bands[bands.length - 1].from;
  const fum = Math.max(Math.ceil((top * 1.5) / 100000) * 100000, 1000000);

  /* Short money for the slice labels — "$1.0m to $3.0m" rather than the full
     figures, which is two columns' worth of text in a half-width card. */
  const brief = n => n >= 1000000 ? "$" + (n / 1000000).toFixed(n % 1000000 ? 1 : 0) + "m"
    : n >= 1000 ? "$" + Math.round(n / 1000) + "k" : "$" + n;

  let total = 0;
  const rows = bands.map((b, i) => {
    const to = (i + 1 < bands.length) ? bands[i + 1].from : Infinity;
    const slice = Math.min(Math.max(fum - b.from, 0), to - b.from);
    const amount = slice * b.rate;
    total += amount;
    return "<tr><td class=\"nowrap\">" + (isFinite(to) ? brief(b.from) + "&ndash;" + brief(to) : "over " + brief(b.from)) +
      '</td><td class="num">' + money(slice) + '</td><td class="num">' + (b.rate * 100).toFixed(2) +
      '%</td><td class="num mono">' + money(amount) + "</td></tr>";
  }).join("");

  return '<div class="spacer"></div><div class="small muted"><strong>Worked example</strong> &mdash; a client holding ' +
    money(fum) + ":</div>" +
    '<div class="tbl-scroll"><table style="margin-top:6px;font-size:.8rem"><thead><tr><th>Slice</th>' +
    '<th class="num">In it</th><th class="num">Rate</th><th class="num">Surcharge</th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td colspan="3">Total</td>' +
    '<td class="num mono"><strong>' + money(Math.round(total * 100) / 100) + "</strong></td></tr></tfoot></table></div>";
}

/* ---------------- Fund fee caps ----------------
   The most each platform will let us draw from an account. Not Coastal pricing:
   these are the platforms' own limits, so the table is a record of what they
   have told us rather than anything we decide. */
/* The body of the Fund fee caps section — its header, its total and its Add
   button are the section wrapper's job now. */
function fundCapBody() {
  const ro = can("rateCardEdit") ? "" : " disabled";
  const c = state.calc;
  /* How many accounts in the loaded run each fund is actually matching, so a
     fund nobody holds and a fund whose aliases are wrong look different. */
  const hits = new Map();
  if (c) for (const r of c.rows) if (r.fund) hits.set(r.fund.name, (hits.get(r.fund.name) || 0) + 1);

  let html = '<ul class="small muted" style="margin:0 0 14px;padding-left:18px;line-height:1.65">' +
    "<li><strong>Cap % and Cap $</strong> &mdash; set either, or both. With both, the <strong>lower</strong> of the two binds, " +
      "which is how &ldquo;2.20% pa, capped at $18,000&rdquo; reads. Percentages are typed as written: <code>2.2</code> means 2.20%. " +
      "A platform with no cap gets <code>0</code> in both, and still needs a row.</li>" +
    "<li><strong>Also matched on</strong> &mdash; other names Xplan might use for this fund. <strong>Put each on its own line.</strong> " +
      "Commas and semicolons work too, so pasting <code>CFS, FirstChoice, FirstWrap</code> splits into three. " +
      "Longest match wins, so <code>AMP North</code> beats a bare <code>North</code> whatever order they are in.</li>" +
    "<li>Names match <strong>whole words only</strong>, so a short one is safe: <code>BT</code> finds &ldquo;BT Panorama&rdquo; " +
      "but not &ldquo;De<u>bt</u> Securities&rdquo;. Case, spacing and punctuation are ignored, and letters are split from " +
      "digits &mdash; so <code>HUB24</code>, <code>HUB 24</code>, <code>HUB-24</code> and &ldquo;HUB24Super&rdquo; are all the " +
      "same name and you only need one of them.</li>" +
    "<li>Those same names are what <strong>recover the platform</strong> when Xplan reports the vendor as N/A &mdash; and an account " +
      "with no platform is left out of the client's FUM altogether. That is why a capless platform still earns a row.</li>" +
    "<li><strong>Cap incl GST</strong> is whether <em>their</em> figure includes it. Whether ours do is one setting, under GST above.</li>" +
    "<li><strong>Min balance</strong> is what the platform needs before it will process a fee at all. Below it the fee is not trimmed, " +
      "it simply never arrives.</li>" +
    "</ul>";

  if (!state.funds.length) {
    return html + '<div class="muted">No funds yet. ' +
      (ro ? "A Manager or Admin can add them." : "Add the platforms you deal with, or connect to SharePoint and they load from the list.") + "</div>";
  }

  html += '<div class="tbl-wrap"><table><thead><tr><th>Fund</th><th>Also matched on</th>' +
    '<th class="num">Cap % of balance</th><th class="num">Cap $</th><th>Cap incl GST</th>' +
    '<th class="num">Min balance</th><th class="num">Accounts</th><th>Active</th>' +
    (ro ? "" : '<th class="no-print"></th>') + "</tr></thead><tbody>";

  state.funds.forEach((f, i) => {
    const n = hits.get(f.name) || 0;
    const capless = !(f.capPct > 0) && !(f.capAmount > 0);
    html += "<tr><td><input type=\"text\" class=\"grow-x\" data-fund=\"" + i + '" data-f="name" value="' + esc(f.name) + '"' + ro + "></td>" +
      '<td><textarea rows="1" class="grow w140" data-fund="' + i + '" data-f="aliases" placeholder="one per line"' + ro + ">" +
        esc(f.aliases.join("\n")) + "</textarea>" +
        (f.aliases.length > 1 ? '<div class="small muted">' + f.aliases.length + " names</div>" : "") + "</td>" +
      '<td class="num"><input type="number" step="0.01" class="w110 num" data-fund="' + i + '" data-f="capPct" value="' + f.capPct + '"' + ro + "></td>" +
      '<td class="num"><input type="number" step="1" class="w110 num" data-fund="' + i + '" data-f="capAmount" value="' + f.capAmount + '"' + ro + "></td>" +
      '<td><input type="checkbox" data-fund="' + i + '" data-f="capInclGst"' + (f.capInclGst ? " checked" : "") + ro + "></td>" +
      '<td class="num"><input type="number" step="1" class="w110 num" data-fund="' + i + '" data-f="minBalance" value="' + f.minBalance + '"' + ro + "></td>" +
      '<td class="num">' + (c ? (n ? n : '<span class="muted">0</span>') : '<span class="muted">&mdash;</span>') +
        (capless ? ' <span class="pill mute" title="No cap recorded for this platform">no cap</span>' : "") + "</td>" +
      '<td><input type="checkbox" data-fund="' + i + '" data-f="active"' + (f.active ? " checked" : "") + ro + "></td>" +
      (ro ? "" : '<td class="no-print"><button class="btn ghost icon-x" data-delfundrow="' + i +
        '" title="Remove ' + esc(f.name) + '" aria-label="Remove ' + esc(f.name) + '">&times;</button></td>') +
      "</tr>";
    if (f.notes) {
      html += '<tr class="acct"><td colspan="' + (ro ? 8 : 9) + '"><div class="small muted">' + esc(f.notes) + "</div></td></tr>";
    }
  });
  html += "</tbody></table></div>";

  /* A platform in the run that is not in this table cannot be checked at all,
     which is a silent gap unless it is named. */
  if (c && c.unknownFunds.length) {
    const one = c.unknownFunds.length === 1;
    html += '<div class="spacer"></div><div class="banner warn"><strong>' + c.unknownFunds.length +
      " platform" + (one ? " is" : "s are") + " in this run with no entry here, so no cap is checked for " +
      (one ? "it" : "them") + ":</strong> " + esc(c.unknownFunds.join(", ")) + "</div>";
  }
  /* Two funds claiming the same account means one alias list is wrong, and the
     cap being checked may belong to the other platform. Longest match settles
     it, but silently settling it is how the wrong cap goes unnoticed. */
  if (c && c.fundClashes.length) {
    const pairs = new Map();
    for (const r of c.fundClashes) {
      for (const other of r.fundRivals) {
        const k = [r.fund.name, other.name].sort().join(" ↔ ");
        pairs.set(k, (pairs.get(k) || 0) + 1);
      }
    }
    html += '<div class="spacer"></div><div class="banner warn"><strong>Two funds match the same accounts.</strong> ' +
      "The longer name wins, but one of the two alias lists is probably too broad &mdash; check the caps being applied are " +
      "the right platform's.<div class=\"small\" style=\"margin-top:6px\">" +
      [...pairs].map(([k, n]) => esc(k) + " (" + n + " account" + (n === 1 ? "" : "s") + ")").join(" &middot; ") +
      "</div></div>";
  }
  /* The expensive one. These aliases are also what recovers a platform Xplan
     reported as N/A, so an account matching nothing here is not merely
     uncapped — it is out of the client's FUM and the fee is understated. */
  if (c && c.noPlatform.length) {
    html += '<div class="spacer"></div><div class="banner bad"><strong>' + c.noPlatform.length +
      " account" + (c.noPlatform.length === 1 ? "" : "s") + " worth " +
      money(c.noPlatform.reduce((a, r) => a + r.valueUsed, 0)) + " matched no fund here and no vendor in Xplan, " +
      "so the balance is not counted in anyone's FUM.</strong> Adding the platform below brings it back in. " +
      '<div class="small" style="margin-top:6px">' +
      esc([...new Set(c.noPlatform.map(r => r.subfundName))].slice(0, 6).join(" · ")) +
      (new Set(c.noPlatform.map(r => r.subfundName)).size > 6 ? " …" : "") + "</div></div>";
  }
  return html;
}

/* Xplan hands us a category code; the rate card holds tier names. This is where
   the two are reconciled. Kept separate from the rate table itself so nobody has
   to invent duplicate tiers just to get a code to price. */
function categoryMappingBody() {
  const c = state.calc, rc = state.rateCard;
  const ro = !can("rateCardEdit") ? " disabled" : "";
  if (!c) return '<div class="muted">Load a run to map its categories.</div>';

  const options = rc.categories.map(x => x.name);
  let html = '<div class="banner warn" style="margin-bottom:14px">The letter codes changed meaning between the old and new ' +
    'tables &mdash; old <strong>B</strong> was Exclusive, new <strong>B</strong> is Platinum; old <strong>C</strong> was Platinum, new ' +
    '<strong>C</strong> is Essential. Xplan codes were stamped under the old scheme, so map them deliberately rather than letting the ' +
    'name match do it.</div>' +
    '<table><thead><tr><th>Xplan category</th><th class="num">Clients</th><th class="num">Was worth (old table)</th>' +
    '<th>Maps to</th><th class="num">Rate applied</th><th>State</th></tr></thead><tbody>';

  for (const e of c.categories) {
    const legacy = rc.legacyRates[e.category];
    const stateCell = e.pricedVia === "mapped" ? '<span class="pill ok">mapped</span>'
      : e.pricedVia === "direct" ? (c.ambiguous.includes(e) ? '<span class="pill warn">name match &mdash; confirm</span>' : '<span class="pill ok">name match</span>')
      : '<span class="pill bad">no rate</span>';
    html += "<tr><td><strong>" + esc(e.category) + '</strong></td><td class="num">' + e.clients + "</td>" +
      '<td class="num">' + (legacy == null ? '<span class="muted">&mdash;</span>' : money(legacy)) + "</td>" +
      '<td><select class="w140" data-map="' + esc(e.category) + '"' + ro + '><option value="">' +
        (e.pricedVia === "direct" ? "(name match)" : "(not mapped)") + "</option>" +
        options.map(o => '<option value="' + esc(o) + '"' + (e.mappedTo === o ? " selected" : "") + ">" + esc(o) + "</option>").join("") +
      "</select></td>" +
      '<td class="num">' + (e.rate == null ? '<span class="muted">&mdash;</span>' : money(e.rate)) + "</td>" +
      "<td>" + stateCell + "</td></tr>";
  }
  return html + "</tbody></table>";
}

/* ---------------- Advisers ---------------- */
/* One list in SharePoint, four sections here. Changing someone's role moves them
   between sections on the next render, which is the whole editing gesture. */
/* "Ops" is already plural; the others take an s. */
const rolePlural = r => (r === "Ops" ? "Ops" : r + "s");

const ROLE_BLURB = {
  Adviser: "Their own clients, and nothing else. The name must match Xplan exactly or their book will not link to them.",
  Ops:     "Runs the month: import, review, exceptions, approvals, locking. Can see the rate card but not change it.",
  Manager: "Everything Ops can do, plus editing the rate card and the category mapping.",
  Admin:   "Everything, plus this screen and Settings. Only an Admin can add or remove people."
};

function viewPeople() {
  let html = '<div class="banner warn no-print"><strong>Role decides which screens someone sees, not what they can reach.</strong> ' +
    'Anyone with access to the SharePoint site can read the underlying lists directly. Treat this as keeping people on the right ' +
    'screen, and site access as the actual control.</div>';

  const counts = ROLES.map(r => state.advisers.filter(a => (a.role || "Adviser") === r).length);
  html += '<div class="stats">' + ROLES.map((r, i) =>
    stat(rolePlural(r), counts[i],
      state.advisers.filter(a => (a.role || "Adviser") === r && !a.active).length + " inactive")).join("") + "</div>";

  if (!counts[3]) {
    html += '<div class="banner bad no-print"><strong>No Admin yet.</strong> Until someone is set to Admin, whoever opens the app ' +
      'is treated as one &mdash; otherwise nobody could set this up. Add yourself as Admin to close that off.</div>';
  }

  /* A manager with no region matches no adviser, so submissions reach nobody and
     nothing says so. Worth a banner rather than a silence. */
  const mgrGaps = state.advisers.filter(a =>
    a.role === "Manager" && a.active !== false && (!a.region || a.region === REGION_NONE));
  if (mgrGaps.length) {
    html += '<div class="banner warn no-print"><strong>' +
      (mgrGaps.length === 1 ? esc(mgrGaps[0].name) + " has" : mgrGaps.length + " managers have") +
      " no region.</strong> A manager is matched to advisers by region, so nothing reaches them &mdash; no reviews to approve, " +
      "no copy of a completed one. Set a region below, or <strong>" + esc(REGION_ALL) + "</strong> if they cover more than one.</div>";
  }

  for (const role of ROLES) {
    const people = state.advisers
      .map((a, i) => ({ a, i }))
      .filter(x => (x.a.role || "Adviser") === role);

    html += '<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>' +
      esc(rolePlural(role)) + "</h2>" +
      '<div class="sub">' + esc(ROLE_BLURB[role]) + "</div>" +
      '<div class="right no-print"><button class="btn ghost btn-sm" data-addrole="' + esc(role) + '">Add ' + esc(role.toLowerCase()) + "</button></div></div>";

    if (!people.length) {
      html += '<div class="card-b muted small">Nobody yet.</div></div>';
      continue;
    }

    /* Advisers need a region because it is how their clients are grouped;
       Managers need one because it decides whose reviews reach them. */
    const hasRegion = role === "Adviser" || role === "Manager";
    const regionOptions = role === "Manager"
      ? REGIONS.concat(REGION_ALL, REGION_NONE)
      : REGIONS.concat(REGION_NONE);

    html += '<div class="tbl-wrap" style="max-height:none"><table><thead><tr>' +
      "<th>" + (role === "Adviser" ? "Name (exactly as Xplan reports it)" : "Name") + "</th>" +
      "<th>Role</th>" + (hasRegion ? "<th>Region</th>" : "") +
      '<th>Email</th><th>Active</th><th class="no-print"></th></tr></thead><tbody>';

    for (const { a, i } of people) {
      html += '<tr><td><input type="text" data-adv="' + i + '" data-f="name" value="' + esc(a.name) + '"></td>' +
        '<td><select class="w140" data-adv="' + i + '" data-f="role">' +
          ROLES.map(r => '<option' + ((a.role || "Adviser") === r ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select></td>" +
        (hasRegion
          ? '<td><select class="w140" data-adv="' + i + '" data-f="region">' +
            regionOptions.map(r => '<option' + (a.region === r ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select></td>"
          : "") +
        '<td><input type="text" data-adv="' + i + '" data-f="email" value="' + esc(a.email || "") + '" placeholder="first.last@coastaladvisory.com.au"></td>' +
        '<td><input type="checkbox" data-adv="' + i + '" data-f="active"' + (a.active ? " checked" : "") + "></td>" +
        '<td class="no-print"><button class="btn ghost btn-sm" data-deladv="' + i + '">Remove</button></td></tr>';
    }
    html += "</tbody></table></div></div>";
  }

  html += '<div class="card"><div class="card-b small muted">Only Advisers appear in the Xplan extract, so only they pick up clients. ' +
    'Ops and Admins having neither clients nor a region is correct, not a fault. Deactivating someone keeps their history ' +
    'intact but drops them out of new runs &mdash; prefer it to removing them.' +
    '<br><br><strong>A Manager\'s region decides whose reviews reach them</strong> &mdash; submissions to approve, and the copy of a ' +
    'completed review. One who looks after more than one region is set to <strong>' + esc(REGION_ALL) + '</strong> and picks up every ' +
    'adviser. Do not add the same person twice, once per region: every lookup here finds somebody by name or email and would ' +
    'only ever see the first row.</div></div>';
  return html;
}

/* Kept separate from checkConnection so the report can be rendered from a
   fixture without a tenant. */
function renderConnReport(report) {
  const box = $("#connResult");
  if (!box) return;
  let html = '<div class="spacer"></div>';

  if (report.error) {
    box.innerHTML = html + '<div class="banner bad"><strong>Not connected.</strong> ' + explainAuthError(report.error) + "</div>";
    return;
  }

  html += '<div class="banner ' + (report.ok ? "info" : "bad") + '">' +
    (report.ok
      ? "<strong>Everything matches.</strong> Site: " + esc(report.site.name) + ". Nothing to fix."
      : "<strong>Some lists need attention.</strong> Site: " + esc(report.site.name) + ". Everything below is exactly what to change.") +
    "</div>";

  html += '<table><thead><tr><th>List</th><th class="num">Columns</th><th>State</th></tr></thead><tbody>';
  for (const l of report.lists) {
    const bad = l.findings.filter(f => f.level === "bad").length;
    const warn = l.findings.filter(f => f.level === "warn").length;
    /* A list that is optional and absent is a feature not switched on, not a
       fault. Red on that row sends somebody hunting for a problem. */
    const missingOk = !l.found && l.optional;
    const pill = missingOk ? "warn" : (!l.found || bad) ? "bad" : warn ? "warn" : "ok";
    const label = missingOk ? "not built yet"
      : !l.found ? "not found" : bad ? bad + " to fix" : warn ? warn + " to check" : "ok";
    html += "<tr><td><strong>" + esc(l.title) + '</strong><div class="small muted">' + esc(l.kind) +
      (l.aka ? ' &middot; on the site as "' + esc(l.aka) + '"' : "") + "</div></td>" +
      '<td class="num">' + (l.columnCount == null ? "—" : l.columnCount) + "</td>" +
      '<td><span class="pill ' + pill + '">' + esc(label) + "</span></td></tr>";
    for (const f of l.findings) {
      html += '<tr class="acct"><td colspan="3"><span class="pill ' + (f.level === "bad" ? "bad" : "warn") + '">' +
        esc(f.level === "bad" ? "fix" : "check") + "</span> " +
        (f.column ? "<code>" + esc(f.column) + "</code> " : "") + esc(f.text) + "</td></tr>";
    }
  }
  html += "</tbody></table>";
  box.innerHTML = html;
}

/* =========================================================================
   Event wiring — one pass per render
   ========================================================================= */
function wire() {
  const run = currentRun();

  /* --- file loading --- */
  const drop = $("#drop"), fileInput = $("#fileInput");
  if (drop) {
    drop.addEventListener("click", () => fileInput.click());
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
