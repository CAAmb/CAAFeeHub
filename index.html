  if (!run || !run.loaded) return;
  const key = run.key;

  const runFields = {
    RunStatus: run.status,
    RowCount: (run.rows || []).length,
    SourceFile: run.sourceName || "",
    RateCardSnapshot: JSON.stringify({ rateCard: run.rateCardSnapshot, funds: run.fundsSnapshot })
  };
  if (run.summary) {
    const json = JSON.stringify(run.summary);
    /* The column's ceiling. Rollups should never come close, but a firm that
       trebles its adviser count should find out here rather than by having a
       write rejected. */
    if (json.length > 60000) {
      runFields.SummaryJson = JSON.stringify({ v: 1, runKey: key, truncated: true,
        totals: run.summary.totals, lockedAt: run.summary.lockedAt });
    } else {
      runFields.SummaryJson = json;
    }
    runFields.LockedAt = run.summary.lockedAt;
    /* LockedBy is a person column and writing one needs the site user id, not
       the Entra id — the same reason AdviserUser is not written. The name is
       in the summary, and SharePoint's own Modified By records who did it. */
  }
  await spUpdate("runs", sp.runIds[key], runFields);

  sp.overrideIds[key] = sp.overrideIds[key] || {};
  sp.lastOverride[key] = sp.lastOverride[key] || {};
  for (const [adviser, ov] of partitionOverrides(run)) {
    const st = run.adviserStatus[adviser] || { status: "Not started" };
    const json = JSON.stringify(ov);
    const stamp = json + "|" + st.status + "|" + (st.note || "") + "|" + (st.submittedAt || "") + "|" + (st.approvedAt || "");
    if (sp.lastOverride[key][adviser] === stamp) continue;      // nothing changed for this adviser
    const fields = {
      Title: key + " — " + adviser,
      RunKey: key, Adviser: adviser,
      AdviserStatus: st.status, OverridesJson: json,
      SubmittedAt: st.submittedAt || null, ApprovedAt: st.approvedAt || null,
      ReturnNote: st.note || ""
    };
    if (sp.overrideIds[key][adviser]) await spUpdate("overrides", sp.overrideIds[key][adviser], fields);
    else sp.overrideIds[key][adviser] = (await spCreate("overrides", fields)).id;
    sp.lastOverride[key][adviser] = stamp;
  }
}

/* =========================================================================
   Notifications

   Rows, not emails. The app decides what should be said and to whom; a flow
   decides how it reads and actually sends it. Writing the reminder at the same
   moment as the invitation is what keeps the waiting visible — it is a row in
   a list with a date on it, not something a flow has to remember.
   ========================================================================= */

const adviserRow = name => state.advisers.find(a => a.name === name) || null;
const adviserEmail = name => { const a = adviserRow(name); return (a && a.email) || ""; };

/* Xplan files people surname-first — "Aldridge, Petra" — so the given name is
   whatever follows the comma. A directory row typed the other way round still
   works: without a comma, take the first word. A middle name is dropped either
   way, since "Hi Petra Jane," is not how anybody writes to a colleague. */
function firstNameOf(name) {
  const s = String(name || "").trim();
  if (!s) return "";
  const given = s.includes(",") ? s.slice(s.indexOf(",") + 1) : s;
  return given.trim().split(/\s+/)[0] || "";
}

/* Nothing at all rather than "Hi ," if the name is unusable. */
const greeting = name => {
  const f = firstNameOf(name);
  return f ? "Hi " + f + ",\n\n" : "";
};

/* A Manager whose region matches the adviser's. Several is fine — they all get
   it. None is not an error; the message still goes to the adviser. */
function regionalManagersFor(adviserName) {
  const a = adviserRow(adviserName);
  const region = a && a.region;
  if (!region || region === REGION_NONE) return [];
  return state.advisers.filter(x =>
    x.active !== false && x.role === "Manager" && x.email &&
    (x.region === region || x.region === REGION_ALL));
}

/* The same three tests the Approvals screen shows, so the screen and the email
   can never disagree about whether a book needs looking at. */
function checkSummaryFor(adviser) {
  const ms = (state.calc ? state.calc.masters : []).filter(m => m.adviser === adviser);
  const att = attentionFor(ms);
  return { needsCheck: att.total > 0,
           summary: att.total ? att.parts.map(p => p.label).join(", ") : "Nothing flagged." };
}

function notifyRow(o) {
  return {
    Title: o.run + " · " + o.kind + " · " + (o.adviser || ""),
    RunKey: o.run, Adviser: o.adviser || "",
    ToEmail: o.to || "", CcEmail: o.cc || "",
    Kind: o.kind, Message: o.message || "",
    NeedsCheck: !!o.needsCheck, CheckSummary: o.checkSummary || "",
    DueAt: o.dueAt || null,
    NotifyStatus: o.status || "Queued"
  };
}

/* Reads what is already queued for a run so pressing "Open for review" twice
   does not send everybody two invitations. */
async function existingNotifications(runKey) {
  if (!sp.lists.notifications) return [];
  const items = await spItems("notifications");
  return items.map(i => i.fields || {}).filter(f => String(f.RunKey || "") === runKey);
}

async function sendNotifications(rows, { note } = {}) {
  if (localMode() || !rows.length) return 0;
  if (!sp.lists.notifications) {
    toast("The " + LIST_TITLES.notifications + " list does not exist yet, so nothing was queued.", "bad");
    return 0;
  }
  let n = 0;
  for (const r of rows) {
    try { await spCreate("notifications", r); n++; }
    catch (e) { toast("Could not queue a message to " + (r.ToEmail || r.Adviser) + ". " + ((e && e.message) || e), "bad"); }
  }
  if (n && note) toast(note.replace("{n}", n), "good");
  return n;
}

/* Opening a run invites every adviser who has clients in it, and schedules the
   chase at the same time. Advisers with no email address in the directory are
   named rather than skipped in silence. */
async function notifyRunOpened(run) {
  if (localMode() || !state.calc) return;
  const advisers = [...new Set(state.calc.masters.map(m => m.adviser))].filter(Boolean).sort();
  const already = await existingNotifications(run.key);
  const has = (adviser, kind) => already.some(f => f.Adviser === adviser && f.Kind === kind);
  const due = new Date(Date.now() + REMINDER_DAYS * 86400000).toISOString();
  const rows = [];
  const noEmail = [];

  for (const a of advisers) {
    const to = adviserEmail(a);
    if (!to) { noEmail.push(a); continue; }
    const n = state.calc.masters.filter(m => m.adviser === a).length;
    const what = n + " client" + (n === 1 ? "" : "s") + " to review for " + monthLabel(run.key);
    if (!has(a, "Review ready")) {
      rows.push(notifyRow({ run: run.key, adviser: a, to, kind: "Review ready", status: "Queued",
        message: greeting(a) + what + ".\n\nThis is due within " + REMINDER_DAYS + " days." }));
    }
    if (!has(a, "Reminder")) {
      rows.push(notifyRow({ run: run.key, adviser: a, to, kind: "Reminder", status: "Scheduled", dueAt: due,
        cc: regionalManagersFor(a).map(m => m.email).join(";"),
        message: greeting(a) + what + ", still outstanding after " + REMINDER_DAYS + " days." }));
    }
  }
  const sent = await sendNotifications(rows);
  return { queued: sent, advisers: advisers.length, noEmail,
           alreadyHad: advisers.length - noEmail.length - (rows.length / 2) };
}

/* Says what actually happened, at length, because the failure that matters here
   is the silent one: every adviser missing an email address means zero rows
   written and nothing to show for a button press. */
function reportNotifyResult(res) {
  if (!res) return;
  if (res.noEmail.length) {
    alert(res.noEmail.length + " of " + res.advisers + " advisers have no email address in " +
      LIST_TITLES.advisers + ", so nothing was sent to them:\n\n" + res.noEmail.join("\n") +
      "\n\nThe name here must match their Xplan name exactly — that is what links a row in the " +
      "directory to the clients in the extract. Fix the directory, then press Notify advisers again." +
      (res.queued ? "\n\n" + res.queued + " messages were queued for the others." : ""));
    return;
  }
  if (!res.queued) {
    toast("Every adviser already had their invitation — nothing new to queue.");
    return;
  }
  toast(res.queued + " messages queued for " + (res.advisers - res.noEmail.length) + " advisers.", "good");
}

/* Submitting tells the regional manager, and says whether the book needs an
   eye on it. The scheduled reminder is left alone — the daily flow checks the
   adviser's status when it comes due and cancels itself. */
async function notifySubmitted(run, adviser) {
  if (localMode()) return;
  const mgrs = regionalManagersFor(adviser);
  if (!mgrs.length) return;
  const chk = checkSummaryFor(adviser);
  const ms = (state.calc ? state.calc.masters : []).filter(m => m.adviser === adviser);
  const cur = ms.reduce((a, m) => a + (m.currentFee || 0), 0);
  const nw = ms.reduce((a, m) => a + (m.fee || 0), 0);
  await sendNotifications([notifyRow({
    run: run.key, adviser, kind: "Completed", status: "Queued",
    to: mgrs.map(m => m.email).join(";"),
    needsCheck: chk.needsCheck, checkSummary: chk.summary,
    /* A line each, because this is the one message somebody skims to decide
       whether to open the run at all. */
    message: adviser + " has completed " + monthLabel(run.key) + ".\n\n" +
      "Clients: " + ms.length + "\n" +
      "Current fees: " + money(cur) + "\n" +
      "New fees: " + money(nw) + "\n" +
      "Movement: " + signed(nw - cur) + "\n\n" +
      (chk.needsCheck ? "Needs a look: " + chk.summary : "Nothing flagged.")
  })]);
}

/* Sent back. This is the one an adviser most needs to hear about — their work
   is read-only until they act, and if they had already submitted then their
   scheduled reminder was cancelled, so nothing else would reach them. The
   manager's note is the whole point of the message, so it is carried verbatim
   rather than summarised. */
async function notifyReturned(run, adviser, note) {
  if (localMode()) return;
  const to = adviserEmail(adviser);
  if (!to) { toast(adviser + " has no email in the directory, so they were not told.", "bad"); return; }
  const clean = String(note || "").trim();
  await sendNotifications([notifyRow({
    run: run.key, adviser, to, kind: "Returned", status: "Queued",
    /* No CC. Whoever sent it back is the one who would have been copied, and
       an email telling you what you just did is noise. */
    message: greeting(adviser) +
      "Your " + monthLabel(run.key) + " fee review has been sent back and needs another look." +
      (clean ? "\n\nWhat needs changing:\n" + clean : "")
  })], { note: adviser + " has been emailed." });
}

async function notifyApproved(run, adviser) {
  if (localMode()) return;
  const to = adviserEmail(adviser);
  if (!to) return;
  await sendNotifications([notifyRow({
    run: run.key, adviser, to, kind: "Approved", status: "Queued",
    message: greeting(adviser) +
      "Your " + monthLabel(run.key) + " fee review has been approved. Nothing further needed."
  })]);
}

/* The manual chase. Deliberate, pressed by a person, and the only thing that
   reaches an adviser whose work was sent back after they had already submitted
   — their scheduled reminder is long gone by then. */
async function notifyReminder(run, adviser) {
  const to = adviserEmail(adviser);
  if (!to) { toast(adviser + " has no email address in the directory.", "bad"); return; }
  const st = adviserState(adviser).status;
  const n = (state.calc ? state.calc.masters : []).filter(m => m.adviser === adviser).length;
  await sendNotifications([notifyRow({
    run: run.key, adviser, to, kind: "Reminder", status: "Queued",
    cc: regionalManagersFor(adviser).map(m => m.email).join(";"),
    message: greeting(adviser) + (st === "Returned"
      ? "Your " + monthLabel(run.key) + " review has been sent back and needs another look."
      : n + " client" + (n === 1 ? "" : "s") + " still to review for " + monthLabel(run.key) + ".") +
      "\n\nPlease complete as soon as possible."
  })], { note: "Reminder queued for " + adviser + "." });
}

/* What a locked month leaves behind.

   Rollups only — totals, and a line per adviser, per region, per category.
   Deliberately NOT a line per client: a "Multiple lines of text" column holds
   63,999 characters, and three hundred clients of detail would sail past that
   at exactly the moment the firm got big enough to want the history. These
   rollups are a couple of KB whatever happens.

   Nothing is lost by that. The extract for every month is kept in the library,
   so per-client history can be rebuilt if it is ever asked for; what cannot be
   rebuilt cheaply is the adviser rollup at the moment of locking, because the
   rate card and the caps have moved on since. */
function buildRunSummary(run, calc) {
  if (!calc) return null;
  const ms = calc.masters;
  const fumOf = list => [...new Set(list.map(m => m.fumKey))]
    .reduce((a, k) => a + (list.find(m => m.fumKey === k).totalFum || 0), 0);
  const r2 = n => Math.round((n || 0) * 100) / 100;

  const group = (keyOf) => {
    const g = new Map();
    for (const m of ms) {
      const k = keyOf(m) || "—";
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(m);
    }
    return [...g].sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  };
  const roll = list => ({
    clients: list.length,
    accounts: list.reduce((a, m) => a + m.rows.length, 0),
    fum: r2(fumOf(list)),
    current: r2(list.reduce((a, m) => a + (m.currentFee || 0), 0)),
    proposed: r2(list.reduce((a, m) => a + (m.fee || 0), 0)),
    offBand: list.filter(m => m.outsideBand).length,
    belowCurrent: list.filter(m => m.belowCurrent).length,
    platformIssues: list.filter(m => m.overCap || m.underMinBalance.length).length,
    splits: list.filter(m => m.splitFunds.length).length
  });

  const id = state.identity;
  return {
    v: 1,
    runKey: run.key,
    lockedAt: new Date().toISOString(),
    /* The person column is not written from here — see writeRun — so the name
       lives in the summary, which is the thing a history view reads anyway. */
    lockedBy: id ? { name: id.name, email: id.email } : null,
    sourceFile: run.sourceName || "",
    rateCardVersion: (run.rateCardSnapshot && run.rateCardSnapshot.version) || state.rateCard.version || "",
    totals: { ...roll(ms), unpriced: ms.filter(m => m.baseFee == null).length,
              hiddenDefaults: calc.hiddenDefaults, addedFunds: calc.addedFundCount },
    advisers: group(m => m.adviser).map(([name, list]) => ({
      name, region: (list[0] && list[0].region) || "—",
      status: adviserState(name).status, ...roll(list)
    })),
    regions: group(m => m.region).map(([name, list]) => ({ name, ...roll(list) })),
    categories: group(m => m.category).map(([name, list]) => ({
      name, mappedTo: (list[0] && list[0].mappedTo) || null, ...roll(list)
    }))
  };
}

/* The extract file first, then the run row. That order matters: a run row with
   no file behind it looks like a month that exists and opens empty, which is
   worse than an orphaned file nobody reads. */
async function publishRun(key, recs, fileName, existed) {
  const run = state.runs[key];
  state.saveState = "saving";
  paintSaveState();
  try {
    await spPutFile(runFilePath(key), JSON.stringify({ runKey: key, sourceFile: fileName, rows: recs }));
    const fields = {
      Title: key,
      RunYear: +key.slice(0, 4), RunMonth: +key.slice(5, 7),
      RunStatus: run.status, RowCount: recs.length, SourceFile: fileName || "",
      RateCardSnapshot: JSON.stringify({ rateCard: run.rateCardSnapshot, funds: run.fundsSnapshot })
    };
    if (sp.runIds[key]) await spUpdate("runs", sp.runIds[key], fields);
    else sp.runIds[key] = (await spCreate("runs", fields)).id;

    /* Replacing a month means its adviser edits are gone; leaving the old
       override rows behind would silently reapply them to new client ids. */
    if (existed) {
      for (const [adviser, id] of Object.entries(sp.overrideIds[key] || {})) {
        try { await spDelete("overrides", id); } catch (e) { /* already gone is fine */ }
      }
    }
    sp.overrideIds[key] = {};
    sp.lastOverride[key] = {};
    run.loaded = true;
    state.saveState = "saved";
    paintSaveState();
    render();
    toast(recs.length.toLocaleString("en-AU") + " rows imported for " + monthLabel(key) + ".", "good");
    celebrate();
  } catch (e) {
    /* The run is not on the site, so it must not look as though it is. */
    delete state.runs[key];
    state.runKey = Object.keys(state.runs).sort().pop() || null;
    state.saveState = "error";
    state.saveError = (e && e.message) || String(e);
    paintSaveState();
    render();
    toast("Import failed — nothing was saved. " + state.saveError, "bad");
  }
}

function paintSaveState() {
  const el = $("#saveState");
  if (!el) return;
  const map = {
    pending: ["", "Unsaved changes"],
    saving:  ["", "Saving…"],
    saved:   ["ok", "Saved"],
    error:   ["bad", "Not saved"]
  };
  const m = map[state.saveState];
  el.hidden = !m;
  if (!m) return;
  el.className = "pill " + m[0];
  el.textContent = m[1];
  el.title = state.saveState === "error"
    ? "The last save failed: " + state.saveError + " — it will keep retrying, and your work is still on screen."
    : "";
}

/* A dropped save must not leave silently. */
addEventListener("beforeunload", e => {
  if (localMode() || (!saver.pending.size && state.saveState !== "error")) return;
  e.preventDefault();
  e.returnValue = "";
});

/* =========================================================================
   Schema audit

   On a hand-built schema the failure that costs an afternoon is a column whose
   internal name differs from its display name, because Graph then reports it as
   simply absent. This looks for that case by name, and separately says what a
   plain "not found" actually means.
   ========================================================================= */

/* Graph describes a column's type through which facet is present. */
function graphColumnType(col) {
  if (col.personOrGroup) return "person";
  if (col.number)   return "number";
  if (col.choice)   return "choice";
  if (col.dateTime) return "dateTime";
  if (col.boolean)  return "boolean";
  if (col.text)     return col.text.allowMultipleLines ? "note" : "text";
  if (col.currency) return "currency";
  if (col.lookup)   return "lookup";
  if (col.calculated) return "calculated";
  return "unknown";
}

/* Pure, so it can be exercised without a tenant. Returns one finding per
   problem; an empty array means the list matches. */
function auditColumns(expected, actual) {
  const findings = [];
  const byName = new Map(actual.map(c => [String(c.name).toLowerCase(), c]));
  const byDisplay = new Map(actual.map(c => [String(c.displayName || "").toLowerCase(), c]));

  for (const want of expected.columns) {
    const got = byName.get(want.name.toLowerCase());

    if (!got) {
      /* The space trap: created through the UI with a display name, so the
         internal name carries _x0020_ and Graph cannot see it under the name
         the app uses. */
      const near = byDisplay.get(want.name.toLowerCase())
        || actual.find(c => String(c.name).replace(/_x0020_/g, "").toLowerCase() === want.name.toLowerCase())
        || actual.find(c => String(c.displayName || "").replace(/\s+/g, "").toLowerCase() === want.name.toLowerCase());
      if (near) {
        findings.push({ level: "bad", column: want.name,
          text: 'exists as "' + near.displayName + '" but its internal name is `' + near.name +
                "`. Created with a space in the name — delete it and add it again as `" + want.name + "`." });
      } else {
        findings.push({ level: "bad", column: want.name, text: "missing." });
      }
      continue;
    }

    const type = graphColumnType(got);
    if (type !== want.type) {
      findings.push({ level: "bad", column: want.name,
        text: "is a " + type + " column; it needs to be " + want.type + "." });
      continue;
    }

    /* Rich text wraps stored JSON in HTML and corrupts it. */
    if (want.type === "note" && got.text && got.text.textType && got.text.textType !== "plain") {
      findings.push({ level: "bad", column: want.name,
        text: "is set to enhanced rich text. It holds JSON, so it must be plain text." });
    }

    if (want.choices && got.choice && Array.isArray(got.choice.choices)) {
      const missing = want.choices.filter(c => !got.choice.choices.includes(c));
      const extra = got.choice.choices.filter(c => !want.choices.includes(c));
      if (missing.length) {
        findings.push({ level: "bad", column: want.name, text: "is missing the choice" +
          (missing.length > 1 ? "s " : " ") + missing.map(c => '"' + c + '"').join(", ") + "." });
      } else if (extra.length) {
        findings.push({ level: "warn", column: want.name, text: "has extra choices the app never sets: " +
          extra.map(c => '"' + c + '"').join(", ") + "." });
      }
    }
  }
  return findings;
}

/* Walks the site and reports what is there, what is missing and what is wrong.
   Every failure is caught and turned into a readable line rather than thrown. */
async function checkConnection() {
  const report = { ok: false, site: null, lists: [], error: null };
  try {
    const site = await graph("/sites/" + CONFIG.sitePath + "?$select=id,displayName,webUrl");
    report.site = { id: site.id, name: site.displayName, url: site.webUrl };
  } catch (e) {
    report.error = "Could not reach the site. " + e.message;
    return report;
  }

  let lists;
  try {
    lists = (await graph("/sites/" + report.site.id + "/lists?$select=id,name,displayName,list")).value || [];
  } catch (e) {
    report.error = "Signed in, but could not list the site's lists. " + e.message;
    return report;
  }

  for (const key of Object.keys(EXPECTED_SCHEMA)) {
    const spec = EXPECTED_SCHEMA[key];
    const row = { key, title: spec.title, kind: spec.kind, found: false, findings: [] };
    const norm = s => String(s || "").toLowerCase().replace(/[\s_-]/g, "");
    const hit = lists.find(l => l.displayName === spec.title)
      || lists.find(l => norm(l.displayName) === norm(spec.title))
      || lists.find(l => norm(l.name) === norm(spec.title));

    if (!hit) {
      /* An optional list is a feature that is not switched on yet, not a
         fault. Saying "to fix" about the notification list before anybody has
         built it sends people hunting for a problem they do not have. */
      row.optional = !!spec.optional;
      row.findings.push(spec.optional
        ? { level: "warn", column: "", text: "not built yet, so notifications are not queued. Everything else works without it." }
        : { level: "bad", column: "", text: "not found on the site. Check the name is exactly \"" + spec.title + "\"." });
      report.lists.push(row);
      continue;
    }

    row.found = true;
    row.id = hit.id;
    row.actualTitle = hit.displayName;
    /* Not a finding. Lists are resolved to an id once at startup and the match
       ignores spaces, hyphens and underscores, so "FeeCalculatorRuns" and
       "Fee Calculator Runs" are the same thing as far as the app is concerned.
       Unlike columns, a list's title has no bearing on how Graph addresses it. */
    if (hit.displayName !== spec.title) row.aka = hit.displayName;

    try {
      const cols = (await graph("/sites/" + report.site.id + "/lists/" + hit.id + "/columns")).value || [];
      row.columnCount = cols.length;
      row.findings.push(...auditColumns(spec, cols));
    } catch (e) {
      row.findings.push({ level: "bad", column: "", text: "columns could not be read. " + e.message });
    }
    report.lists.push(row);
  }

  report.ok = report.lists.every(l =>
    (l.found || l.optional) && !l.findings.some(f => f.level === "bad"));
  return report;
}

/* =========================================================================
   Small helpers
   ========================================================================= */
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n == null || !isFinite(n)) ? "—" : "$" + Math.round(n).toLocaleString("en-AU");
const pct = n => (n == null || !isFinite(n)) ? "—" : (n * 100).toFixed(3) + "%";
const num = v => { const n = parseFloat(String(v).replace(/[$,\s]/g, "")); return isFinite(n) ? n : 0; };
const monthLabel = k => k ? new Date(k + "-01T00:00:00").toLocaleDateString("en-AU", { month: "long", year: "numeric" }) : "—";

/* Locking a run is the one moment in the month that is actually finished, so it
   gets a moment. Canvas rather than a few hundred DOM nodes, and it sits out
   entirely for anyone who has asked for reduced motion. */
function celebrate() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);

  const COLOURS = ["#def5ff", "#eba380", "#2a78d6", "#1baf7a", "#eda100",
                   "#e6976e", "#ffffff", "#5ec8f0", "#f2c14e", "#16344a"];
  const rand = (a, b) => a + Math.random() * (b - a);
  const bits = [];

  function burst(x, y, aim, spread, count, power) {
    for (let i = 0; i < count; i++) {
      const angle = aim + rand(-spread, spread);
      const speed = power * rand(0.55, 1.25);
      /* One piece in six is a streamer: longer, lighter, and it hangs in the air
         after the heavier confetti has dropped. */
      const ribbon = Math.random() < 0.17;
      bits.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        w: ribbon ? rand(3, 5) : rand(6, 12),
        h: ribbon ? rand(14, 24) : rand(5, 10),
        drag: ribbon ? 0.982 : 0.994,
        weight: ribbon ? rand(0.14, 0.22) : rand(0.30, 0.46),
        rot: rand(0, Math.PI * 2), spin: rand(-0.34, 0.34),
        /* tilt drives a scaleY flip each cycle, which is what makes a flat piece
           of paper read as tumbling in three dimensions rather than sliding. */
        tilt: rand(0, Math.PI * 2), tiltSpeed: rand(0.08, 0.2),
        wobble: rand(0, Math.PI * 2), wobbleSpeed: rand(0.03, 0.08),
        sway: rand(0.4, 1.4),
        colour: COLOURS[(Math.random() * COLOURS.length) | 0]
      });
    }
  }

  const W = innerWidth, H = innerHeight;
  /* Three waves. Cannons first so it reads as a launch, a centre fountain behind
     it for depth, then a second pair to stop it thinning out too early. */
  const waves = [
    { at: 0,  fn: () => {
      burst(-20, H * 0.78, -Math.PI * 0.30, 0.34, 130, 26);
      burst(W + 20, H * 0.78, -Math.PI * 0.70, 0.34, 130, 26);
    }},
    { at: 14, fn: () => burst(W / 2, H + 20, -Math.PI / 2, 0.55, 110, 25) },
    { at: 34, fn: () => {
      burst(-20, H * 0.62, -Math.PI * 0.22, 0.30, 80, 29);
      burst(W + 20, H * 0.62, -Math.PI * 0.78, 0.30, 80, 29);
    }}
  ];

  const LIFE = 420;
  let frame = 0;
  /* rAF stops in a backgrounded tab, which would leave a frozen layer of
     confetti over the page until it was focused again. Sweep it up regardless. */
  const sweep = setTimeout(() => cv.remove(), 14000);
  const done = () => { clearTimeout(sweep); cv.remove(); };

  (function tick() {
    for (const w of waves) if (w.at === frame) w.fn();
    ctx.clearRect(0, 0, W, H);

    let alive = 0;
    for (const b of bits) {
      b.vy += b.weight;                       // gravity, lighter on streamers
      b.vx *= b.drag; b.vy *= b.drag;         // air resistance
      b.wobble += b.wobbleSpeed;
      b.x += b.vx + Math.sin(b.wobble) * b.sway;
      b.y += b.vy;
      b.rot += b.spin;
      b.tilt += b.tiltSpeed;
      if (b.y > H + 60 || b.x < -80 || b.x > W + 80) continue;
      alive++;

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.scale(1, Math.cos(b.tilt));         // the tumble
      ctx.globalAlpha = frame > LIFE - 90 ? Math.max(0, (LIFE - frame) / 90) : 1;
      ctx.fillStyle = b.colour;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }

    /* Keep going while anything is still on screen or a wave is still to come. */
    if ((alive || frame < 40) && ++frame < LIFE) requestAnimationFrame(tick);
    else done();
  })();
}

/* Widens a text input to fit its own content. An input's scrollWidth does not
   reliably report the text width, so measure it with a hidden span carrying the
   same typography. One span, reused. */
let _ruler = null;
function fitInputWidth(el) {
  if (!_ruler) {
    _ruler = document.createElement("span");
    _ruler.setAttribute("aria-hidden", "true");
    _ruler.style.cssText = "position:absolute;left:-9999px;top:-9999px;white-space:pre;visibility:hidden";
    document.body.appendChild(_ruler);
  }
  const cs = getComputedStyle(el);
  _ruler.style.font = cs.font;
  _ruler.style.letterSpacing = cs.letterSpacing;
  _ruler.textContent = el.value || el.placeholder || "";
  const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) +
              parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  el.style.width = Math.max(110, Math.ceil(_ruler.offsetWidth + pad) + 6) + "px";
}

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* =========================================================================
   XLSX reading, without a library.
   An .xlsx is a zip of XML. The browser can inflate raw deflate streams
   natively, so the whole reader is a central-directory walk plus DOMParser.
   Keeping it in-house means no CDN in the CSP and no supply-chain surface on
   a page that will eventually hold client FUM.
   ========================================================================= */
async function readZip(buffer) {
  const dv = new DataView(buffer);
  const bytes = new Uint8Array(buffer);

  /* End-of-central-directory record: fixed signature, up to 64KB of trailing
     comment, so scan backwards rather than assuming it is the last 22 bytes. */
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a valid .xlsx file (no zip directory found).");

  const count = dv.getUint16(eocd + 10, true);
  let ptr = dv.getUint32(eocd + 16, true);
  const files = {};
  const dec = new TextDecoder("utf-8");

  for (let i = 0; i < count; i++) {
    if (dv.getUint32(ptr, true) !== 0x02014b50) break;
    const method   = dv.getUint16(ptr + 10, true);
    const compSize = dv.getUint32(ptr + 20, true);
    const nameLen  = dv.getUint16(ptr + 28, true);
    const extraLen = dv.getUint16(ptr + 30, true);
    const cmtLen   = dv.getUint16(ptr + 32, true);
    const localOff = dv.getUint32(ptr + 42, true);
    const name     = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + cmtLen;

    /* Local header repeats the name/extra lengths and they can differ from the
       central copy, so the data offset must come from the local header. */
    const lNameLen  = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    files[name] = { method, start: dataStart, size: compSize };
  }

  const out = {};
  for (const [name, f] of Object.entries(files)) {
    if (!/\.(xml|rels)$/i.test(name)) continue;
    const slice = bytes.subarray(f.start, f.start + f.size);
    if (f.method === 0) { out[name] = dec.decode(slice); continue; }
    if (f.method !== 8) continue;                       // only stored + deflate appear in real xlsx
    if (typeof DecompressionStream === "undefined") {
      throw new Error("This browser cannot unzip .xlsx files. Use Edge or Chrome, or export the report as CSV.");
    }
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([slice]).stream().pipeThrough(ds);
    out[name] = await new Response(stream).text();
  }
  return out;
}

function parseXlsx(text) {
  const xp = new DOMParser();

  const sharedDoc = text["xl/sharedStrings.xml"] ? xp.parseFromString(text["xl/sharedStrings.xml"], "application/xml") : null;
  const shared = sharedDoc
    ? Array.from(sharedDoc.getElementsByTagName("si")).map(si =>
        Array.from(si.getElementsByTagName("t")).map(t => t.textContent).join(""))
    : [];

  /* Take the first sheet in workbook order — the Xplan export only ever has one. */
  const wb = xp.parseFromString(text["xl/workbook.xml"], "application/xml");
  const rels = xp.parseFromString(text["xl/_rels/workbook.xml.rels"], "application/xml");
  const firstSheet = wb.getElementsByTagName("sheet")[0];
  const rid = firstSheet.getAttribute("r:id") || firstSheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
  let target = null;
  for (const rel of Array.from(rels.getElementsByTagName("Relationship"))) {
    if (rel.getAttribute("Id") === rid) { target = rel.getAttribute("Target"); break; }
  }
  const path = "xl/" + String(target || "worksheets/sheet1.xml").replace(/^\/?xl\//, "");
  if (!text[path]) throw new Error("Could not find the worksheet inside the workbook.");

  const ws = xp.parseFromString(text[path], "application/xml");
  const grid = [];
  for (const row of Array.from(ws.getElementsByTagName("row"))) {
    const r = parseInt(row.getAttribute("r"), 10);
    const cells = [];
    for (const c of Array.from(row.getElementsByTagName("c"))) {
      const ref = c.getAttribute("r") || "";
      const col = colIndex(ref.replace(/\d+/g, ""));
      const t = c.getAttribute("t");
      let v = null;
      if (t === "inlineStr") {
        v = Array.from(c.getElementsByTagName("t")).map(n => n.textContent).join("");
      } else {
        const vn = c.getElementsByTagName("v")[0];
        if (vn) v = (t === "s") ? (shared[parseInt(vn.textContent, 10)] || "") : vn.textContent;
      }
      if (v != null) cells[col] = v;
    }
    grid[r - 1] = cells;
  }
  return grid;
}

function colIndex(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

/* CSV fallback — same 12 columns, for anyone who saves the Xplan report as CSV. */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* Map a raw grid onto the 12 known columns using the header row. */
function gridToRecords(grid) {
  if (!grid || !grid.length) throw new Error("The file is empty.");
  const header = (grid[0] || []).map(h => String(h || "").trim().toLowerCase());
  const idx = {};
  SOURCE_COLUMNS.forEach((c, i) => {
    let at = header.indexOf(c.header.toLowerCase());
    if (at < 0) at = header.findIndex(h => h.replace(/[^a-z]/g, "") === c.header.toLowerCase().replace(/[^a-z]/g, ""));
    idx[c.key] = at >= 0 ? at : i;          // fall back to position
  });
  const missing = SOURCE_COLUMNS.filter(c => header.indexOf(c.header.toLowerCase()) < 0).map(c => c.header);

  const recs = [];
  for (let r = 1; r < grid.length; r++) {
    const g = grid[r];
    if (!g) continue;
    const rec = {};
    for (const c of SOURCE_COLUMNS) rec[c.key] = g[idx[c.key]] == null ? "" : String(g[idx[c.key]]).trim();
    if (!rec.masterId && !rec.masterName) continue;
    rec.value = num(rec.value);
    rec.currentFee = num(rec.currentFee);
    recs.push(rec);
  }
  if (!recs.length) throw new Error("No data rows found under the header.");
  return { recs, missing };
}

/* =========================================================================
   The engine — the workbook's columns M through AK, in order.
   Every step below maps to a named column so the two can be reconciled.
   ========================================================================= */
function calculate(run) {
  const rc = state.rateCard;
  const overrides = run.overrides || {};
  const advIndex = new Map(state.advisers.map(a => [a.name, a]));
  const catIndex = new Map(rc.categories.map(c => [String(c.name).toLowerCase(), c.annual]));
  const weightIndex = new Map(rc.entityWeights.map(w => [String(w.name).toLowerCase(), w.weight]));
  const funds = buildFundIndex(state.funds);

  /* Keys are taken from the position in the untouched extract, before anything
     is added or hidden, so an override stays attached to its fund no matter what
     the screen is currently showing. */
  let rows = run.rows.map((r, i) => ({ ...r, key: rowKey(r, i), i }));

  /* Funds the adviser added by hand. They inherit the client's identity so they
     land in the right FUM group, and carry a uid so removing one does not
     re-point the overrides of the others. */
  const proto = new Map();
  for (const r of rows) if (!proto.has(r.masterId)) proto.set(r.masterId, r);
  for (const k of Object.keys(run.overrides || {})) {
    if (k.slice(0, 4) !== "add:") continue;
    const p = proto.get(k.slice(4));
    if (!p) continue;
    for (const a of run.overrides[k] || []) {
      rows.push({
        ...p, key: "add~" + a.uid, i: rows.length, manual: true, uid: a.uid,
        memberId: p.masterId, memberName: p.masterName,
        subfundName: a.name || "Added fund",
        vendor: a.vendor || "Added by adviser",
        value: num(a.value), entityCat: "-"
      });
    }
  }

  /* Xplan's empty "- Default" placeholders. Dropped from the view rather than
     the run, and never dropped if they are all a client has — a client with no
     accounts would vanish from a review that is partly about their fee. */
  let hiddenDefaults = 0;
  if (!state.showEmptyDefaults) {
    const realRows = new Map();
    for (const r of rows) if (!isEmptyDefault(r)) realRows.set(r.masterId, true);
    const kept = rows.filter(r => !(isEmptyDefault(r) && realRows.get(r.masterId)));
    hiddenDefaults = rows.length - kept.length;
    rows = kept;
  }

  /* M — negative or blank subfund values are treated as zero, as MAX($K,0). */
  for (const r of rows) {
    const ov = overrides["row:" + r.key] || {};
    r.valueUsed = ov.value != null ? num(ov.value) : Math.max(r.value, 0);
    r.valueEdited = ov.value != null;

    /* N — recover the platform from the subfund name when Xplan says N/A.
       LOOKUP(2,1/ISNUMBER(SEARCH(...))) takes the LAST match, so do the same. */
    const fm = matchFundDetail(r, funds);
    r.fund = fm.fund;
    r.fundRivals = fm.rivals;
    if (r.vendor && r.vendor !== "N/A") r.vendorUsed = r.vendor;
    else r.vendorUsed = r.fund ? r.fund.name : "N/A";

    r.autoIncluded = r.vendorUsed !== "N/A";                       // Q
    r.override = ov.include || "";                                 // R — "", Include, Exclude
    r.included = r.override === "Exclude" ? false
               : r.override === "Include" ? true
               : r.autoIncluded;

    /* T groups by Client Group ID when Xplan supplies one, otherwise by the
       master client — the two SUMIFS branches in the workbook. */
    r.fumKey = (r.groupId && r.groupId !== "N/A") ? "G" + r.groupId : "M" + r.masterId;

    /* AD/AE — an extra entity only earns a weight when its category differs
       from the master's, it is not the master record itself, and it is one of
       the weighted entity types. */
    const isExtra = r.override === "Exclude" ? false
                  : (r.category === r.entityCat) ? false
                  : (r.category && r.entityCat === "-") ? false : true;
    r.entityWeight = (isExtra && r.masterId !== r.memberId)
      ? (weightIndex.get(String(r.entityCat).toLowerCase()) || 0) : 0;
  }

  /* AG/AH — count each member entity once per master, then total per master. */
  const seenEntity = new Set();
  const entityTotal = new Map();
  for (const r of rows) {
    const k = r.masterId + "|" + r.memberName;
    const w = seenEntity.has(k) ? 0 : r.entityWeight;
    seenEntity.add(k);
    entityTotal.set(r.masterId, (entityTotal.get(r.masterId) || 0) + w);
  }

  /* T — total FUM per grouping key, counting only included accounts. */
  const fum = new Map();
  for (const r of rows) if (r.included) fum.set(r.fumKey, (fum.get(r.fumKey) || 0) + r.valueUsed);
  for (const r of rows) {
    r.totalFum = fum.get(r.fumKey) || 0;
    r.weight = (r.included && r.totalFum > 0) ? r.valueUsed / r.totalFum : 0;   // V
  }

  /* Roll rows up to master clients — the level fees are actually set at. */
  const masters = new Map();
  for (const r of rows) {
    let m = masters.get(r.masterId);
    if (!m) {
      m = {
        masterId: r.masterId, name: r.masterName, adviser: r.adviser,
        category: r.category, currentFee: r.currentFee, fumKey: r.fumKey,
        rows: [], totalFum: 0
      };
      masters.set(r.masterId, m);
    }
    m.rows.push(r);
    if (r.currentFee > m.currentFee) m.currentFee = r.currentFee;
  }

  const unpricedCats = new Map();
  const unknownAdvisers = new Set();
  const out = [];

  for (const m of masters.values()) {
    m.totalFum = fum.get(m.fumKey) || 0;
    m.includedCount = m.rows.filter(r => r.included).length;

    const adv = advIndex.get(m.adviser);
    m.region = adv && adv.active ? adv.region : "—";
    if (!adv) unknownAdvisers.add(m.adviser);

    m.entityWeightTotal = entityTotal.get(m.masterId) || 0;                     // AH
    m.entityFee = m.entityWeightTotal * rc.additionalEntityFee;
    m.surcharge = surchargeFor(m.totalFum, rc.surchargeBands);                  // AI

    /* A category prices either because its name is on the card, or because it is
       mapped to one. Mapping wins, so "C" can be sent to Platinum even though a
       literal "C" also sits on the card at a different price. */
    m.mappedTo = rc.aliases[m.category] || null;
    const lookup = m.mappedTo || m.category;
    const base = catIndex.has(String(lookup).toLowerCase())
      ? catIndex.get(String(lookup).toLowerCase()) : null;
    m.baseFee = base;
    m.pricedVia = base == null ? null : (m.mappedTo ? "mapped" : "direct");

    if (base == null) {
      unpricedCats.set(m.category || "(blank)", (unpricedCats.get(m.category || "(blank)") || 0) + 1);
      m.rateCardFee = null;                                                     // W — cannot be priced
    } else {
      /* W — the fee never falls below what the client pays today. */
      m.rateCardFee = Math.max(base + m.entityFee + m.surcharge, m.currentFee, rc.absoluteMinimum);
    }

    const ov = overrides["master:" + m.masterId] || {};
    m.pctInput = ov.pctInput != null ? num(ov.pctInput) : null;                 // AB, when typed over
    m.comment = ov.comment || "";                                               // AM

    /* S / AL — how the client is priced and where the money comes from are no
       longer chosen on the client line; they are read back from what has
       actually been set. Anything set on a fund makes the client variable,
       otherwise a typed percentage or a typed fee speaks for itself. This is
       why there is no way to be in Fixed Fee mode with no fee in the box. */
    m.fundsPriced = m.rows.filter(r => r.included && (overrides["row:" + r.key] || {}).mode).length;
    m.mode = m.fundsPriced ? "Variable"
           : m.pctInput != null ? "Percentage"
           : ov.fee != null ? "Fixed Fee" : "";
    /* m.fundsSourced and m.paymentSource are settled further down, once the
       split rules have run — the house rule sets a payment source by itself, so
       the answer is not known until the shortfalls are. */
    /* A fee typed before the funds were priced is still on the record but no
       longer in play. Say so rather than leaving a stale number on screen. */
    m.feeShadowed = m.mode === "Variable" && ov.fee != null;

    /* X — adviser's fee. Percentage mode drives off the typed percentage, which
       is what the workbook's instruction to "first adjust column AB" really means.
       Variable is different in kind: the client fee is not set at all, it is the
       sum of what each fund charges. */
    if (m.mode === "Variable") {
      m.fee = 0;
      m.unsetFunds = 0;
      for (const r of m.rows) {
        if (!r.included) { r.fundFee = null; continue; }
        const rov = overrides["row:" + r.key] || {};
        r.feeMode = rov.mode || "";
        if (r.feeMode === "Percentage") {
          /* A fund percentage is charged on that fund's own balance — otherwise
             two funds at 1% would each take 1% of the whole book. */
          r.fundPct = rov.pct != null ? num(rov.pct) : null;
          r.fundFee = r.fundPct != null ? r.fundPct * r.valueUsed : null;
        } else if (r.feeMode === "Fixed Fee") {
          r.fundFee = rov.fee != null ? num(rov.fee) : null;
        } else {
          r.fundFee = null;                       // charges nothing until set
        }
        if (r.fundFee == null) m.unsetFunds++; else m.fee += r.fundFee;
      }
    } else if (m.mode === "Percentage" && m.pctInput != null) {
      m.fee = m.pctInput * m.totalFum;
    } else if (ov.fee != null) {
      m.fee = num(ov.fee);
    } else {
      m.fee = m.rateCardFee;
    }
    m.feeEdited = m.mode === "Variable" || ov.fee != null || (m.mode === "Percentage" && m.pctInput != null);

    m.pctOfFum = (m.fee != null && m.totalFum > 0) ? m.fee / m.totalFum : null;  // AB / AK
    m.diffToCard = (m.fee != null && m.rateCardFee != null) ? m.fee - m.rateCardFee : null; // AC
    m.variance = (m.fee != null) ? m.fee - m.currentFee : null;                 // what Y was meant to be
    m.outsideBand = (m.rateCardFee != null && m.fee != null && m.rateCardFee > 0)
      ? Math.abs(m.fee - m.rateCardFee) / m.rateCardFee > rc.variancePct : false;
    /* Percentage mode multiplies out to whatever the FUM gives, so it can land
       under what the client pays today — the one route around the never-decrease
       rule. Surface it rather than silently clamping the adviser's own number. */
    m.belowCurrent = m.fee != null && m.currentFee > 0 && m.fee < m.currentFee - 0.5;

    /* AA / Z — what each account carries. On a Variable client the fund fee is
       the real figure; everywhere else the fee is split by the account's weight. */
    for (const r of m.rows) {
      r.feeShare = (m.mode === "Variable")
        ? r.fundFee
        : ((m.fee != null) ? Math.round(m.fee * r.weight) : null);
      r.varianceShare = (m.variance != null) ? Math.round(m.variance * r.weight) : null;
    }

    /* Platform fee caps. Not a Coastal pricing rule — this is the most each
       platform will let us draw from an account, so it is a compliance ceiling
       and the answer is per account. */
    m.overCapFunds = [];
    m.underMinBalance = [];
    m.splitFunds = [];

    /* The house split rule, and the whole of its scope. It bites only where the
       client is too small for the minimum fee to be reachable at maxDrawPct of
       their balance: at 2% and a $4,000 minimum, a $150,000 client yields
       $3,000 from the platform and $1,000 has to be direct debited. Above that
       line the fee is collectable as a percentage and nothing changes.
       (Illustrative figures — the real ones live in the rate card.) */
    m.houseDrawMax = rc.maxDrawPct > 0 ? (rc.maxDrawPct / 100) * m.totalFum : null;
    m.houseSplitApplies = rc.maxDrawPct > 0 && rc.absoluteMinimum > 0
      && m.houseDrawMax < rc.absoluteMinimum;
    for (const r of m.rows) {
      r.cap = null; r.capValue = null; r.capBinding = ""; r.overCap = false; r.overCapBy = null;
      r.underMinBalance = false;
      if (!r.included) continue;
      const cap = fundCap(r.fund, r.valueUsed);
      if (cap) {
        r.cap = cap;
        r.capValue = cap.value;
        r.capBinding = cap.kind;
        if (r.feeShare != null && r.feeShare > cap.value + 0.5) {
          r.overCap = true;
          r.overCapBy = r.feeShare - cap.value;
          m.overCapFunds.push(r);
        }
      }
      /* A balance under the platform's floor means the fee is not reduced, it
         simply never gets drawn — worth catching before the month it fails. */
      if (r.fund && r.fund.minBalance > 0 && r.valueUsed < r.fund.minBalance && (r.feeShare || 0) > 0) {
        r.underMinBalance = true;
        m.underMinBalance.push(r);
      }

      /* How much of this fund's fee can actually come off the platform. Two
         separate ceilings, and the lower wins:

         The platform's own — under its minimum balance it carries none of the
         fee, over its cap it carries the cap. Compliance.

         And ours — on a client too small for the minimum fee to be reachable
         as a percentage, we draw no more than maxDrawPct of the balance and
         direct debit the difference. Policy, not compliance, and it applies
         only to those clients: see houseSplitApplies above. */
      const capMax = r.underMinBalance ? 0 : (r.capValue == null ? Infinity : r.capValue);
      const houseMax = m.houseSplitApplies
        ? (rc.maxDrawPct / 100) * Math.max(r.valueUsed, 0) : Infinity;
      r.houseMax = houseMax;
      r.platformMax = Math.min(capMax, houseMax);
      r.limitedBy = r.underMinBalance ? "minimum balance"
                  : houseMax < capMax ? "house rule"
                  : isFinite(capMax) ? "platform cap" : "";
      r.shortfall = (r.feeShare != null && r.feeShare > r.platformMax + 0.5)
        ? Math.round(r.feeShare) - Math.floor(r.platformMax) : 0;
      r.needsSplit = r.shortfall > 0;
      /* The balance this account would need for the whole fee to come off the
         platform — the number to quote when asking a client to consolidate.
         Only meaningful where a percentage is what is binding. */
      const bindingPct = r.limitedBy === "house rule" ? rc.maxDrawPct
        : (r.limitedBy === "platform cap" && r.capBinding === "percentage" && r.fund) ? r.fund.capPct : 0;
      r.fumForFullFee = (r.needsSplit && bindingPct > 0) ? r.feeShare / (bindingPct / 100) : null;
      if (r.needsSplit) m.splitFunds.push(r);
    }

    /* The most this client could be charged before some fund breaches its cap,
       which is the number an adviser actually wants when they see the warning.

       Priced by fund, each fund stands alone, so the ceiling is the sum of the
       caps — and only meaningful if every fund has one. Priced at the client
       level the fee is split by weight, so one fund's cap implies a client-wide
       limit of cap ÷ weight, and the tightest of those binds. */
    const includedRows = m.rows.filter(r => r.included);
    const cappedRows = includedRows.filter(r => r.capValue != null);
    if (!cappedRows.length) {
      m.maxFee = null;
    } else if (m.mode === "Variable") {
      m.maxFee = cappedRows.length === includedRows.length
        ? cappedRows.reduce((a, r) => a + r.capValue, 0) : null;
    } else {
      m.maxFee = Math.min(...cappedRows.filter(r => r.weight > 0).map(r => r.capValue / r.weight));
      if (!isFinite(m.maxFee)) m.maxFee = null;
    }
    m.overCap = m.overCapFunds.length > 0;
    m.overCapBy = m.overCap ? m.overCapFunds.reduce((a, r) => a + r.overCapBy, 0) : null;

    /* AL — where the money comes from. Set on the funds, never on the client
       line, and read back here.

       The house rule sets itself: when a client is under the minimum-fee line
       the split is not a judgement call, it is arithmetic we have already done,
       so the source defaults to the split and the amounts are filled. A
       platform cap is left to the adviser, because there the answer might be
       consolidating or repricing rather than a direct debit. Nothing is
       written to the run either way — an explicit choice always wins. */
    for (const r of m.rows) {
      r.autoSplit = !!(r.included && m.houseSplitApplies && r.needsSplit
        && !(overrides["row:" + r.key] || {}).paymentSource);
    }
    m.fundsSourced = m.rows.filter(r =>
      r.included && ((overrides["row:" + r.key] || {}).paymentSource || r.autoSplit)).length;
    m.paymentSource = m.fundsSourced ? "Variable" : "";

    /* Where the fee is drawn from. Variable means each fund names its own source
       and its own dollar amount; the amounts are the same money as the fee, so
       they have to add back up to it. */
    m.collected = null;
    m.paymentGap = null;
    m.directDebitTotal = 0;
    if (m.paymentSource === "Variable") {
      m.collected = 0;
      m.fundsWithoutSource = 0;
      for (const r of m.rows) {
        if (!r.included) { r.paymentSource = ""; r.paymentAmount = null; r.payPlatform = null; r.payDirect = null; continue; }
        const rov = overrides["row:" + r.key] || {};
        r.paymentSource = rov.paymentSource || (r.autoSplit ? PAY_SPLIT : "");
        r.paymentAuto = r.autoSplit;
        /* Default to this fund's share of the fee, so picking a source without
           editing the number still reconciles. */
        r.paymentAmount = rov.paymentAmount != null ? num(rov.paymentAmount)
          : (r.feeShare != null ? Math.round(r.feeShare) : 0);
        r.paymentEdited = rov.paymentAmount != null;

        /* Split payment: the platform takes as much as it is allowed to and the
           rest is direct debited. Defaulting the platform side to its maximum
           is deliberate — a direct debit needs the client's authority, so the
           less of the fee that depends on one, the better. Editable, because
           an adviser may have a reason to draw less. */
        r.payPlatform = null;
        r.payDirect = null;
        if (r.paymentSource === PAY_SPLIT) {
          const want = r.feeShare != null ? Math.round(r.feeShare) : 0;
          const ceiling = isFinite(r.platformMax) ? Math.floor(r.platformMax) : want;
          r.payPlatform = rov.payPlatform != null
            ? Math.max(0, Math.min(num(rov.payPlatform), want))
            : Math.max(0, Math.min(want, ceiling));
          r.payDirect = want - r.payPlatform;
          r.payPlatformEdited = rov.payPlatform != null;
          /* Both halves are the same money as the fee, so the total is the fee
             and the reconciliation below is unaffected by the split. */
          r.paymentAmount = rov.paymentAmount != null ? num(rov.paymentAmount) : want;
          m.directDebitTotal += r.payDirect;
          /* Drawing more from the platform than it will allow is the one thing
             a split is supposed to prevent, so say so if it has been edited
             back over the line. */
          r.splitOverPlatform = isFinite(r.platformMax) && r.payPlatform > Math.floor(r.platformMax) + 0.5;
        }
        r.paymentShort = r.feeShare != null && r.paymentAmount < Math.round(r.feeShare) - 0.5;
        if (!r.paymentSource) m.fundsWithoutSource++;
        m.collected += r.paymentAmount;
      }
      if (m.fee != null) {
        /* Amounts are whole dollars, so compare whole dollars — otherwise the
           cents rounded off each fund's default show up as a phantom shortfall. */
        m.paymentGap = Math.round(m.fee) - Math.round(m.collected);
        m.paymentShort = m.paymentGap >= 1;
      }
    }
    out.push(m);
  }

  out.sort((a, b) => (a.adviser || "").localeCompare(b.adviser || "") || (a.name || "").localeCompare(b.name || ""));

  /* Every category the extract contains, with how it is currently resolving.
     This is what the mapping screen and the ambiguity check both read. */
  const catSeen = new Map();
  for (const m of out) {
    const key = m.category || "(blank)";
    const e = catSeen.get(key) || { category: key, clients: 0, currentFees: 0, mappedTo: m.mappedTo, pricedVia: m.pricedVia, rate: m.baseFee };
    e.clients++;
    e.currentFees += m.currentFee || 0;
    catSeen.set(key, e);
  }
  /* Only the bare letter codes are genuinely ambiguous. The named tiers kept
     their meaning between the two tables and merely changed price; A–F were
     re-pointed at different tiers, so a name match on one of those is a coin
     flip dressed up as a result. */
  const ambiguous = [...catSeen.values()].filter(e =>
    e.pricedVia === "direct" && /^[A-F]$/i.test(String(e.category).trim()));

  return {
    rows, masters: out,
    categories: [...catSeen.values()].sort((a, b) => b.clients - a.clients),
    ambiguous,
    unpricedCats: [...unpricedCats.entries()].sort((a, b) => b[1] - a[1]),
    unknownAdvisers: [...unknownAdvisers].filter(Boolean).sort(),
    droppedRows: rows.filter(r => !r.included).length,
    hiddenDefaults,
    addedFundCount: rows.filter(r => r.manual).length,
    unsetFundClients: out.filter(m => m.mode === "Variable" && m.unsetFunds > 0),
    paymentShortfalls: out.filter(m => m.paymentShort),
    overCap: out.filter(m => m.overCap),
    underMinBalance: out.filter(m => m.underMinBalance.length),
    /* Clients where some part of the fee cannot come off the platform at all,
       so a direct debit has to cover the rest — a conversation with the client,
       not just a number to change. */
    needSplit: out.filter(m => m.splitFunds.length),
    /* Platforms in the run that are not in the fund list at all — no cap can be
       checked for them, which is a gap worth naming rather than passing. */
    unknownFunds: [...new Set(rows.filter(r => r.included && !r.fund)
      .map(r => r.vendorUsed).filter(v => v && v !== "N/A"))].sort(),
    /* Worse than an unknown platform: Xplan gave no vendor, nothing in the fund
       table matched the account name either, so the balance is out of FUM
       altogether. Money quietly missing is the one failure nobody spots. */
    noPlatform: rows.filter(r => !r.included && !r.fund && r.override !== "Exclude" && r.valueUsed > 0),
    /* Accounts that two funds both claim. Resolved by longest match, but a
       clash means one of the two alias lists is wrong and the caps being
       checked may be the wrong platform's. */
    fundClashes: rows.filter(r => r.fundRivals && r.fundRivals.length)
  };
}

/* AI — marginal surcharge across the FUM bands. */
function surchargeFor(fumValue, bands) {
  const sorted = [...bands].sort((a, b) => a.from - b.from);
  let total = 0;
  for (let i = 0; i < sorted.length; i++) {
    const from = sorted[i].from;
    const to = (i + 1 < sorted.length) ? sorted[i + 1].from : Infinity;
    const slice = Math.min(Math.max(fumValue - from, 0), to - from);
    total += slice * sorted[i].rate;
  }
  return Math.round(total * 100) / 100;
}

/* A row identity that survives re-uploads: the duplicate "Default" subfund
   lines in the Xplan export mean the natural key needs an occurrence counter,
   and position within the extract is the only thing that separates them. */
function rowKey(r, i) {
  const base = [r.groupId, r.masterId, r.memberId, r.subfundName].join("~");
  return base + "~" + i;
}

/* An Xplan placeholder: a subfund whose name ends in "Default" carrying no
   balance. Both halves are required — a "- Default" line with money in it is a
   real account under an unhelpful name, and hiding it would understate the FUM.
   A hand-added fund is never treated as one, however it is named. */
function isEmptyDefault(r) {
  if (r.manual) return false;
  return /default\s*$/i.test(String(r.subfundName || "").trim()) && num(r.value) <= 0;
}

/* Funds an adviser has added to a client, in the order they added them. */
function addedFunds(run, masterId) {
  return (run && run.overrides && run.overrides["add:" + masterId]) || [];
}

/* Which client an added fund belongs to. The uid is the only thing the DOM
   carries, so the answer comes from the overrides themselves. */
function masterOfAddedFund(uid) {
  const run = currentRun();
  if (!run) return null;
  for (const k of Object.keys(run.overrides || {})) {
    if (k.slice(0, 4) !== "add:") continue;
    if ((run.overrides[k] || []).some(a => a.uid === uid)) return k.slice(4);
  }
  return null;
}

function setAddedFunds(masterId, list) {
  const run = currentRun();
  if (!run) return;
  /* Written straight to the run rather than through setOverride, which is built
     for flat objects and would strip an array's empty entries. */
  if (list.length) run.overrides["add:" + masterId] = list;
  else delete run.overrides["add:" + masterId];
  saveRuns();
  recalc();
}

/* =========================================================================
   Run lifecycle
   ========================================================================= */
function newRun(monthKey, rows, sourceName) {
  return {
    key: monthKey,
    isSample: sourceName === SAMPLE_LABEL,
    sampleVersion: sourceName === SAMPLE_LABEL ? SAMPLE_VERSION : undefined,
    createdAt: new Date().toISOString(),
    sourceName: sourceName || "",
    status: "Draft",
    rows,
    overrides: {},
    adviserStatus: {},          // adviser -> { status, submittedAt, approvedAt, approver, note }
    /* Pricing AND the platform caps as they stood the day the run was made.
       The caps live in their own list and change whenever a platform changes
       its mind, so without this a run reviewed in March could not be explained
       in September — the cap that passed it would already be gone. */
    rateCardSnapshot: JSON.parse(JSON.stringify(state.rateCard)),
    fundsSnapshot: JSON.parse(JSON.stringify(state.funds))
  };
}

function currentRun() { return state.runKey ? state.runs[state.runKey] : null; }

function recalc() {
  const run = currentRun();
  /* A connected run carries no rows until its month is opened, and every view
     already knows what to do with no calc. */
  state.calc = (run && Array.isArray(run.rows)) ? calculate(run) : null;
}

/* Local mode's leftovers are not this app's data once there is a real source
   of truth, and a monthly extract has no business sitting in a browser profile
   on a shared machine. The UI preferences stay — they are nobody's secret. */
function clearLocalData() {
  for (const k of [LS.rateCard, LS.advisers, LS.funds, LS.runs]) {
    try { localStorage.removeItem(k); } catch (e) { /* a locked-down browser is fine */ }
  }
}

/* Switching months fetches that month, because only the index is held. */
async function openRun(key) {
  if (!state.runs[key]) return;
  state.runKey = key;
  state.expanded = {};
  state.expandedAdviser = {};
  saveUi();
  if (!localMode() && !state.runs[key].loaded) {
    toast("Loading " + monthLabel(key) + "…");
    try { await loadRun(key); }
    catch (e) { toast("Could not load " + monthLabel(key) + ". " + ((e && e.message) || e), "bad"); }
  }
  render();
}

function setOverride(scope, id, patch) {
  const run = currentRun();
  if (!run) return;
  const k = scope + ":" + id;
  const cur = run.overrides[k] || {};
  const next = { ...cur, ...patch };
  for (const key of Object.keys(next)) if (next[key] === "" || next[key] == null) delete next[key];
  if (Object.keys(next).length) run.overrides[k] = next; else delete run.overrides[k];
  saveRuns();
  recalc();
}

function adviserState(name) {
  const run = currentRun();
  const s = run && run.adviserStatus[name];
  return s || { status: "Not started" };
}

/* =========================================================================
   Views
   ========================================================================= */
/* 20x20 line icons, drawn on currentColor so they inherit the nav state. They
   exist for the collapsed rail — a rail of initials would be unreadable. */
const ICONS = {
  run:        '<path d="M4 16V9m5 7V4m5 12v-5m5 5V7"/>',
  review:     '<path d="M4 5h16M4 10h16M4 15h10"/><circle cx="17" cy="16" r="3"/>',
  exceptions: '<path d="M12 4 3 19h18Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
  approvals:  '<path d="M5 12.5 9.5 17 19 7"/>',
  ratecard:   '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 14h4"/>',
  pricing:    '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2m3 0h3M8 15h2m3 0h3"/>',
  /* Keyed by view id — this was still "advisers" after the screen became
     "people", so the rail was drawing an empty svg. */
  people:     '<circle cx="9.5" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.9-5.5 6.5-5.5S16 15.7 16 19"/>' +
              '<circle cx="17.6" cy="9.2" r="2.3"/><path d="M16.4 14.4c2.9.3 5.1 2.2 5.1 4.6"/>',
  settings:   '<circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>'
};
const icon = id => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
  (ICONS[id] || "") + "</svg>";

/* `needs` names the capability a role must have for the item to appear. */
const VIEWS = [
  { id: "run",       label: "Run/Dashboard", section: "Run", needs: "run" },
  { id: "review",    label: "Review",     section: "Run",    needs: "run",
    adviserLabel: "My Clients", adviserSection: "Fee Review", alsoAdviser: true },
  { id: "exceptions",label: "Exceptions", section: "Run",    needs: "run" },
  { id: "approvals", label: "Approvals",  section: "Run",    needs: "approve" },
  /* Everyone gets this one, advisers included — it prices a new or existing
     client and has nothing to do with whose book a run belongs to. */
  { id: "pricing",   label: "Pricing Calculator", section: "Tools", needs: "pricing",
    adviserSection: "Tools" },
  { id: "ratecard",  label: "Rate/Fee Settings", section: "Admin", needs: "rateCard" },
  { id: "people",    label: "People",     section: "Admin",  needs: "people" },
  { id: "settings",  label: "Settings",   section: "Admin",  needs: "settings" }
];
const visibleViews = () =>
  VIEWS.filter(v => can(v.needs) || (v.alsoAdviser && can("ownBook")));

/* Who the review screen is scoped to. Ops and above pick with the filter; an
   adviser is pinned to themselves and cannot widen it. */
function scopedAdviser() {
  if (!can("ownBook")) return state.filterAdviser === "all" ? null : state.filterAdviser;
  return state.asAdviser;
}

/* Advisers who actually have clients in the loaded run — the only ones worth
   offering in the demo picker. */
function advisersInRun() {
  return state.calc ? [...new Set(state.calc.masters.map(m => m.adviser))].filter(Boolean).sort() : [];
}

function renderNav() {
  const c = state.calc;
  const exCount = c ? (c.unpricedCats.reduce((a, x) => a + x[1], 0) + c.unknownAdvisers.length + c.ambiguous.length) : 0;
  const pending = c ? state.advisers.filter(a => adviserState(a.name).status === "Submitted").length : 0;
  let html = "", lastSec = "";
  for (const v of visibleViews()) {
    const adviserMode = can("ownBook");
    const sec = adviserMode ? (v.adviserSection || v.section) : v.section;
    if (sec !== lastSec) { html += '<div class="nav-sec">' + esc(sec) + "</div>"; lastSec = sec; }
    let badge = "";
    if (!adviserMode && v.id === "exceptions" && exCount) badge = '<span class="count alert">' + exCount + "</span>";
    if (!adviserMode && v.id === "approvals" && pending) badge = '<span class="count">' + pending + "</span>";
    const label = adviserMode ? (v.adviserLabel || v.label) : v.label;
    /* title carries the label for the collapsed rail, where the text is hidden. */
    html += '<button class="nav-btn' + (state.view === v.id ? " active" : "") + '" data-view="' + v.id +
      '" title="' + esc(label) + '">' + icon(v.id) + '<span class="nav-label">' + esc(label) + "</span>" + badge + "</button>";
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("[data-view]").forEach(b =>
    b.addEventListener("click", () => { state.view = b.dataset.view; render(); }));
}

/* The top bar is sticky and wraps to two rows on a narrow window, so anything
   pinned beneath it cannot assume a fixed offset. Measured rather than guessed,
   and published as a custom property the CSS reads. */
function measureTopbar() {
  const top = document.querySelector("header.top");
  if (top) document.documentElement.style.setProperty("--topbar-h", Math.round(top.getBoundingClientRect().height) + "px");
}

/* The sidebar gives way when the table needs the width. Below 1180px it drops to
   an icon rail on its own; the toggle lets anyone pin it either way, and that
   choice sticks. */
function applyNavWidth() {
  const collapsed = state.navCollapsed === null
    ? window.innerWidth < 1180
    : state.navCollapsed;
  document.body.classList.toggle("nav-mini", collapsed);
  const btn = $("#navToggle");
  if (btn) {
    btn.innerHTML = collapsed ? "&raquo;" : "&laquo;";
    btn.title = collapsed ? "Expand menu" : "Collapse menu";
    btn.setAttribute("aria-label", btn.title);
  }
}

/* Which screen the DOM currently holds, so a rebuild of the same screen can put
   the table's scroll position back. Declared up here because the sign-in gate
   clears it too. */
let renderedView = null;

/* Sign in, work out who that is, and hand over to the app. Every failure gets
   its own screen saying what to do about it, because "nothing happened" is the
   worst possible answer to a sign-in. */
async function startSession() {
  state.authState = "signing-in";
  renderGate();
  try {
    await getToken(true);                 // may navigate away to Entra and come back
    const id = await resolveIdentity();
    state.identity = id;
    if (!id.role) {
      /* Being turned away has to leave nothing behind. A role from a previous
         session, or from this browser's stored settings, would otherwise still
         be sitting in state — harmless while the gate holds, and a hole the
         moment somebody refactors the gate. */
      state.role = "";
      state.asAdviser = null;
      state.authState = "denied";
      saveUi();
      renderGate();
      return;
    }
    state.role = id.role;
    /* An adviser is only ever themselves, and Title is what Xplan calls them —
       which is the name their clients are filed under. */
    state.asAdviser = id.role === "Adviser" && id.row ? String(id.row.Title || "") : null;

    /* Anything this browser was holding from local mode is not this app's
       data any more, and client records have no business sitting in a profile
       once there is a real source of truth. */
    clearLocalData();

    state.authState = "loading";
    renderGate();
    await loadReference();
    await loadRunIndex();
    if (state.runKey) await loadRun(state.runKey);

    state.authState = "ready";
    saveUi();
    render();
    if (id.bootstrap) {
      toast("No Admin in the directory yet, so you are one. Add a real Admin row to close this.", "bad");
    }
  } catch (e) {
    state.authState = "error";
    state.authError = explainAuthError(e);
    renderGate();
  }
}

/* The screens before the app: signing in, turned away, or broken. Drawn
   straight into #page with the nav empty, so there is nothing to click past. */
function renderGate() {
  const id = state.identity;
  document.body.classList.add("gate");
  $("#pgTitle").textContent = "CAA Fee Calculator";
  $("#pgSub").textContent = CONFIG.sitePath.split(":/").pop();
  $("#nav").innerHTML = "";
  $("#topActions").innerHTML = "";
  $("#demoBar").hidden = true;
  $("#whoName").textContent = id ? id.name : "Not signed in";
  $("#whoRole").textContent = id ? id.email : "";
  $("#whoAvatar").textContent = id ? initials(id.name) : "?";

  /* The brand mark, then whatever this particular state needs to say. Same
     shell every time so the screen does not jump between states. */
  const card = b => '<div class="gate-card">' +
    '<img class="mark" src="' + logoSrc() + '" alt="Coastal Advisory Australia">' + b +
    '<div class="foot">' + esc(CONFIG.sitePath.split(":/").pop()) + "</div></div>";
  let html = "";

  if (state.authState === "signing-in") {
    html = card('<div class="gate-spin"></div><h2>Signing you in</h2>' +
      '<div class="lead">Checking who you are against the adviser directory. ' +
      "If a Microsoft sign-in page opens, that is this app asking.</div>");
  } else if (state.authState === "loading") {
    html = card('<div class="gate-spin"></div><h2>Loading</h2>' +
      '<div class="lead">Reading the rate card, the fund table and this month\'s run. ' +
      "Client data is never kept on this machine, so it comes fresh every time.</div>");
  } else if (state.authState === "error") {
    html = card("<h2>Could not sign in</h2>" +
      '<div class="banner bad">' + state.authError + "</div>" +
      '<button class="btn sky" id="btnRetryAuth">Try again</button>');
  } else if (state.authState === "denied" && id) {
    /* Being turned away is the common case on day one, so it says exactly what
       has to go in the list and what to tell whoever owns it. */
    const why = id.inactive
      ? "Your row in the directory is marked <strong>not active</strong>."
      : id.row && !id.row.AccessRole
        ? "You are in the directory, but your row has no <strong>AccessRole</strong> set."
      : id.row
        ? "Your row has an AccessRole of <strong>" + esc(id.row.AccessRole) + "</strong>, which is not one of " +
          ROLES.join(", ") + "."
        : "There is no row for you in the <strong>" + esc(LIST_TITLES.advisers) + "</strong> list.";
    html = card("<h2>You don't have access yet</h2>" +
      '<div class="banner warn">' + why + "</div>" +
      '<div class="kv"><div class="k">Signed in as</div><div class="v">' + esc(id.name) + "</div>" +
      '<div class="k">Email</div><div class="v mono">' + esc(id.email) + "</div>" +
      '<div class="k">Directory rows</div><div class="v">' + id.rows + "</div></div>" +
      '<div class="lead" style="font-size:.78rem;text-align:left">Ask an Admin to add you to <code>' +
      esc(LIST_TITLES.advisers) + "</code> with your email in the <code>Email</code> column and a role in " +
      "<code>AccessRole</code>. An adviser's <code>Title</code> must match their Xplan name exactly, or their " +
      "clients will not find them.</div>" +
      '<button class="btn ghost" id="btnRetryAuth">Check again</button>');
  } else {
    html = card("<h2>Fee Calculator</h2>" +
      '<div class="lead">The monthly adviser fee review. Pricing, people and runs all live in ' +
      "SharePoint, so it needs to know who you are.</div>" +
      '<button class="btn sky" id="btnSignIn">Sign in with Microsoft</button>');
  }

  $("#page").innerHTML = html;
  if ($("#btnSignIn")) $("#btnSignIn").addEventListener("click", startSession);
  if ($("#btnRetryAuth")) $("#btnRetryAuth").addEventListener("click", startSession);
  renderedView = null;
}

function render() {
  /* Connected and not yet through the gate: nothing of the app is drawn. */
  if (!localMode() && state.authState !== "ready") { renderGate(); return; }
  document.body.classList.remove("gate");
  recalc();

  /* Nobody may be left standing on a screen their role cannot open, and an
     adviser cannot be nobody — default them into the first adviser with clients. */
  const adviserMode = can("ownBook");
  if (adviserMode) {
    const inRun = advisersInRun();
    if (!state.asAdviser || (inRun.length && !inRun.includes(state.asAdviser))) state.asAdviser = inRun[0] || null;
  }
  if (!visibleViews().some(v => v.id === state.view)) {
    state.view = (visibleViews()[0] || { id: "review" }).id;
  }

  renderNav();
  applyNavWidth();
  measureTopbar();
  const run = currentRun();
  const titles = {
    run: "Run/Dashboard", review: "Review", exceptions: "Exceptions",
    approvals: "Approvals", pricing: "Pricing Calculator",
    ratecard: "Rate/Fee Settings", people: "People", settings: "Settings"
  };
  $("#pgTitle").textContent = (adviserMode && state.view === "review") ? "My Clients" : (titles[state.view] || "Run/Dashboard");
  /* The pricing calculator stands apart from the monthly run, so the subtitle
     says what the prices are rather than which month is loaded. */
  $("#pgSub").innerHTML = state.view === "pricing"
    ? (pricing().reviewed ? "Pricing last reviewed " + esc(pricing().reviewed) : "Internal pricing") +
      " &middot; all fees include GST"
    : run
    ? monthLabel(run.key) + ' &middot; <span class="pill ' + statusPill(run.status) + '">' +
      esc(adviserMode ? adviserState(state.asAdviser).status : run.status) + "</span>" +
      (can("run") ? " &middot; " + run.rows.length.toLocaleString("en-AU") + " rows" : "")
    : "No run loaded";

  const id = state.identity;
  const who = id ? id.name : (adviserMode ? (state.asAdviser || "Adviser") : state.role);
  const dir = adviserMode ? state.advisers.find(a => a.name === state.asAdviser) : null;
  $("#whoName").textContent = who;
  $("#whoRole").textContent = id
    ? state.role + (adviserMode && dir ? " · " + dir.region : "")
    : adviserMode
      ? (dir ? dir.region + " region" : "not in the directory")
      : "Local mode — no sign-in";
  $("#whoAvatar").textContent = initials(who);
  renderTopActions();
  paintSaveState();

  const fn = { run: viewRun, review: viewReview, exceptions: viewExceptions,
               approvals: viewApprovals, pricing: viewPricing, ratecard: viewRateCard,
               people: viewPeople, settings: viewSettings }[state.view];
  /* Says out loud, on every screen, that anybody can be anybody. Better a
     banner nobody can miss than a constant nobody remembers. */
  const bootstrapping = state.identity && state.identity.bootstrap;
  $("#demoBar").innerHTML = localMode()
    ? '<strong>Local mode.</strong> No sign-in, so the role buttons in the top bar decide who you are and anyone ' +
      "can read any adviser's book. Everything stays in this browser. Not for real client data."
    : bootstrapping
      ? '<strong>No Admin in the directory yet.</strong> Until a row in <code>' + esc(LIST_TITLES.advisers) +
        "</code> has <code>AccessRole</code> set to Admin, whoever opens this app is treated as one. " +
        "Add yourself on the People screen to close it."
      : "";
  $("#demoBar").hidden = !(localMode() || bootstrapping);
  /* The client table scrolls inside itself, and every edit rebuilds the page.
     Without this, setting a fee on the twentieth client throws you back to the
     first one — which is most of the work of a review. */
  /* Only worth restoring when the same screen is being rebuilt — arriving on a
     screen should start at the top, not wherever the last one was left. */
  const wrap = renderedView === state.view ? document.querySelector(".tbl-wrap") : null;
  const at = wrap ? { top: wrap.scrollTop, left: wrap.scrollLeft } : null;
  $("#page").innerHTML = fn ? fn() : "";
  if (fn) wire();
  if (at) {
    const back = document.querySelector(".tbl-wrap");
    if (back) { back.scrollTop = at.top; back.scrollLeft = at.left; }
  }
  renderedView = state.view;
}

/* "Aldridge, Petra" reads as PA, not AP — surname-first is the Xplan convention. */
function initials(name) {
  const parts = String(name || "").split(/[,\s]+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
