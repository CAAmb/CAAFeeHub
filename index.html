      if (!isFinite(m.maxFee)) m.maxFee = null;
    }
    m.overCap = m.overCapFunds.length > 0;
    m.overCapBy = m.overCap ? m.overCapFunds.reduce((a, r) => a + r.overCapBy, 0) : null;

    /* AL — where the money comes from. Set on the funds, never on the client
       line, and read back here.

       The house rule sets itself: when a client is under the minimum-fee line
       the split is not a judgement call, it is arithmetic we have already done,
       so the source defaults to the split and the amounts are filled. A
       platform cap is left to the adviser, because there the answer might be
       consolidating or repricing rather than a direct debit. Nothing is
       written to the run either way — an explicit choice always wins. */
    for (const r of m.rows) {
      r.autoSplit = !!(r.included && m.houseSplitApplies && r.needsSplit
        && !(overrides["row:" + r.key] || {}).paymentSource);
    }
    m.fundsSourced = m.rows.filter(r =>
      r.included && ((overrides["row:" + r.key] || {}).paymentSource || r.autoSplit)).length;
    m.paymentSource = m.fundsSourced ? "Variable" : "";

    /* Where the fee is drawn from. Variable means each fund names its own source
       and its own dollar amount; the amounts are the same money as the fee, so
       they have to add back up to it. */
    m.collected = null;
    m.paymentGap = null;
    m.directDebitTotal = 0;
    if (m.paymentSource === "Variable") {
      m.collected = 0;
      m.fundsWithoutSource = 0;
      for (const r of m.rows) {
        if (!r.included) { r.paymentSource = ""; r.paymentAmount = null; r.payPlatform = null; r.payDirect = null; continue; }
        const rov = overrides["row:" + r.key] || {};
        r.paymentSource = rov.paymentSource || (r.autoSplit ? PAY_SPLIT : "");
        r.paymentAuto = r.autoSplit;
        /* Default to this fund's share of the fee, so picking a source without
           editing the number still reconciles. */
        r.paymentAmount = rov.paymentAmount != null ? num(rov.paymentAmount)
          : (r.feeShare != null ? Math.round(r.feeShare) : 0);
        r.paymentEdited = rov.paymentAmount != null;

        /* Split payment: the platform takes as much as it is allowed to and the
           rest is direct debited. Defaulting the platform side to its maximum
           is deliberate — a direct debit needs the client's authority, so the
           less of the fee that depends on one, the better. Editable, because
           an adviser may have a reason to draw less. */
        r.payPlatform = null;
        r.payDirect = null;
        if (r.paymentSource === PAY_SPLIT) {
          const want = r.feeShare != null ? Math.round(r.feeShare) : 0;
          const ceiling = isFinite(r.platformMax) ? Math.floor(r.platformMax) : want;
          r.payPlatform = rov.payPlatform != null
            ? Math.max(0, Math.min(num(rov.payPlatform), want))
            : Math.max(0, Math.min(want, ceiling));
          r.payDirect = want - r.payPlatform;
          r.payPlatformEdited = rov.payPlatform != null;
          /* Both halves are the same money as the fee, so the total is the fee
             and the reconciliation below is unaffected by the split. */
          r.paymentAmount = rov.paymentAmount != null ? num(rov.paymentAmount) : want;
          m.directDebitTotal += r.payDirect;
          /* Drawing more from the platform than it will allow is the one thing
             a split is supposed to prevent, so say so if it has been edited
             back over the line. */
          r.splitOverPlatform = isFinite(r.platformMax) && r.payPlatform > Math.floor(r.platformMax) + 0.5;
        }
        r.paymentShort = r.feeShare != null && r.paymentAmount < Math.round(r.feeShare) - 0.5;
        if (!r.paymentSource) m.fundsWithoutSource++;
        m.collected += r.paymentAmount;
      }
      if (m.fee != null) {
        /* Amounts are whole dollars, so compare whole dollars — otherwise the
           cents rounded off each fund's default show up as a phantom shortfall. */
        m.paymentGap = Math.round(m.fee) - Math.round(m.collected);
        m.paymentShort = m.paymentGap >= 1;
      }
    }
    out.push(m);
  }

  out.sort((a, b) => (a.adviser || "").localeCompare(b.adviser || "") || (a.name || "").localeCompare(b.name || ""));

  /* Removed clients come out here rather than being filtered at every reader.
     Everything downstream — totals, exceptions, approvals, the report, the CSV
     — works off `masters`, so one split keeps them out of all of it, and
     `removed` is what the screens that must show them read instead. */
  const removed = out.filter(m => m.removed);
  out = out.filter(m => !m.removed);

  /* Every category the extract contains, with how it is currently resolving.
     This is what the mapping screen and the ambiguity check both read. */
  const catSeen = new Map();
  for (const m of out) {
    const key = m.category || "(blank)";
    const e = catSeen.get(key) || { category: key, clients: 0, currentFees: 0, mappedTo: m.mappedTo, pricedVia: m.pricedVia, rate: m.baseFee };
    e.clients++;
    e.currentFees += m.currentFee || 0;
    catSeen.set(key, e);
  }
  /* Only the bare letter codes are genuinely ambiguous. The named tiers kept
     their meaning between the two tables and merely changed price; A–F were
     re-pointed at different tiers, so a name match on one of those is a coin
     flip dressed up as a result. */
  const ambiguous = [...catSeen.values()].filter(e =>
    e.pricedVia === "direct" && /^[A-F]$/i.test(String(e.category).trim()));

  return {
    rows, masters: out, removed,
    categories: [...catSeen.values()].sort((a, b) => b.clients - a.clients),
    ambiguous,
    unpricedCats: [...unpricedCats.entries()].sort((a, b) => b[1] - a[1]),
    unknownAdvisers: [...unknownAdvisers].filter(Boolean).sort(),
    droppedRows: rows.filter(r => !r.included).length,
    hiddenDefaults,
    addedFundCount: rows.filter(r => r.manual).length,
    unsetFundClients: out.filter(m => m.mode === "Variable" && m.unsetFunds > 0),
    paymentShortfalls: out.filter(m => m.paymentShort),
    overCap: out.filter(m => m.overCap),
    underMinBalance: out.filter(m => m.underMinBalance.length),
    /* Clients where some part of the fee cannot come off the platform at all,
       so a direct debit has to cover the rest — a conversation with the client,
       not just a number to change. */
    needSplit: out.filter(m => m.splitFunds.length),
    /* Platforms in the run that are not in the fund list at all — no cap can be
       checked for them, which is a gap worth naming rather than passing. */
    unknownFunds: [...new Set(rows.filter(r => r.included && !r.fund)
      .map(r => r.vendorUsed).filter(v => v && v !== "N/A"))].sort(),
    /* Worse than an unknown platform: Xplan gave no vendor, nothing in the fund
       table matched the account name either, so the balance is out of FUM
       altogether. Money quietly missing is the one failure nobody spots. */
    noPlatform: rows.filter(r => !r.included && !r.fund && r.override !== "Exclude" && r.valueUsed > 0),
    /* Accounts that two funds both claim. Resolved by longest match, but a
       clash means one of the two alias lists is wrong and the caps being
       checked may be the wrong platform's. */
    fundClashes: rows.filter(r => r.fundRivals && r.fundRivals.length)
  };
}

/* AI — marginal surcharge across the FUM bands. */
function surchargeFor(fumValue, bands) {
  const sorted = [...bands].sort((a, b) => a.from - b.from);
  let total = 0;
  for (let i = 0; i < sorted.length; i++) {
    const from = sorted[i].from;
    const to = (i + 1 < sorted.length) ? sorted[i + 1].from : Infinity;
    const slice = Math.min(Math.max(fumValue - from, 0), to - from);
    total += slice * sorted[i].rate;
  }
  return Math.round(total * 100) / 100;
}

/* A row identity that survives re-uploads: the duplicate "Default" subfund
   lines in the Xplan export mean the natural key needs an occurrence counter,
   and position within the extract is the only thing that separates them. */
function rowKey(r, i) {
  const base = [r.groupId, r.masterId, r.memberId, r.subfundName].join("~");
  return base + "~" + i;
}

/* An Xplan placeholder: a subfund whose name ends in "Default" carrying no
   balance. Both halves are required — a "- Default" line with money in it is a
   real account under an unhelpful name, and hiding it would understate the FUM.
   A hand-added fund is never treated as one, however it is named. */
function isEmptyDefault(r) {
  if (r.manual) return false;
  return /default\s*$/i.test(String(r.subfundName || "").trim()) && num(r.value) <= 0;
}

/* Funds an adviser has added to a client, in the order they added them. */
function addedFunds(run, masterId) {
  return (run && run.overrides && run.overrides["add:" + masterId]) || [];
}

/* Which client an added fund belongs to. The uid is the only thing the DOM
   carries, so the answer comes from the overrides themselves. */
function masterOfAddedFund(uid) {
  const run = currentRun();
  if (!run) return null;
  for (const k of Object.keys(run.overrides || {})) {
    if (k.slice(0, 4) !== "add:") continue;
    if ((run.overrides[k] || []).some(a => a.uid === uid)) return k.slice(4);
  }
  return null;
}

function setAddedFunds(masterId, list) {
  const run = currentRun();
  if (!run) return;
  /* Written straight to the run rather than through setOverride, which is built
     for flat objects and would strip an array's empty entries. */
  if (list.length) run.overrides["add:" + masterId] = list;
  else delete run.overrides["add:" + masterId];
  saveRuns();
  recalc();
}

/* =========================================================================
   Run lifecycle
   ========================================================================= */
function newRun(monthKey, rows, sourceName) {
  return {
    key: monthKey,
    createdAt: new Date().toISOString(),
    sourceName: sourceName || "",
    status: "Draft",
    rows,
    overrides: {},
    adviserStatus: {},          // adviser -> { status, submittedAt, approvedAt, approver, note }
    /* Pricing AND the platform caps as they stood the day the run was made.
       The caps live in their own list and change whenever a platform changes
       its mind, so without this a run reviewed in March could not be explained
       in September — the cap that passed it would already be gone. */
    rateCardSnapshot: JSON.parse(JSON.stringify(state.rateCard)),
    fundsSnapshot: JSON.parse(JSON.stringify(state.funds))
  };
}

function currentRun() { return state.runKey ? state.runs[state.runKey] : null; }

function recalc() {
  const run = currentRun();
  /* A connected run carries no rows until its month is opened, and every view
     already knows what to do with no calc. */
  state.calc = (run && Array.isArray(run.rows)) ? calculate(run) : null;
}

/* Nothing writes these any more. A browser that used the platform before the
   site became the source of truth may still be holding a month's extract in its
   profile, so they are cleared once on the way in. Removable in a later version,
   once every machine has been through here. */
const LEGACY_KEYS = ["caaFee.rateCard", "caaFee.advisers", "caaFee.funds", "caaFee.runs"];
function clearLegacyLocalData() {
  for (const k of LEGACY_KEYS) {
    try { localStorage.removeItem(k); } catch (e) { /* a locked-down browser is fine */ }
  }
}

/* Switching months fetches that month, because only the index is held. */
async function openRun(key) {
  if (!state.runs[key]) return;
  state.runKey = key;
  state.expanded = {};
  state.expandedAdviser = {};
  saveUi();
  if (!state.runs[key].loaded) {
    toast("Loading " + monthLabel(key) + "…");
    try { await loadRun(key); }
    catch (e) { toast("Could not load " + monthLabel(key) + ". " + ((e && e.message) || e), "bad"); }
  }
  render();
}

/* Who to record against a note: the signed-in person. Nothing reaches a note
   before the gate has resolved them, so the fallback is only ever a safety net. */
function noteAuthor() {
  const id = state.identity;
  return (id && id.name) || state.asAdviser || state.role || "Unknown";
}

/* Returns the trail a client would have after this entry, or null when the
   entry repeats the one before it — a comment box fires on every change, and an
   entry identical to its predecessor is noise rather than history.
   Returned rather than written so the caller folds it into one save. */
function trailWith(masterId, kind, text) {
  const run = currentRun();
  if (!run) return null;
  const cur = run.overrides["master:" + masterId] || {};
  const trail = (cur.trail || []).slice();
  const last = trail[trail.length - 1];
  const now = new Date().toISOString();

  /* A comment records who and when, not what. The comment that is *current* is
     already stored in full beside it, and superseded text is the one part of
     this worth paying for least — every adviser's whole book shares a single
     63,999 character column, and storing each draft trebled the cost of it.
     Removals keep their reason: there are few of them and the reason is the
     entire point. */
  if (kind === "comment") {
    /* Somebody editing their own comment is one event, not six. Re-stamp the
       time rather than appending again. */
    if (last && last.kind === "comment" && last.by === noteAuthor()) {
      trail[trail.length - 1] = { ...last, at: now };
      return trail;
    }
    trail.push({ at: now, by: noteAuthor(), kind });
  } else {
    if (last && last.kind === kind && last.text === String(text || "").slice(0, 140)) return null;
    trail.push({ at: now, by: noteAuthor(), kind, text: String(text || "").slice(0, 140) });
  }
  return trail.slice(-6);
}

const TRAIL_VERB = { comment: "commented", removed: "removed from the review", restored: "put back in the review" };

/* The history under an expanded client. Reads as a list of things people did,
   because that is what somebody opening it wants to know. */
function trailPanel(m, span) {
  if (!m.trail || !m.trail.length) return "";
  const when = iso => {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("en-AU", { day: "numeric", month: "short" }) +
      " " + d.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit" });
  };
  return '<tr class="acct"><td></td><td colspan="' + (span - 1) + '">' +
    '<div class="small muted" style="font-weight:600;margin-bottom:4px">History</div>' +
    [...m.trail].reverse().map(t =>
      '<div class="small muted">' + esc(when(t.at)) + " &middot; <strong>" + esc(t.by) + "</strong> " +
      esc(TRAIL_VERB[t.kind] || t.kind) +
      (t.text ? ": &ldquo;" + esc(t.text) + "&rdquo;" : "") + "</div>").join("") +
    "</td></tr>";
}

function setOverride(scope, id, patch) {
  const run = currentRun();
  if (!run) return;
  const k = scope + ":" + id;
  const cur = run.overrides[k] || {};
  const next = { ...cur, ...patch };
  for (const key of Object.keys(next)) if (next[key] === "" || next[key] == null) delete next[key];
  if (Object.keys(next).length) run.overrides[k] = next; else delete run.overrides[k];
  saveRuns();
  recalc();
}

function adviserState(name) {
  const run = currentRun();
  const s = run && run.adviserStatus[name];
  return s || { status: "Not started" };
}

/* `needs` names the capability a role must have for the item to appear. */
const VIEWS = [

  { id: "review",    label: "Review",     section: "Run",    needs: "run",

];
const visibleViews = () =>

/* Who the review screen is scoped to. Ops and above pick with the filter; an
   adviser is pinned to themselves and cannot widen it. */
function scopedAdviser() {
  if (!can("ownBook")) return state.filterAdviser === "all" ? null : state.filterAdviser;
  return state.asAdviser;
}

/* Advisers who actually have clients in the loaded run — the only ones worth
   offering in the demo picker. */
function advisersInRun() {
  return state.calc ? [...new Set(state.calc.masters.map(m => m.adviser))].filter(Boolean).sort() : [];
}

function renderNav() {
  const c = state.calc;
  const exCount = c ? (c.unpricedCats.reduce((a, x) => a + x[1], 0) + c.unknownAdvisers.length + c.ambiguous.length) : 0;
  const pending = c ? state.advisers.filter(a => adviserState(a.name).status === "Submitted").length : 0;
  let html = "", lastSec = "";
  for (const v of visibleViews()) {
    const adviserMode = can("ownBook");
    const sec = adviserMode ? (v.adviserSection || v.section) : v.section;
    if (sec !== lastSec) { html += '<div class="nav-sec">' + esc(sec) + "</div>"; lastSec = sec; }
    let badge = "";
    if (!adviserMode && v.id === "exceptions" && exCount) badge = '<span class="count alert">' + exCount + "</span>";
    if (!adviserMode && v.id === "approvals" && pending) badge = '<span class="count">' + pending + "</span>";
    const label = adviserMode ? (v.adviserLabel || v.label) : v.label;
    /* title carries the label for the collapsed rail, where the text is hidden. */
    html += '<button class="nav-btn' + (state.view === v.id ? " active" : "") + '" data-view="' + v.id +
      '" title="' + esc(label) + '">' + icon(v.id) + '<span class="nav-label">' + esc(label) + "</span>" + badge + "</button>";
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("[data-view]").forEach(b =>
    b.addEventListener("click", () => { state.view = b.dataset.view; render(); }));
}

/* The top bar is sticky and wraps to two rows on a narrow window, so anything
   pinned beneath it cannot assume a fixed offset. Measured rather than guessed,
   and published as a custom property the CSS reads. */
function measureTopbar() {
  const top = document.querySelector("header.top");
  if (top) document.documentElement.style.setProperty("--topbar-h", Math.round(top.getBoundingClientRect().height) + "px");
}

/* The sidebar gives way when the table needs the width. Below 1180px it drops to
   an icon rail on its own; the toggle lets anyone pin it either way, and that
   choice sticks. */
function applyNavWidth() {
  const collapsed = state.navCollapsed === null
    ? window.innerWidth < 1180
    : state.navCollapsed;
  document.body.classList.toggle("nav-mini", collapsed);
  const btn = $("#navToggle");
  if (btn) {
    btn.innerHTML = collapsed ? "&raquo;" : "&laquo;";
    btn.title = collapsed ? "Expand menu" : "Collapse menu";
    btn.setAttribute("aria-label", btn.title);
  }
}

/* Which screen the DOM currently holds, so a rebuild of the same screen can put
   the table's scroll position back. Declared up here because the sign-in gate
   clears it too. */
let renderedView = null;

/* Sign in, work out who that is, and hand over to the app. Every failure gets
   its own screen saying what to do about it, because "nothing happened" is the
   worst possible answer to a sign-in. */
async function startSession() {
  state.authState = "signing-in";
  renderGate();
  try {
    await getToken(true);                 // may navigate away to Entra and come back
    const id = await resolveIdentity();
    state.identity = id;
    if (!id.role) {
      /* Being turned away has to leave nothing behind. A role from a previous
         session, or from this browser's stored settings, would otherwise still
         be sitting in state — harmless while the gate holds, and a hole the
         moment somebody refactors the gate. */
      state.role = "";
      state.asAdviser = null;
      state.authState = "denied";
      saveUi();
      renderGate();
      return;
    }
    state.role = id.role;
    /* An adviser is only ever themselves, and Title is what Xplan calls them —
       which is the name their clients are filed under. */
    state.asAdviser = id.role === "Adviser" && id.row ? String(id.row.Title || "") : null;

    /* Client records have no business sitting in a browser profile on a shared
       machine once the site is the source of truth. */
    clearLegacyLocalData();

    state.authState = "loading";
    renderGate();
    await loadReference();
    await loadRunIndex();
    if (state.runKey) await loadRun(state.runKey);
    /* Last, and swallowing its own failures: the CSA tracker is a screen, not a
       dependency, and a site without its list yet must still open. */
    await loadCsa();

    state.authState = "ready";
    saveUi();
    /* A reminder email links straight to the tracker, so honour the fragment it
       arrives with rather than dropping the adviser on the dashboard. */
    if (location.hash === "#csa" && visibleViews().some(v => v.id === "csa")) state.view = "csa";
    render();
    if (id.bootstrap) {
      toast("No Admin in the directory yet, so you are one. Add a real Admin row to close this.", "bad");
    }
  } catch (e) {
    state.authState = "error";
    state.authError = explainAuthError(e);
    renderGate();
  }
}

/* The screens before the app: signing in, turned away, or broken. Drawn
   straight into #page with the nav empty, so there is nothing to click past. */
function renderGate() {
  const id = state.identity;
  document.body.classList.add("gate");
  $("#pgTitle").textContent = "CAA Fee Hub";
  $("#pgSub").textContent = "";
  $("#nav").innerHTML = "";
  $("#topActions").innerHTML = "";
  $("#demoBar").hidden = true;
  $("#whoName").textContent = id ? id.name : "Not signed in";
  $("#whoRole").textContent = id ? id.email : "";
  $("#whoAvatar").textContent = id ? initials(id.name) : "?";

  /* The brand mark, then whatever this particular state needs to say. Same
     shell every time so the screen does not jump between states. No footer:
     it used to print the SharePoint site path, which is infrastructure nobody
     signing in needs and everybody looking over a shoulder can read. */
  const card = b => '<div class="gate-card">' +
    '<img class="mark" src="' + logoSrc() + '" alt="Coastal Advisory Australia">' + b + "</div>";
  let html = "";

  if (state.authState === "signing-in") {
    html = card('<div class="gate-spin"></div><h2>Signing you in</h2>' +
      '<div class="lead">Checking who you are against the adviser directory. ' +
      "If a Microsoft sign-in page opens, that is this app asking.</div>");
  } else if (state.authState === "loading") {
    html = card('<div class="gate-spin"></div><h2>Loading</h2>' +
      '<div class="lead">Reading the rate card, the fund table and this month\'s run. ' +
      "Client data is never kept on this machine, so it comes fresh every time.</div>");
  } else if (state.authState === "error") {
    html = card("<h2>Could not sign in</h2>" +
      '<div class="banner bad">' + state.authError + "</div>" +
      '<button class="btn sky" id="btnRetryAuth">Try again</button>');
  } else if (state.authState === "denied" && id) {
    /* Being turned away is the common case on day one, so it says exactly what
       has to go in the list and what to tell whoever owns it. */
    const why = id.inactive
      ? "Your row in the directory is marked <strong>not active</strong>."
      : id.row && !id.row.AccessRole
        ? "You are in the directory, but your row has no <strong>AccessRole</strong> set."
      : id.row
        ? "Your row has an AccessRole of <strong>" + esc(id.row.AccessRole) + "</strong>, which is not one of " +
          ROLES.join(", ") + "."
        : "There is no row for you in the <strong>" + esc(LIST_TITLES.advisers) + "</strong> list.";
    html = card("<h2>You don't have access yet</h2>" +
      '<div class="banner warn">' + why + "</div>" +
      '<div class="kv"><div class="k">Signed in as</div><div class="v">' + esc(id.name) + "</div>" +
      '<div class="k">Email</div><div class="v mono">' + esc(id.email) + "</div>" +
      '<div class="k">Directory rows</div><div class="v">' + id.rows + "</div></div>" +
      '<div class="lead" style="font-size:.78rem;text-align:left">Ask an Admin to add you to <code>' +
      esc(LIST_TITLES.advisers) + "</code> with your email in the <code>Email</code> column and a role in " +
      "<code>AccessRole</code>. An adviser's <code>Title</code> must match their Xplan name exactly, or their " +
      "clients will not find them.</div>" +
      '<button class="btn ghost" id="btnRetryAuth">Check again</button>');
  } else {
    html = card("<h2>Fee Hub</h2>" +
      '<div class="lead">The monthly adviser fee review and the pricing calculator. Pricing, ' +
      "people and runs are all held centrally, so it needs to know who you are.</div>" +
      '<button class="btn sky" id="btnSignIn">Sign in with Microsoft</button>');
  }

  $("#page").innerHTML = html;
  if ($("#btnSignIn")) $("#btnSignIn").addEventListener("click", startSession);
  if ($("#btnRetryAuth")) $("#btnRetryAuth").addEventListener("click", startSession);
  renderedView = null;
}

function render() {
  /* Connected and not yet through the gate: nothing of the app is drawn. */
  if (state.authState !== "ready") { renderGate(); return; }
  document.body.classList.remove("gate");
  recalc();

  /* An adviser is whoever signed in and nobody else. This used to fall back to
     the first adviser with clients, which was harmless while a picker existed to
     stand in as anybody — and would now quietly open somebody else's book to an
     adviser who simply has no clients this month. They see an empty book, which
     is the true answer. */
  const adviserMode = can("ownBook");
  if (!visibleViews().some(v => v.id === state.view)) {
    state.view = (visibleViews()[0] || { id: "review" }).id;
  }

  renderNav();
  applyNavWidth();
  measureTopbar();
  const run = currentRun();
  const titles = {
    run: "Run/Dashboard", review: "Review", exceptions: "Exceptions",
    approvals: "Approvals", pricing: "Pricing Calculator", csa: "CSA Tracker",
    ratecard: "Rate/Fee Settings", people: "People", settings: "Settings"
  };
  $("#pgTitle").textContent = (adviserMode && state.view === "review") ? "My Clients" : (titles[state.view] || "Run/Dashboard");
  /* The pricing calculator stands apart from the monthly run, so the subtitle
     says what the prices are rather than which month is loaded. */
  $("#pgSub").innerHTML = state.view === "pricing"
    ? (pricing().reviewed ? "Pricing last reviewed " + esc(pricing().reviewed) : "Internal pricing") +
      " &middot; all fees include GST"
    /* The tracker runs on its own weekly report, so the subtitle says when that
       was taken rather than which fee month happens to be open. */
    : state.view === "csa"
    ? (state.csa && state.csa.takenAt
        ? "Report loaded " + esc(dayLabel(state.csa.takenAt.slice(0, 10))) +
          " &middot; " + (state.csa.rows || []).length + " outstanding"
        : "No report loaded")
    : run
    ? monthLabel(run.key) + ' &middot; <span class="pill ' + statusPill(run.status) + '">' +
      esc(adviserMode ? adviserState(state.asAdviser).status : run.status) + "</span>" +
      (can("run") ? " &middot; " + run.rows.length.toLocaleString("en-AU") + " rows" : "")
    : "No run loaded";

  const id = state.identity;
  const who = id ? id.name : (adviserMode ? (state.asAdviser || "Adviser") : state.role);
  const dir = adviserMode ? state.advisers.find(a => a.name === state.asAdviser) : null;
  $("#whoName").textContent = who;
  $("#whoRole").textContent = id
    ? state.role + (adviserMode && dir ? " · " + dir.region : "")
    : adviserMode
      ? (dir ? dir.region + " region" : "not in the directory")
      : "";
  $("#whoAvatar").textContent = initials(who);
  renderTopActions();
  paintSaveState();

  const fn = { run: viewRun, review: viewReview, exceptions: viewExceptions,
               approvals: viewApprovals, pricing: viewPricing, csa: viewCsa,
               ratecard: viewRateCard, people: viewPeople, settings: viewSettings }[state.view];
  /* The one state where somebody holds more authority than the directory gave
     them, said out loud on every screen until it is closed. */
  const bootstrapping = state.identity && state.identity.bootstrap;
  $("#demoBar").innerHTML = bootstrapping
    ? '<strong>No Admin in the directory yet.</strong> Until a row in <code>' + esc(LIST_TITLES.advisers) +
      "</code> has <code>AccessRole</code> set to Admin, whoever opens this app is treated as one. " +
      "Add yourself on the People screen to close it."
    : "";
  $("#demoBar").hidden = !bootstrapping;
  /* The client table scrolls inside itself, and every edit rebuilds the page.
     Without this, setting a fee on the twentieth client throws you back to the
     first one — which is most of the work of a review. */
  /* Only worth restoring when the same screen is being rebuilt — arriving on a
     screen should start at the top, not wherever the last one was left. */
  const wrap = renderedView === state.view ? document.querySelector(".tbl-wrap") : null;
  const at = wrap ? { top: wrap.scrollTop, left: wrap.scrollLeft } : null;
  $("#page").innerHTML = fn ? fn() : "";
  if (fn) wire();
  if (at) {
    const back = document.querySelector(".tbl-wrap");
    if (back) { back.scrollTop = at.top; back.scrollLeft = at.left; }
  }
  renderedView = state.view;
}

/* "Surname, First" reads as FS, not SF — surname-first is the Xplan convention. */
function initials(name) {
  const parts = String(name || "").split(/[,\s]+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[1][0] + parts[0][0]).toUpperCase();
}

function statusPill(s) {
  return { "Draft": "mute", "Open for Review": "info", "Locked": "warn", "Sent": "ok",
           "Not started": "mute", "In progress": "info", "Submitted": "warn", "Approved": "ok", "Returned": "bad" }[s] || "mute";
}

function renderTopActions() {
  const run = currentRun();
  const keys = Object.keys(state.runs).sort().reverse();
  let html = "";
  if (keys.length) {
    html += '<select id="runPick" style="width:auto;min-width:170px">' +
      keys.map(k => '<option value="' + k + '"' + (k === state.runKey ? " selected" : "") + ">" + esc(monthLabel(k)) + "</option>").join("") +
      "</select>";
  }
  /* On the CSA tracker the month picker stays — it chooses which run prices the
     CSAs — but opening or locking a fee run from there would be a surprise. */
  if (run && can("approve") && state.view !== "csa") {
    if (run.status === "Draft") html += '<button class="btn sky" id="btnOpen">Open for review</button>';
    if (run.status === "Open for Review") html += '<button class="btn" id="btnLock">Lock run</button>';
    if (run.status === "Locked") html += '<button class="btn ghost" id="btnUnlock">Reopen</button>';
  }
  $("#topActions").innerHTML = html;

  const pick = $("#runPick");
  if (pick) pick.addEventListener("change", e => openRun(e.target.value));
  const setStatus = s => { const r = currentRun(); if (r) { r.status = s; saveRuns(); render(); toast("Run is now " + s + ".", "good"); } };
  if ($("#btnOpen")) $("#btnOpen").addEventListener("click", async () => {
    const r = currentRun();
    if (!r) return;
    const advisers = new Set((state.calc ? state.calc.masters : []).map(m => m.adviser).filter(Boolean));
    if (advisers.size && !confirm(
      "Open " + monthLabel(r.key) + " for review?\n\n" + advisers.size +
      " adviser" + (advisers.size === 1 ? "" : "s") + " will be emailed now, and chased in " +
      REMINDER_DAYS + " days if they have not finished.")) return;
    setStatus("Open for Review");
    reportNotifyResult(await notifyRunOpened(r));
  });
  if ($("#btnLock")) $("#btnLock").addEventListener("click", () => {
    const c = state.calc;
    const outstanding = [...new Set(c.masters.map(m => m.adviser))]
      .filter(a => a && adviserState(a).status !== "Approved");
    if (outstanding.length && !confirm(
      "Lock " + monthLabel(state.runKey) + "?\n\n" + outstanding.length +
      " adviser" + (outstanding.length > 1 ? "s have" : " has") + " not been approved yet:\n" +
      outstanding.slice(0, 8).join("\n") + (outstanding.length > 8 ? "\n…and " + (outstanding.length - 8) + " more" : "") +
      "\n\nLocking makes every client read-only.")) return;
    /* The month's shape, captured at the one moment it is finished. Built
       before the status change so it is written by the same save. */
    const r = currentRun();
    if (r) r.summary = buildRunSummary(r, state.calc);
    setStatus("Locked");
    celebrate();
  });
  if ($("#btnUnlock")) $("#btnUnlock").addEventListener("click", () => {
    if (!confirm("Reopen " + monthLabel(state.runKey) + "?\n\nAdvisers will be able to change their clients again, and approvals already given still stand. Only reopen if something needs correcting.")) return;
    setStatus("Open for Review");
  });
}

/* ---------------- Run / Dashboard ---------------- */
function viewRun() {
  const run = currentRun(), c = state.calc;
  let html = "";

  if (!state.rateCard.categories.length) {
    html += '<div class="banner bad no-print"><strong>No rate card yet.</strong> Nothing can be priced until the categories exist. ' +
      'Add them on the <strong>Rate/Fee Settings</strong> screen, or connect to SharePoint and they load from the list.</div>';
    }

  html += '<div class="card no-print"><div class="card-h"><h2>Load the monthly extract</h2>' +
    '<div class="sub">Xplan &rarr; Fee Calculator Data report, saved as .xlsx or .csv</div></div>' +
    '<div class="card-b"><div class="drop" id="drop"><h3>Drop the report here</h3>' +
    '<p>or click to choose a file &mdash; the 12 Xplan columns are matched by header, not position</p></div>' +
    '<input type="file" id="fileInput" accept=".xlsx,.csv" class="hide">' +
    "</div></div><div class=\"spacer\"></div>";

  if (!run) return html + '<div class="banner warn">No run loaded yet. Drop a report above to get started.</div>';

  const priced = c.masters.filter(m => m.rateCardFee != null);
  const totalCurrent = c.masters.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totalNew = priced.reduce((a, m) => a + (m.fee || 0), 0);
  const totalCurrentPriced = priced.reduce((a, m) => a + (m.currentFee || 0), 0);
  const unpriced = c.masters.length - priced.length;
  const totalFum = [...new Set(c.masters.map(m => m.fumKey))]
    .reduce((a, k) => a + (c.masters.find(m => m.fumKey === k).totalFum || 0), 0);

  html += '<div class="stats">' +
    stat("Master clients", c.masters.length.toLocaleString("en-AU"), c.rows.length.toLocaleString("en-AU") + " subfund rows" +
      (c.hiddenDefaults ? " · " + c.hiddenDefaults.toLocaleString("en-AU") + " placeholders hidden" : "") +
      (c.addedFundCount ? " · " + c.addedFundCount + " added" : "")) +
    stat("Total FUM", money(totalFum), c.droppedRows.toLocaleString("en-AU") + " rows excluded") +
    stat("Current fees", money(totalCurrent), "as reported by Xplan") +
    stat("New fees (priced)", money(totalNew), money(totalNew - totalCurrentPriced) + " movement") +
    stat("Unpriced", unpriced.toLocaleString("en-AU"), "no category rate", unpriced ? "bad" : "") +
    "</div>";

  html += '<div class="grid2">';
  html += '<div class="card"><div class="card-h"><h2>Category coverage</h2></div><div class="card-b">' +
    '<table><thead><tr><th>Master category</th><th class="num">Clients</th><th class="num">Rate</th><th></th></tr></thead><tbody>' +
    categoryCoverageRows(c) + "</tbody></table></div></div>";

  html += '<div class="card"><div class="card-h"><h2>By region</h2></div><div class="card-b">' +
    '<table><thead><tr><th>Region</th><th class="num">Clients</th><th class="num">Current</th><th class="num">New</th><th class="num">Movement</th></tr></thead><tbody>' +
    regionRows(c) + "</tbody></table></div></div>";
  html += "</div>";
  return html;
}

/* Name or Xplan ID, because the ID is what a client is called in every other
   system and it is the only thing that is unique. */
function searchField() {
  return '<div class="field no-print" style="min-width:220px"><label>Find a client</label>' +
    '<input type="search" id="fQ" placeholder="name or Xplan ID" value="' + esc(state.query) + '"></div>';
}

function applyQuery(list) {
  const q = state.query.trim().toLowerCase();
  if (!q) return list;
  return list.filter(m =>
    String(m.name || "").toLowerCase().includes(q) ||
    String(m.masterId || "").toLowerCase().includes(q) ||
    String(m.adviser || "").toLowerCase().includes(q));
}

function stat(k, v, n, cls) {
  return '<div class="stat' + (cls ? " " + cls : "") + '"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="n">' + esc(n || "") + "</div></div>";
}

function categoryCoverageRows(c) {
  return c.categories.map(e =>
    "<tr><td>" + esc(e.category) +
      (e.mappedTo ? ' <span class="pill info">&rarr; ' + esc(e.mappedTo) + "</span>" : "") +
      (c.ambiguous.includes(e) ? ' <span class="pill warn">confirm</span>' : "") +
    '</td><td class="num">' + e.clients + '</td><td class="num">' +
    (e.rate == null ? '<span class="pill bad">not priced</span>' : money(e.rate)) + "</td><td>" +
    (e.rate == null && can("rateCardEdit") ? '<button class="btn ghost btn-sm no-print" data-addcat="' + esc(e.category) + '">Map</button>' : "") +
    "</td></tr>").join("");
}

function regionRows(c) {
  const g = new Map();
  for (const m of c.masters) {
    const k = m.region || "—";
    const e = g.get(k) || { n: 0, cur: 0, nw: 0 };
    e.n++; e.cur += m.currentFee || 0; e.nw += m.fee || 0;
    g.set(k, e);
  }
  return [...g.entries()].sort().map(([k, e]) =>
    "<tr><td>" + esc(k) + '</td><td class="num">' + e.n + '</td><td class="num">' + money(e.cur) +
    '</td><td class="num">' + money(e.nw) + '</td><td class="num">' + money(e.nw - e.cur) + "</td></tr>").join("");
}

function defaultMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

/* ---------------- Review ---------------- */
function viewReview() {
  const run = currentRun(), c = state.calc;
  if (!run) return '<div class="banner warn">Load a run first.</div>';
  if (can("ownBook")) return viewMyClients();

  const advisers = advisersInRun();
  const regions = [...new Set(c.masters.map(m => m.region))].sort();
  const locked = run.status === "Locked" || run.status === "Sent";

  let list = c.masters;
  if (state.filterAdviser !== "all") list = list.filter(m => m.adviser === state.filterAdviser);
  if (state.filterRegion !== "all") list = list.filter(m => m.region === state.filterRegion);
  list = applyQuery(list);

  const totCur = list.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totNew = list.reduce((a, m) => a + (m.fee || 0), 0);

  let html = '<div class="card"><div class="card-h">' +
    '<div class="field" style="min-width:210px"><label>Adviser</label><select id="fAdv"><option value="all">All advisers</option>' +
    advisers.map(a => '<option value="' + esc(a) + '"' + (state.filterAdviser === a ? " selected" : "") + ">" + esc(a) + "</option>").join("") + "</select></div>" +
    '<div class="field" style="min-width:150px"><label>Region</label><select id="fReg"><option value="all">All regions</option>' +
    regions.map(a => '<option value="' + esc(a) + '"' + (state.filterRegion === a ? " selected" : "") + ">" + esc(a) + "</option>").join("") + "</select></div>" +
    searchField() +
    '<div class="right no-print">' +
    (locked ? "" : '<button class="btn ghost" id="btnAddClient">+ Add client</button>') +
    '<button class="btn ghost" id="btnPrint">Report / PDF</button>' +
    '<button class="btn ghost" id="btnCsv">Export CSV</button></div></div>';

  html += '<div class="card-b" style="padding:12px 18px;border-bottom:1px solid var(--line)">' +
    '<div class="toggle-row small muted">' + list.length + " master clients &middot; current " + money(totCur) +
    " &rarr; new " + money(totNew) + " &middot; movement <strong>" + money(totNew - totCur) + "</strong>" +
    (locked ? ' &middot; <span class="pill warn">run locked — read only</span>' : "") + "</div></div>";

  html += clientTable(list, locked);
  /* Removals follow the adviser and region filters, so a manager looking at one
     adviser sees that adviser's removals and no others. Not the search box —
     searching narrows the table, and a removal hiding behind a search term is
     a removal nobody reads. */
  let gone = c.removed;
  if (state.filterAdviser !== "all") gone = gone.filter(m => m.adviser === state.filterAdviser);
  if (state.filterRegion !== "all") gone = gone.filter(m => m.region === state.filterRegion);
  html += removedPanel(gone, locked);
  return html;
}

/* ---------------- My Clients — what an adviser actually sees ----------------
   Their own book only, no adviser or region filter, no admin nav, and read-only
   once they have submitted or the run has been locked. */
function viewMyClients() {
  const run = currentRun(), c = state.calc, me = state.asAdviser;
  if (!me) return '<div class="banner warn">You are signed in but not matched to an adviser record, ' +
    "so there is no book to show. Ask Advice Operations to check your row in the directory.</div>";

  let html = "";

  /* A run still being prepared is not an adviser's business. */
  if (run.status === "Draft") {
    return html + '<div class="card"><div class="card-b" style="text-align:center;padding:44px">' +
      '<h2 style="margin-bottom:8px">' + esc(monthLabel(run.key)) + " isn't ready yet</h2>" +
      '<div class="muted">The fee review for this month is still being prepared. You will be notified when it opens.</div>' +
      "</div></div>";
  }

  const st = adviserState(me);
  const runClosed = run.status === "Locked" || run.status === "Sent";
  const locked = runClosed || st.status === "Submitted" || st.status === "Approved";

  const list = c.masters.filter(m => m.adviser === me);
  const totCur = list.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totNew = list.reduce((a, m) => a + (m.fee || 0), 0);
  const totFum = [...new Set(list.map(m => m.fumKey))]
    .reduce((a, k) => a + (list.find(m => m.fumKey === k).totalFum || 0), 0);
  const noRate = list.filter(m => m.baseFee == null).length;

  if (st.status === "Returned") {
    html += '<div class="banner bad"><strong>Sent back to you.</strong>' +
      (st.note ? " " + esc(st.note) : " Please review and resubmit.") + "</div>";
  } else if (st.status === "Submitted") {
    html += '<div class="banner warn"><strong>Submitted.</strong> Waiting on approval — your clients are read-only until then.</div>';
  } else if (st.status === "Approved") {
    html += '<div class="banner info"><strong>Approved.</strong> Nothing further needed from you this month.</div>';
  } else if (runClosed) {
    html += '<div class="banner warn"><strong>This run is closed.</strong> Your clients are shown read-only.</div>';
  }

  html += '<div class="stats">' +
    stat("My clients", list.length, c.rows.filter(r => r.adviser === me).length + " accounts") +
    stat("Total FUM", money(totFum), "included accounts only") +
    stat("Current fees", money(totCur), "what they pay today") +
    stat("New fees", money(totNew), money(totNew - totCur) + " movement") +
    /* Priced centrally before a month opens, so an adviser seeing this means it
       was missed rather than that it is in hand. */
    (noRate ? stat("Awaiting a rate", noRate, "notify admin", "warn") : "") +
    "</div>";

  if (!locked) {
    html += '<div class="card no-print" style="margin-bottom:16px"><div class="card-h"><h2>What to check</h2></div><div class="card-b">' +
      '<ol style="margin:0;padding-left:20px;color:var(--ink-2)">' +
      "<li>Expand a client and confirm each account should be counted. Set <strong>Include</strong> or <strong>Exclude</strong> to change it.</li>" +
      "<li>Check the total FUM looks right. If a subfund value is wrong, exclude it and note why in the comment.</li>" +
      "<li>Leave both fee boxes alone to accept the rate card fee. Type over <strong>Adviser fee</strong> to set your own, or type a " +
      "figure into <strong>% of FUM</strong> to charge a percentage instead. Clearing the box hands the client back to the rate card.</li>" +
      "<li>To price fund by fund, set a <strong>Fee Type</strong> on any individual fund. The client's fee then becomes the sum of the " +
      "funds &mdash; a fund percentage is charged on that fund's own balance &mdash; and any fund left unset charges nothing.</li>" +
      "<li>Payment sources sit on the funds. Expand the client and use <strong>Set payment on all funds</strong> if it all comes from " +
      "one place, then change the odd one out. The fund amounts have to add up to the fee.</li>" +
      "<li>Missing an account? <strong>+ Add fund</strong> at the bottom of the client adds one with its own name and balance.</li>" +
      "<li><strong>Report / PDF</strong> gives you a tidy copy of your book to keep &mdash; choose <em>Save as PDF</em> in the " +
      "print dialog. Worth doing once you have submitted.</li>" +
      "<li>Add a comment on anything you have changed, then submit.</li>" +
      "</ol></div></div>";
  }

  html += '<div class="card"><div class="card-h"><h2>' + esc(me) + "</h2>" +
    '<div class="sub">' + esc(monthLabel(run.key)) + " &middot; " + list.length + " clients &middot; current " + money(totCur) +
    " &rarr; new " + money(totNew) + "</div>" +
    searchField() +
    '<div class="right no-print">' +
    (locked ? "" : '<button class="btn ghost" id="btnAddClient">+ Add client</button>') +
    '<button class="btn ghost" id="btnPrint">Report / PDF</button>' +
    '<button class="btn ghost" id="btnCsv">Export CSV</button>' +
    (locked ? "" : '<button class="btn sky" id="btnSubmit">Submit for approval</button>') +
    "</div></div>";

  /* The totals above are the whole book on purpose — searching narrows what is
     on screen, not what the adviser is signing off. */
  const shown = applyQuery(list);
  if (state.query.trim() && shown.length !== list.length) {
    html += '<div class="card-b small muted" style="padding:10px 18px;border-bottom:1px solid var(--line)">' +
      shown.length + " of " + list.length + ' clients match &ldquo;' + esc(state.query.trim()) + "&rdquo;</div>";
  }
  html += clientTable(shown, locked);
  html += removedPanel(c.removed.filter(m => m.adviser === me), locked);
  return html;
}

/* Clients taken out of the review. Shown rather than hidden, because a removal
   is a decision the adviser has to be able to see, undo and be asked about —
   and because the manager reads these before approving. */
function removedPanel(list, locked) {
  if (!list.length) return "";
  return '<div class="spacer"></div><div class="card"><div class="card-h"><h2>Removed from this review</h2>' +
    '<div class="sub">' + list.length + " client" + (list.length === 1 ? "" : "s") +
    " &middot; not in any total, and listed for your regional manager with the reason</div></div>" +
    '<div class="card-b"><div class="tbl-scroll"><table><thead><tr><th>Master client</th>' +
    '<th class="num">Current fee</th><th>Why it was removed</th>' +
    (locked ? "" : '<th class="no-print"></th>') + "</tr></thead><tbody>" +
    list.map(m => "<tr><td>" + esc(m.name) +
      '<div class="small muted mono">' + esc(m.masterId) + "</div></td>" +
      '<td class="num">' + money(m.currentFee) + "</td>" +
      "<td>" + (m.removeNote ? esc(m.removeNote) : '<span class="muted">no reason given</span>') +
        (m.removedBy ? '<div class="small muted">&mdash; ' + esc(m.removedBy) +
          (m.removedAt ? ", " + esc(new Date(m.removedAt).toLocaleDateString("en-AU", { day: "numeric", month: "short" })) : "") +
          "</div>" : "") + "</td>" +
      (locked ? "" : '<td class="no-print"><button class="btn ghost btn-sm" data-restoreclient="' +
        esc(m.masterId) + '">Put back</button></td>') +
      "</tr>").join("") +
    "</tbody></table></div></div></div>";
}

/* The shared table. Ops and advisers see the same numbers — the difference is
   scope and whether the inputs are live. */
function clientTable(list, locked) {
  /* An adviser is looking at one book, so the adviser column is their own name
     repeated down the page. Drop it and give the width back to the numbers. */
  const showAdviser = !can("ownBook");
  const span = showAdviser ? 13 : 12;
  let html = '<div class="tbl-wrap"><table><thead><tr>' +
    "<th></th><th>Master client</th>" + (showAdviser ? "<th>Adviser</th>" : "") + "<th>Category</th>" +
    '<th class="num">Total FUM</th><th class="num">Current fee</th><th class="num">Rate card</th>' +
    "<th>Fee Type</th><th>Adviser fee</th><th>% of FUM</th>" +
    '<th class="num">Movement</th><th>Payment</th><th>Comment</th></tr></thead><tbody>';

  for (const m of list) {
    const open = !!state.expanded[m.masterId];
    const added = addedFunds(currentRun(), m.masterId);
    /* Direction matters more than the fact of being off band: under the rate
       card is money left behind, over it is money gained. Colour says which. */
    const under = m.outsideBand && m.diffToCard != null && m.diffToCard < 0;
    const bandFlag = (m.outsideBand
        ? ' <span class="pill ' + (under ? "bad" : "ok") + '" title="' + (under ? "Below" : "Above") + " the rate card by more than " +
          (state.rateCard.variancePct * 100) + '%">' + (under ? "&darr; " : "&uarr; ") + money(Math.abs(m.diffToCard)) + " off band</span>"
        : "") +
      (m.belowCurrent ? ' <span class="pill bad" title="Lower than the fee the client pays today">below current</span>' : "") +
      (m.overCap ? ' <span class="pill bad" title="' +
          esc(m.overCapFunds.map(r => (r.fund ? r.fund.name : "fund") + " allows " + money(r.capValue) +
            ", drawing " + money(r.feeShare)).join(" · ")) + '">over platform cap' +
          (m.maxFee != null ? " &mdash; max " + money(Math.floor(m.maxFee))
            : " on " + m.overCapFunds.length + " fund" + (m.overCapFunds.length > 1 ? "s" : "")) + "</span>" : "") +
      (m.underMinBalance.length ? ' <span class="pill bad" title="' +
          esc(m.underMinBalance.map(r => (r.fund ? r.fund.name : "fund") + " needs " + money(r.fund.minBalance) +
            ", balance is " + money(r.valueUsed)).join(" · ")) + '">under platform minimum</span>' : "") +
      (m.splitFunds.length ? ' <span class="pill warn" title="' +
          esc(m.splitFunds.map(r => (r.fund ? r.fund.name : "fund") + ": " + money(r.shortfall) +
            " cannot come off the platform (" + r.limitedBy + ")").join(" · ")) + '">' +
          (m.houseSplitApplies ? "FUM under the minimum &mdash; " : "needs direct debit &mdash; ") +
          money(m.splitFunds.reduce((a, r) => a + r.shortfall, 0)) + " by direct debit</span>" : "") +
      (m.mode === "Variable" && m.unsetFunds ? ' <span class="pill warn">' + m.unsetFunds + " fund" + (m.unsetFunds > 1 ? "s" : "") + " unset</span>" : "") +
      (m.aboveTier ? ' <span class="pill warn" title="' +
          esc("The rate card fee is " + money(m.aboveTierBy) + " above the top of " + (m.mappedTo || m.category) +
            " (" + money(m.tierCeiling) + ")" +
            (m.tierByFee ? ". On this fee they sit in " + m.tierByFee + "." : "") +
            " Check the category in Xplan.") + '">above tier' +
          (m.tierByFee ? " &mdash; " + esc(m.tierByFee) : "") + "</span>" : "");
    html += "<tr>" +
      '<td><button class="expand" data-exp="' + esc(m.masterId) + '">' + (open ? "&minus;" : "+") + "</button></td>" +
      /* Three lines, in the order somebody scans them: who, which record, how
         big. The ID gets a line of its own because it is what gets copied into
         Xplan, and hunting for it inside a run-on line is the whole problem. */
      "<td><strong>" + esc(m.name) + "</strong>" +
        (m.addedByHand ? ' <span class="pill info" title="Not in the Xplan extract' +
          (m.addedBy ? " — added by " + esc(m.addedBy) : "") + '">added</span>' : "") +
        '<div class="small muted mono">Xplan ' + esc(m.masterId) + "</div>" +
        '<div class="small muted">' + m.rows.length + " accounts" + (added.length ? " (" + added.length + " added)" : "") +
        (m.entityWeightTotal ? " &middot; +" + m.entityWeightTotal + " entity wt" : "") + "</div></td>" +
      (showAdviser ? "<td>" + esc(m.adviser) + '<div class="small muted">' + esc(m.region) + "</div></td>" : "") +
      "<td>" + esc(m.category || "—") +
        (m.mappedTo ? '<div class="small muted">prices as ' + esc(m.mappedTo) + "</div>" : "") +
        (m.baseFee == null ? ' <span class="pill bad" title="This category has no price on the rate card. ' +
          'It should have been set before the month opened — notify admin rather than pricing round it.">no rate</span>' : "") + "</td>" +
      '<td class="num">' + money(m.totalFum) + "</td>" +
      '<td class="num">' + money(m.currentFee) + "</td>" +
      '<td class="num">' + money(m.rateCardFee) +
        '<div class="small muted">' + (m.baseFee == null ? "&mdash;" : money(m.baseFee) + " + " + money(m.entityFee) + " + " + money(m.surcharge)) + "</div></td>" +
      "<td>" + modeCell(m) + "</td>" +
      '<td>' + feeCell(m, locked) + bandFlag + "</td>" +
      "<td>" + pctCell(m, locked) + "</td>" +
      '<td class="num">' + money(m.variance) + "</td>" +
      "<td>" + paymentCell(m) + "</td>" +
      '<td><textarea rows="1" class="grow w140" data-mo="' + esc(m.masterId) + '" data-f="comment"' + (locked ? " disabled" : "") + ">" +
        esc(m.comment) + "</textarea>" +
        /* Who wrote what is on screen now. The rest of the history is under the
           client, where there is room for it. */
        (m.commentBy ? '<div class="small muted">&mdash; ' + esc(m.commentBy) + "</div>" : "") + "</td>" +
      "</tr>";

    if (open) {
      for (const r of m.rows) {
        const variable = m.mode === "Variable";
        const varPay = m.paymentSource === "Variable";
        html += '<tr class="acct"><td></td>' +
          /* Two lines: the account, then who holds it and where. No Xplan ID —
             it identifies the client, and the client is one row up. */
          '<td colspan="' + (showAdviser ? 2 : 1) + '">' + fundNameCell(r, locked) +
            '<div class="small muted">' + (r.manual ? "" : esc(r.memberName) + " &middot; ") +
            esc(r.vendorUsed) + (!r.manual && r.vendor === "N/A" && r.vendorUsed !== "N/A" ? " (matched from name)" : "") +
            (r.included ? "" : " &middot; not counted in FUM") + "</div></td>" +
          "<td>" + includeSelect(r, locked) + "</td>" +
          '<td class="num">' + fundValueCell(r, locked) + "</td>" +
          '<td class="num small muted">' + pct(r.weight) + " of FUM</td>" +
          '<td class="num small muted">' + (variable ? "&mdash;" : money(r.feeShare) + " share") + "</td>" +
          /* Setting a fee type here is what makes the client variable. */
          "<td>" + (r.included ? fundSelect(r, "mode", ["", "Fixed Fee", "Percentage"], locked) : "") + "</td>" +
          "<td>" + (r.included ? fundFeeCell(r, m, locked) + fundCapNote(r, m, locked) : "") + "</td>" +
          "<td>" + (r.included ? fundPctCell(r, locked) : "") + "</td>" +
          '<td class="num small muted">' + (variable ? "" : money(r.varianceShare)) + "</td>" +
          "<td>" + (r.included ? fundSelect(r, "paymentSource", PAY_SOURCES, locked) + splitPrompt(r) : "") + "</td>" +
          "<td>" + (r.included && varPay ? fundPayCell(r, locked) : "") + "</td>" +
          "</tr>";
      }
      /* The two things that act on every fund at once live under the funds, not
         on the client line — the client line is a summary now. */
      if (!locked) {
        html += '<tr class="acct no-print"><td></td><td colspan="' + (span - 1) + '">' +
          '<button class="btn ghost btn-sm" data-addfund="' + esc(m.masterId) + '">+ Add fund</button> ' +
          '<button class="btn ghost btn-sm" data-payall="' + esc(m.masterId) + '">Set payment on all funds&hellip;</button> ' +
          '<button class="btn ghost btn-sm" data-removeclient="' + esc(m.masterId) + '">Remove client&hellip;</button>' +
          (m.fundsPriced ? ' <span class="small muted">priced by fund &mdash; the client fee is the sum of ' +
            m.fundsPriced + " of " + m.rows.filter(r => r.included).length + " funds</span>" : "") +
          "</td></tr>";
      }
      html += trailPanel(m, span);
    }
  }
  html += "</tbody></table></div></div>";
  return html;
}

/* Include / Exclude on an account. The only client-line select left; pricing
   and payment both moved onto the funds. */
function includeSelect(r, locked) {
  return '<select class="w110" data-ro="' + esc(r.key) + '" data-f="include"' + (locked ? " disabled" : "") + ">" +
    ["", "Include", "Exclude"].map(o =>
      '<option value="' + esc(o) + '"' + (r.override === o ? " selected" : "") + ">" + esc(o || "Auto") + "</option>").join("") +
    "</select>";
}

/* One name for each way a client can be priced, used on the client line, in
   Exceptions and in the export so the three never drift apart. */
function feeTypeLabel(m) {
  return m.mode === "Variable" ? "By fund"
       : m.mode === "Percentage" ? "% of FUM"
       : m.mode === "Fixed Fee" ? "Fixed fee" : "Rate card";
}

/* The client line reports how the client is being priced; it no longer decides
   it. Every control that sets pricing is either the two typeable cells beside
   this one or a dropdown on a fund. */
function modeCell(m) {
  const label = feeTypeLabel(m);
  const note = m.mode === "Variable" ? m.fundsPriced + " fund" + (m.fundsPriced > 1 ? "s" : "") + " priced"
             : m.mode === "" ? "unchanged" : "adviser set";
  return "<strong>" + label + '</strong><div class="small muted">' + note + "</div>";
}

/* Sources are picked on the funds, so this is a reconciliation, not a control:
   how much of the fee has been accounted for and whether it adds up. */
function paymentCell(m) {
  if (m.paymentSource !== "Variable") {
    return '<span class="small muted">not set</span><div class="small muted">expand to set per fund</div>';
  }
  const total = m.rows.filter(r => r.included).length;
  return '<span class="small">' + m.fundsSourced + " of " + total + " funds</span>" +
    '<div class="small ' + (m.paymentShort ? "pill bad" : "muted") + '">' +
    (m.paymentShort ? "short " + money(m.paymentGap) : money(m.collected) + " allocated") + "</div>" +
    (m.directDebitTotal > 0 ? '<div class="small muted">' + money(m.directDebitTotal) + " by direct debit</div>" : "");
}

/* A hand-added fund is the adviser's own text, so it stays editable — and it is
   the one kind of row that can be taken away again. */
/* Xplan puts the member's surname on the end of most subfund names, and the
   member is named on the line below it, so drop the repeat. Deliberately narrow:
   an exact trailing match on that member's own surname, and only when something
   is left afterwards — a fund genuinely called that keeps its name. */
function fundLabel(r) {
  const raw = String(r.subfundName || "").trim();
  const surname = String(r.memberName || "").split(",")[0].trim();
  if (!surname) return raw || "(unnamed account)";
  const tail = new RegExp("\\s*[-\u2013\u2014]\\s*" + surname.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$", "i");
  const cut = raw.replace(tail, "").trim();
  return cut || raw || "(unnamed account)";
}

function fundNameCell(r, locked) {
  if (!r.manual) return esc(fundLabel(r));
  return '<input type="text" class="grow-x" data-addf="' + esc(r.uid) + '" data-f="name" value="' +
    esc(r.subfundName) + '"' + (locked ? " disabled" : "") + ">" +
    (locked ? "" : ' <button class="btn ghost icon-x" data-delfund="' + esc(r.uid) +
      '" title="Remove this fund" aria-label="Remove this fund">&times;</button>') +
    ' <span class="pill info">added</span>';
}

/* What this platform allows on this account, and whether we are inside it. The
   number matters more than the fact of the breach — an adviser who sees "over
   cap" without being told the ceiling has to go and look it up. */
function fundCapNote(r, m, locked) {
  let out = "";
  if (r.underMinBalance) {
    out += '<div><span class="pill bad" title="' + esc(r.fund.name + " will not process a fee on a balance under " +
      money(r.fund.minBalance) + "; this account holds " + money(r.valueUsed)) +
      '">under ' + money(r.fund.minBalance) + " minimum</span></div>";
  }
  if (r.capValue == null) return out;
  const basis = r.capBinding === "percentage"
    ? r.fund.capPct.toFixed(2) + "% of balance"
    : "flat" + (r.fund.capPct > 0 ? ", under the " + r.fund.capPct.toFixed(2) + "%" : "");
  if (r.overCap) {
    /* The fix only lives here when the fund carries its own fee. On a client
       priced as a whole, one fund's cap is a limit on the client fee, so the
       action belongs on the client line. */
    out += '<div><span class="pill bad">over by ' + money(r.overCapBy) + " &mdash; max " + money(r.capValue) + "</span>" +
      (locked || m.mode !== "Variable" ? "" :
        ' <button class="btn ghost btn-sm" data-tocap="' + esc(r.key) + '">Bring to cap</button>') + "</div>";
  } else {
    out += '<div class="small muted">max ' + money(r.capValue) + " &middot; " + basis + "</div>";
  }
  return out;
}

function fundValueCell(r, locked) {
  if (!r.manual) return money(r.valueUsed) + (r.valueEdited ? ' <span class="pill info">edited</span>' : "");
  return '<input type="number" step="1" class="w110 num" data-addf="' + esc(r.uid) + '" data-f="value" value="' +
    (r.value == null ? "" : Math.round(r.value)) + '"' + (locked ? " disabled" : "") + ">";
}

/* Fund-level controls. Separate from selectCell because a row's include
   override lives on a different field to its fee type and payment settings. */
function fundSelect(r, field, options, locked) {
  const cur = r[field === "mode" ? "feeMode" : field] || "";
  return '<select class="w110" data-ro="' + esc(r.key) + '" data-f="' + field + '"' + (locked ? " disabled" : "") + ">" +
    options.map(o => '<option value="' + esc(o) + '"' + (cur === o ? " selected" : "") + ">" + esc(o || "Auto") + "</option>").join("") + "</select>";
}

function fundFeeCell(r, m, locked) {
  if (m.mode !== "Variable") return '<span class="small muted">&mdash;</span>';
  if (r.feeMode === "Percentage") return '<span class="mono small">' + money(r.fundFee) + "</span>";
  if (r.feeMode === "Fixed Fee") {
    return '<input type="number" step="1" class="w110 num" data-ro="' + esc(r.key) + '" data-f="fee" value="' +
      (r.fundFee == null ? "" : Math.round(r.fundFee)) + '"' + (locked ? " disabled" : "") + ">";
  }
  return '<span class="pill warn" title="This fund charges nothing until a fee type is chosen">not set</span>';
}

function fundPctCell(r, locked) {
  if (r.feeMode !== "Percentage") {
    return r.fundFee != null && r.valueUsed > 0
      ? '<span class="mono small muted">' + pct(r.fundFee / r.valueUsed) + "</span>" : "";
  }
  return '<input type="number" step="0.001" class="w80 num" data-ro="' + esc(r.key) + '" data-f="pct" value="' +
    (r.fundPct == null ? "" : (r.fundPct * 100).toFixed(3)) + '"' + (locked ? " disabled" : "") +
    '><div class="small muted">% of fund</div>';
}

/* Said next to the dropdown rather than in the amount column, because it is the
   reason to change the dropdown. */
function splitPrompt(r) {
  if (!r.needsSplit || r.paymentSource === PAY_SPLIT) return "";
  return '<div><span class="pill bad" title="' + esc(splitReason(r)) + '">' +
    money(r.shortfall) + " can&rsquo;t come off the platform</span>" +
    '<div class="small muted">' + esc(r.limitedBy) + "</div></div>";
}

/* Why the platform cannot carry it, in a sentence. The distinction matters: a
   platform cap is theirs and cannot be argued with, the house rule is ours. */
function splitReason(r) {
  const rc = state.rateCard;
  if (r.limitedBy === "minimum balance") {
    return r.fund.name + " will not draw a fee at all on a balance under " + money(r.fund.minBalance) + ".";
  }
  if (r.limitedBy === "house rule") {
    return "Our rule: this client's FUM is too small for the " + money(rc.absoluteMinimum) +
      " minimum fee to be reachable at " + rc.maxDrawPct + "%, so we draw " + rc.maxDrawPct +
      "% of the balance (" + money(r.houseMax) + ") and direct debit the rest.";
  }
  return r.fund.name + " will only allow " + money(r.platformMax) + " from this account.";
}

/* The dollar actually drawn from this fund. Defaults to its share of the fee so
   that simply naming a source already reconciles. A split shows both halves:
   the platform side is editable, the direct debit side is whatever is left. */
function fundPayCell(r, locked) {
  if (!r.paymentSource) return '<span class="small muted">pick a source</span>';

  if (r.paymentSource === PAY_SPLIT) {
    return (r.paymentAuto
      ? '<div><span class="pill info" title="' + esc(splitReason(r)) +
        '">split set automatically</span></div>' : "") +
      '<div class="small muted">Platform</div>' +
      '<input type="number" step="1" class="w110 num" data-ro="' + esc(r.key) + '" data-f="payPlatform" value="' +
        (r.payPlatform == null ? "" : Math.round(r.payPlatform)) + '"' + (locked ? " disabled" : "") + ">" +
      (r.splitOverPlatform
        ? '<div class="pill bad small">more than ' + money(r.platformMax) + " allowed</div>"
        : (r.payPlatformEdited ? '<div class="small muted">adjusted</div>' : "")) +
      '<div class="small muted" style="margin-top:4px">Direct debit</div>' +
      '<div class="mono">' + money(r.payDirect) + "</div>" +
      '<div class="small muted">the balance of the fee</div>';
  }

  return '<input type="number" step="1" class="w110 num" data-ro="' + esc(r.key) + '" data-f="paymentAmount" value="' +
    (r.paymentAmount == null ? "" : Math.round(r.paymentAmount)) + '"' + (locked ? " disabled" : "") + ">" +
    (r.paymentShort ? '<div class="pill bad small">under by ' + money(Math.round(r.feeShare) - r.paymentAmount) + "</div>"
      : (r.paymentEdited ? '<div class="small muted">adjusted</div>' : ""));
}

function feeCell(m, locked) {
  /* On a Variable client the fee is not typed anywhere — it is whatever the
     funds add up to, so show the total and send the adviser to the funds. */
  if (m.mode === "Variable") {
    return '<span class="mono">' + money(m.fee) + '</span><div class="small muted">sum of ' +
      m.fundsPriced + " priced fund" + (m.fundsPriced > 1 ? "s" : "") + "</div>" +
      (m.feeShadowed ? '<div class="small muted">typed fee not in use</div>' : "");
  }
  /* Typing here is what sets a fixed fee — there is no mode to choose first.
     Clearing the box hands the client back to the rate card. A percentage takes
     precedence, so the box shows what it produces and stops accepting input. */
  const disabled = locked || m.mode === "Percentage";
  return '<input type="number" step="1" class="w110 num" data-mo="' + esc(m.masterId) + '" data-f="fee" value="' +
    (m.fee == null ? "" : Math.round(m.fee)) + '"' + (disabled ? " disabled" : "") + ">" +
    (m.mode === "Percentage" ? '<div class="small muted">from the %</div>'
      : m.feeEdited ? '<div class="small muted">adjusted</div>'
      /* Categories are priced before a month opens, so an adviser meeting this
         means it was missed. Pricing round it closes the client and hides the
         gap, so it asks them to report it instead — but the box stays editable,
         because blocked is worse than discouraged and the flag reaches the
         manager at approval either way. */
      : m.baseFee == null ? '<div class="small muted">no rate &mdash; notify admin</div>' : "") +
    /* One fund over its cap caps the whole client fee, because the fee is split
       across the funds by weight. So the fix is here, not on the fund. */
    (m.overCap && m.maxFee != null && !locked
      ? '<div><button class="btn ghost btn-sm" data-tocapm="' + esc(m.masterId) + '">Bring to ' +
        money(Math.floor(m.maxFee)) + "</button></div>" : "");
}

/* The other half of the pair: type a percentage and the client prices off total
   FUM. Read-only only when the funds are doing the pricing. */
function pctCell(m, locked) {
  if (m.mode === "Variable") return '<span class="mono small">' + pct(m.pctOfFum) + "</span>";
  return '<input type="number" step="0.001" class="w80 num" data-mo="' + esc(m.masterId) + '" data-f="pctInput" value="' +
    (m.pctInput == null ? "" : (m.pctInput * 100).toFixed(3)) + '"' + (locked ? " disabled" : "") +
    ' placeholder="' + (m.pctOfFum == null ? "" : (m.pctOfFum * 100).toFixed(3)) + '"><div class="small muted">' +
    (m.mode === "Percentage" ? "% of FUM" : "or type a %") + "</div>";
}

/* ---------------- Exceptions ---------------- */
/* One folding block on Exceptions. A section holding a genuine error opens
   itself; a warning, or a section with nothing in it, stays shut with its count
   on the header. */
function exceptionSection(s) {
  const clear = !s.count;
  return foldShell({
    id: "exs-" + s.key, attr: "data-exfold", key: s.key, title: s.title, sub: s.sub,
    open: state.exOpen[s.key] === undefined ? (s.tone === "bad" && !clear) : !!state.exOpen[s.key],
    badge: clear ? '<span class="pill ok">clear</span>'
                 : '<span class="pill ' + (s.tone === "bad" ? "bad" : "warn") + '">' +
                   s.count.toLocaleString("en-AU") + "</span>",
    actions: s.actions, body: s.body
  });
}

/* The index across the top. Built from the same list as the sections, so a tile
   and the thing it jumps to cannot drift apart. */
function exceptionTiles(sections, extras) {
  return '<div class="tiles no-print">' +
    sections.map(s => {
      const tone = !s.count ? "" : s.tone === "bad" ? " bad" : " warn";
      return '<button class="tile' + tone + '" data-exjump="' + s.key + '">' +
        '<span class="t">' + esc(s.tile || s.title) + "</span>" +
        '<span class="n">' + (s.count ? s.count.toLocaleString("en-AU") + " · " + esc(s.note || "") : "clear") +
        "</span></button>";
    }).join("") +
    /* Two figures with nothing to open — context, not exceptions. */
    extras.map(x => '<div class="tile static"><span class="t">' + esc(x.t) + "</span>" +
      '<span class="n">' + esc(x.v + " · " + x.n) + "</span></div>").join("") +
    "</div>";
}

function viewExceptions() {
  const c = state.calc;
  if (!c) return '<div class="banner warn">Load a run first.</div>';

  const rc = state.rateCard;
  const totalUnpriced = c.unpricedCats.reduce((a, x) => a + x[1], 0);
  const off = c.masters.filter(m => m.outsideBand);
  const below = c.masters.filter(m => m.belowCurrent);
  const aboveTier = c.masters.filter(m => m.aboveTier);
  const unsetTotal = c.unsetFundClients.reduce((a, m) => a + m.unsetFunds, 0);

  const capRows = [];
  for (const m of c.overCap) for (const r of m.overCapFunds) capRows.push({ m, r });
  const minRows = [];
  for (const m of c.underMinBalance) for (const r of m.underMinBalance) minRows.push({ m, r });
  const splitRows = [];
  for (const m of c.needSplit) for (const r of m.splitFunds) splitRows.push({ m, r });

  const none = msg => '<div class="muted">' + msg + "</div>";

  const sections = [
    { key: "unpriced", tone: "bad", count: totalUnpriced, note: "clients",
      tile: "Unpriced clients", title: "Categories with no rate",
      sub: "These clients are calculated but not priced. Map each one to a tier and they flow straight through.",
      body: () => totalUnpriced
        ? '<table><thead><tr><th>Master category</th><th class="num">Master clients</th><th class="num">Old table</th>' +
          '<th class="num">Current fees</th><th></th></tr></thead><tbody>' +
          c.unpricedCats.map(([cat, n]) => {
            const cur = c.masters.filter(m => (m.category || "(blank)") === cat).reduce((a, m) => a + (m.currentFee || 0), 0);
            const legacy = rc.legacyRates[cat];
            return "<tr><td><strong>" + esc(cat) + '</strong></td><td class="num">' + n + '</td><td class="num">' +
              (legacy == null ? '<span class="muted">&mdash;</span>' : money(legacy)) + '</td><td class="num">' + money(cur) +
              "</td><td>" + (can("rateCardEdit") ? '<button class="btn ghost btn-sm" data-addcat="' + esc(cat) + '">Map to a tier</button>' : "") +
              "</td></tr>";
          }).join("") + "</tbody></table>"
        : none("Every category in this run has a rate. Nothing to do.") },

    /* Red, and so open by default: it is the only change on this screen that
       leaves no trace in the totals, so a folded one is one nobody sees. */
    { key: "removed", tone: "bad", count: c.removed.length, note: "clients",
      tile: "Removed from the review", title: "Clients removed from this review",
      sub: "Taken out by their adviser, with the reason they gave. Out of every total on every other screen.",
      body: () => c.removed.length
        ? '<table><thead><tr><th>Master client</th><th>Adviser</th><th class="num">Current fee</th>' +
          '<th class="num">FUM</th><th>Why</th></tr></thead><tbody>' +
          c.removed.map(m => "<tr><td>" + esc(m.name) + '<div class="small muted mono">' + esc(m.masterId) + "</div></td>" +
            "<td>" + esc(m.adviser) + '</td><td class="num">' + money(m.currentFee) +
            '</td><td class="num">' + money(m.totalFum) + "</td>" +
            "<td>" + (m.removeNote ? esc(m.removeNote) : '<span class="muted">no reason given</span>') +
            (m.removedBy ? '<div class="small muted">&mdash; ' + esc(m.removedBy) +
              (m.removedAt ? ", " + esc(new Date(m.removedAt).toLocaleDateString("en-AU", { day: "numeric", month: "short" })) : "") +
              "</div>" : "") +
            "</td></tr>").join("") + "</tbody></table>" +
          '<div class="spacer"></div><div class="small muted">Removing a client takes their current fee out of the ' +
          "month's totals as well as their new one, so a month with removals will not reconcile against the raw extract. " +
          "That is the intent &mdash; but it is why the reason matters.</div>"
        : none("No client has been taken out of this review.") },

    { key: "abovetier", tone: "warn", count: aboveTier.length, note: "clients",
      tile: "Above their tier", title: "Rate card fee above the client's own tier",
      sub: "Entities and FUM have carried these clients past the top of the tier they are in. The fee is not wrong — the category probably is.",
      body: () => aboveTier.length
        ? '<table><thead><tr><th>Master client</th><th>Adviser</th><th>Tier</th>' +
          '<th class="num">Top of tier</th><th class="num">Rate card</th><th class="num">Over by</th>' +
          '<th>Lands in</th></tr></thead><tbody>' +
          aboveTier.map(m => "<tr><td>" + esc(m.name) + '<div class="small muted mono">' + esc(m.masterId) + "</div></td>" +
            "<td>" + esc(m.adviser) + "</td>" +
            "<td>" + esc(m.mappedTo || m.category || "—") +
              (m.mappedTo ? '<div class="small muted">mapped from ' + esc(m.category) + "</div>" : "") + "</td>" +
            '<td class="num">' + money(m.tierCeiling) + '</td><td class="num">' + money(m.rateCardFee) +
            '</td><td class="num">' + money(m.aboveTierBy) + "</td>" +
            "<td>" + (m.tierByFee ? "<strong>" + esc(m.tierByFee) + "</strong>" : '<span class="muted">—</span>') +
            "</td></tr>").join("") + "</tbody></table>" +
          '<div class="spacer"></div><div class="small muted">Nothing here is blocked and no fee is changed. ' +
          "A client outgrowing their tier is normal &mdash; the fix is the category in Xplan, not the fee. Legacy and " +
          "inherited categories will drift into the right tier over time, so treat this as a list to work through " +
          "rather than a fault.</div>"
        : none("No client's rate card fee sits above the tier they are in.") },

    { key: "ambiguous", tone: "warn", count: c.ambiguous.length, note: "codes",
      tile: "Codes to confirm", title: "Category codes worth confirming",
      sub: "Priced by name match, but the same code meant a different tier on the old table",
      body: () => c.ambiguous.length
        ? '<table><thead><tr><th>Xplan category</th><th class="num">Clients</th><th class="num">Old table</th>' +
          '<th class="num">Pricing at</th><th></th></tr></thead><tbody>' +
          c.ambiguous.map(e => "<tr><td><strong>" + esc(e.category) + '</strong></td><td class="num">' + e.clients +
            '</td><td class="num">' + money(rc.legacyRates[e.category]) + '</td><td class="num">' + money(e.rate) +
            "</td><td>" + (can("rateCardEdit") ? '<button class="btn ghost btn-sm" data-addcat="' + esc(e.category) + '">Review mapping</button>' : "") +
            "</td></tr>").join("") + "</tbody></table>"
        : none("No code is priced by a name match that the old table disagrees with.") },

    { key: "advisers", tone: "warn", count: c.unknownAdvisers.length, note: "advisers",
      tile: "Unknown advisers", title: "Advisers not in the directory",
      sub: "No region, and no one to send a report to.",
      body: () => c.unknownAdvisers.length
        ? '<table><thead><tr><th>Adviser</th><th class="num">Master clients</th><th></th></tr></thead><tbody>' +
          c.unknownAdvisers.map(a => "<tr><td>" + esc(a) + '</td><td class="num">' +
            c.masters.filter(m => m.adviser === a).length + "</td><td>" +
            (can("people") ? '<button class="btn ghost btn-sm" data-addadv="' + esc(a) + '">Add adviser</button>' : "") +
            "</td></tr>").join("") + "</tbody></table>"
        : none("Every adviser in this run is in the directory.") },

    { key: "below", tone: "bad", count: below.length, note: "clients",

        : none("Every client with split payments reconciles to its fee.") }
  ];

  /* Neither of these is something to fix, so neither opens anything. */
  const extras = [
    { t: "Excluded rows", v: c.droppedRows.toLocaleString("en-AU"), n: "zero value or no platform" },
