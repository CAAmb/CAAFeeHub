  return (parts[1][0] + parts[0][0]).toUpperCase();
}

function statusPill(s) {
  return { "Draft": "mute", "Open for Review": "info", "Locked": "warn", "Sent": "ok",
           "Not started": "mute", "In progress": "info", "Submitted": "warn", "Approved": "ok", "Returned": "bad" }[s] || "mute";
}

function renderTopActions() {
  const run = currentRun();
  const keys = Object.keys(state.runs).sort().reverse();
  let html = "";
  if (keys.length) {
    html += '<select id="runPick" style="width:auto;min-width:170px">' +
      keys.map(k => '<option value="' + k + '"' + (k === state.runKey ? " selected" : "") + ">" + esc(monthLabel(k)) + "</option>").join("") +
      "</select>";
  }
  if (localMode()) {
    if (can("ownBook")) {
      const inRun = advisersInRun();
      html += '<select id="asAdviser" style="width:auto;min-width:200px" title="Stand in as a different adviser. Testing only — replaced by the signed-in account.">' +
        inRun.map(a => '<option value="' + esc(a) + '"' + (a === state.asAdviser ? " selected" : "") + ">" + esc(a) + "</option>").join("") +
        "</select>";
    }
    html += '<div class="seg" title="Switch role. Testing only — replaced by AccessRole in the adviser directory.">' +
      ROLES.map(r => '<button data-role="' + r + '"' + (state.role === r ? ' class="on"' : "") + ">" + esc(r) + "</button>").join("") +
      "</div>";
  }
  if (run && can("approve")) {
    if (run.status === "Draft") html += '<button class="btn sky" id="btnOpen">Open for review</button>';
    if (run.status === "Open for Review") html += '<button class="btn" id="btnLock">Lock run</button>';
    if (run.status === "Locked") html += '<button class="btn ghost" id="btnUnlock">Reopen</button>';
  }
  $("#topActions").innerHTML = html;

  const pick = $("#runPick");
  if (pick) pick.addEventListener("change", e => openRun(e.target.value));
  const asPick = $("#asAdviser");
  if (asPick) asPick.addEventListener("change", e => { state.asAdviser = e.target.value; state.expanded = {}; saveUi(); render(); });
  $("#topActions").querySelectorAll("[data-role]").forEach(b =>
    b.addEventListener("click", () => { state.role = b.dataset.role; state.expanded = {}; saveUi(); render(); }));
  const setStatus = s => { const r = currentRun(); if (r) { r.status = s; saveRuns(); render(); toast("Run is now " + s + ".", "good"); } };
  if ($("#btnOpen")) $("#btnOpen").addEventListener("click", async () => {
    const r = currentRun();
    if (!r) return;
    const advisers = new Set((state.calc ? state.calc.masters : []).map(m => m.adviser).filter(Boolean));
    if (!localMode() && advisers.size && !confirm(
      "Open " + monthLabel(r.key) + " for review?\n\n" + advisers.size +
      " adviser" + (advisers.size === 1 ? "" : "s") + " will be emailed now, and chased in " +
      REMINDER_DAYS + " days if they have not finished.")) return;
    setStatus("Open for Review");
    reportNotifyResult(await notifyRunOpened(r));
  });
  if ($("#btnLock")) $("#btnLock").addEventListener("click", () => {
    const c = state.calc;
    const outstanding = [...new Set(c.masters.map(m => m.adviser))]
      .filter(a => a && adviserState(a).status !== "Approved");
    if (outstanding.length && !confirm(
      "Lock " + monthLabel(state.runKey) + "?\n\n" + outstanding.length +
      " adviser" + (outstanding.length > 1 ? "s have" : " has") + " not been approved yet:\n" +
      outstanding.slice(0, 8).join("\n") + (outstanding.length > 8 ? "\n…and " + (outstanding.length - 8) + " more" : "") +
      "\n\nLocking makes every client read-only.")) return;
    /* The month's shape, captured at the one moment it is finished. Built
       before the status change so it is written by the same save. */
    const r = currentRun();
    if (r) r.summary = buildRunSummary(r, state.calc);
    setStatus("Locked");
    celebrate();
  });
  if ($("#btnUnlock")) $("#btnUnlock").addEventListener("click", () => {
    if (!confirm("Reopen " + monthLabel(state.runKey) + "?\n\nAdvisers will be able to change their clients again, and approvals already given still stand. Only reopen if something needs correcting.")) return;
    setStatus("Open for Review");
  });
}

/* ---------------- Run / Dashboard ---------------- */
function viewRun() {
  const run = currentRun(), c = state.calc;
  let html = "";

  if (!state.rateCard.categories.length) {
    html += '<div class="banner bad no-print"><strong>No rate card yet.</strong> Nothing can be priced until the categories exist. ' +
      'Add them on the <strong>Rate/Fee Settings</strong> screen, or connect to SharePoint and they load from the list.</div>';
  } else if (state.rateCard.isSample) {
    html += '<div class="banner warn no-print"><strong>Sample pricing.</strong> The rate card holds made-up figures so the platform ' +
      'can be tried out. Replace them on the <strong>Rate/Fee Settings</strong> screen before trusting any number on this page.</div>';
  }

  if (run && run.isSample) {
    html += '<div class="banner warn no-print"><strong>Showing sample data.</strong> 25 fictional clients, so you can try everything ' +
      'without a real extract. Drop your Xplan report above to replace it.</div>';
  }

  if (!CONFIG.clientId) {
    html += '<div class="banner info no-print"><strong>Local mode.</strong> Everything is calculated and stored in this browser. ' +
            'Once IT registers the Entra app and provisions the SharePoint lists in <code>SETUP.md</code>, paste the client ID into ' +
            '<code>CONFIG.clientId</code> and the same screens read and write SharePoint instead.</div>';
  }

  html += '<div class="card no-print"><div class="card-h"><h2>Load the monthly extract</h2>' +
    '<div class="sub">Xplan &rarr; Fee Calculator Data report, saved as .xlsx or .csv</div></div>' +
    '<div class="card-b"><div class="drop" id="drop"><h3>Drop the report here</h3>' +
    '<p>or click to choose a file &mdash; the 12 Xplan columns are matched by header, not position</p></div>' +
    '<input type="file" id="fileInput" accept=".xlsx,.csv" class="hide">' +
    '<div class="spacer"></div><div class="toggle-row"><button class="btn ghost btn-sm" id="btnSample">Load sample data</button>' +
    '<span class="small muted">25 fictional clients in the same shape as the Xplan report &mdash; for trying the platform out without a real extract.</span>' +
    "</div></div></div><div class=\"spacer\"></div>";

  if (!run) return html + '<div class="banner warn">No run loaded yet. Drop a report above to get started.</div>';

  const priced = c.masters.filter(m => m.rateCardFee != null);
  const totalCurrent = c.masters.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totalNew = priced.reduce((a, m) => a + (m.fee || 0), 0);
  const totalCurrentPriced = priced.reduce((a, m) => a + (m.currentFee || 0), 0);
  const unpriced = c.masters.length - priced.length;
  const totalFum = [...new Set(c.masters.map(m => m.fumKey))]
    .reduce((a, k) => a + (c.masters.find(m => m.fumKey === k).totalFum || 0), 0);

  html += '<div class="stats">' +
    stat("Master clients", c.masters.length.toLocaleString("en-AU"), c.rows.length.toLocaleString("en-AU") + " subfund rows" +
      (c.hiddenDefaults ? " · " + c.hiddenDefaults.toLocaleString("en-AU") + " placeholders hidden" : "") +
      (c.addedFundCount ? " · " + c.addedFundCount + " added" : "")) +
    stat("Total FUM", money(totalFum), c.droppedRows.toLocaleString("en-AU") + " rows excluded") +
    stat("Current fees", money(totalCurrent), "as reported by Xplan") +
    stat("New fees (priced)", money(totalNew), money(totalNew - totalCurrentPriced) + " movement") +
    stat("Unpriced", unpriced.toLocaleString("en-AU"), "no category rate", unpriced ? "bad" : "") +
    "</div>";

  html += '<div class="grid2">';
  html += '<div class="card"><div class="card-h"><h2>Category coverage</h2></div><div class="card-b">' +
    '<table><thead><tr><th>Master category</th><th class="num">Clients</th><th class="num">Rate</th><th></th></tr></thead><tbody>' +
    categoryCoverageRows(c) + "</tbody></table></div></div>";

  html += '<div class="card"><div class="card-h"><h2>By region</h2></div><div class="card-b">' +
    '<table><thead><tr><th>Region</th><th class="num">Clients</th><th class="num">Current</th><th class="num">New</th><th class="num">Movement</th></tr></thead><tbody>' +
    regionRows(c) + "</tbody></table></div></div>";
  html += "</div>";
  return html;
}

/* Name or Xplan ID, because the ID is what a client is called in every other
   system and it is the only thing that is unique. */
function searchField() {
  return '<div class="field no-print" style="min-width:220px"><label>Find a client</label>' +
    '<input type="search" id="fQ" placeholder="name or Xplan ID" value="' + esc(state.query) + '"></div>';
}

function applyQuery(list) {
  const q = state.query.trim().toLowerCase();
  if (!q) return list;
  return list.filter(m =>
    String(m.name || "").toLowerCase().includes(q) ||
    String(m.masterId || "").toLowerCase().includes(q) ||
    String(m.adviser || "").toLowerCase().includes(q));
}

function stat(k, v, n, cls) {
  return '<div class="stat' + (cls ? " " + cls : "") + '"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="n">' + esc(n || "") + "</div></div>";
}

function categoryCoverageRows(c) {
  return c.categories.map(e =>
    "<tr><td>" + esc(e.category) +
      (e.mappedTo ? ' <span class="pill info">&rarr; ' + esc(e.mappedTo) + "</span>" : "") +
      (c.ambiguous.includes(e) ? ' <span class="pill warn">confirm</span>' : "") +
    '</td><td class="num">' + e.clients + '</td><td class="num">' +
    (e.rate == null ? '<span class="pill bad">not priced</span>' : money(e.rate)) + "</td><td>" +
    (e.rate == null && can("rateCardEdit") ? '<button class="btn ghost btn-sm no-print" data-addcat="' + esc(e.category) + '">Map</button>' : "") +
    "</td></tr>").join("");
}

function regionRows(c) {
  const g = new Map();
  for (const m of c.masters) {
    const k = m.region || "—";
    const e = g.get(k) || { n: 0, cur: 0, nw: 0 };
    e.n++; e.cur += m.currentFee || 0; e.nw += m.fee || 0;
    g.set(k, e);
  }
  return [...g.entries()].sort().map(([k, e]) =>
    "<tr><td>" + esc(k) + '</td><td class="num">' + e.n + '</td><td class="num">' + money(e.cur) +
    '</td><td class="num">' + money(e.nw) + '</td><td class="num">' + money(e.nw - e.cur) + "</td></tr>").join("");
}

function defaultMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

/* ---------------- Review ---------------- */
function viewReview() {
  const run = currentRun(), c = state.calc;
  if (!run) return '<div class="banner warn">Load a run first.</div>';
  if (can("ownBook")) return viewMyClients();

  const advisers = advisersInRun();
  const regions = [...new Set(c.masters.map(m => m.region))].sort();
  const locked = run.status === "Locked" || run.status === "Sent";

  let list = c.masters;
  if (state.filterAdviser !== "all") list = list.filter(m => m.adviser === state.filterAdviser);
  if (state.filterRegion !== "all") list = list.filter(m => m.region === state.filterRegion);
  list = applyQuery(list);

  const totCur = list.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totNew = list.reduce((a, m) => a + (m.fee || 0), 0);

  let html = '<div class="card"><div class="card-h">' +
    '<div class="field" style="min-width:210px"><label>Adviser</label><select id="fAdv"><option value="all">All advisers</option>' +
    advisers.map(a => '<option value="' + esc(a) + '"' + (state.filterAdviser === a ? " selected" : "") + ">" + esc(a) + "</option>").join("") + "</select></div>" +
    '<div class="field" style="min-width:150px"><label>Region</label><select id="fReg"><option value="all">All regions</option>' +
    regions.map(a => '<option value="' + esc(a) + '"' + (state.filterRegion === a ? " selected" : "") + ">" + esc(a) + "</option>").join("") + "</select></div>" +
    searchField() +
    '<div class="right no-print">' +
    '<button class="btn ghost" id="btnPrint">Report / PDF</button>' +
    '<button class="btn ghost" id="btnCsv">Export CSV</button></div></div>';

  html += '<div class="card-b" style="padding:12px 18px;border-bottom:1px solid var(--line)">' +
    '<div class="toggle-row small muted">' + list.length + " master clients &middot; current " + money(totCur) +
    " &rarr; new " + money(totNew) + " &middot; movement <strong>" + money(totNew - totCur) + "</strong>" +
    (locked ? ' &middot; <span class="pill warn">run locked — read only</span>' : "") + "</div></div>";

  html += clientTable(list, locked);
  return html;
}

/* ---------------- My Clients — what an adviser actually sees ----------------
   Their own book only, no adviser or region filter, no admin nav, and read-only
   once they have submitted or the run has been locked. */
function viewMyClients() {
  const run = currentRun(), c = state.calc, me = state.asAdviser;
  if (!me) return '<div class="banner warn">No advisers in this run yet.</div>';

  let html = '<div class="banner info no-print"><strong>Demo.</strong> Use the picker in the top bar to stand in as a different adviser. ' +
    'In the live app there is no picker &mdash; you are whoever you signed in as, and you only ever see your own clients.' +
    (run.isSample ? " These clients are fictional sample data." : "") + "</div>";

  /* A run still being prepared is not an adviser's business. */
  if (run.status === "Draft") {
    return html + '<div class="card"><div class="card-b" style="text-align:center;padding:44px">' +
      '<h2 style="margin-bottom:8px">' + esc(monthLabel(run.key)) + " isn't ready yet</h2>" +
      '<div class="muted">The fee review for this month is still being prepared. You will be notified when it opens.</div>' +
      "</div></div>";
  }

  const st = adviserState(me);
  const runClosed = run.status === "Locked" || run.status === "Sent";
  const locked = runClosed || st.status === "Submitted" || st.status === "Approved";

  const list = c.masters.filter(m => m.adviser === me);
  const totCur = list.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totNew = list.reduce((a, m) => a + (m.fee || 0), 0);
  const totFum = [...new Set(list.map(m => m.fumKey))]
    .reduce((a, k) => a + (list.find(m => m.fumKey === k).totalFum || 0), 0);
  const noRate = list.filter(m => m.baseFee == null).length;

  if (st.status === "Returned") {
    html += '<div class="banner bad"><strong>Sent back to you.</strong>' +
      (st.note ? " " + esc(st.note) : " Please review and resubmit.") + "</div>";
  } else if (st.status === "Submitted") {
    html += '<div class="banner warn"><strong>Submitted.</strong> Waiting on approval — your clients are read-only until then.</div>';
  } else if (st.status === "Approved") {
    html += '<div class="banner info"><strong>Approved.</strong> Nothing further needed from you this month.</div>';
  } else if (runClosed) {
    html += '<div class="banner warn"><strong>This run is closed.</strong> Your clients are shown read-only.</div>';
  }

  html += '<div class="stats">' +
    stat("My clients", list.length, c.rows.filter(r => r.adviser === me).length + " accounts") +
    stat("Total FUM", money(totFum), "included accounts only") +
    stat("Current fees", money(totCur), "what they pay today") +
    stat("New fees", money(totNew), money(totNew - totCur) + " movement") +
    (noRate ? stat("Awaiting a rate", noRate, "head office is setting these", "warn") : "") +
    "</div>";

  if (!locked) {
    html += '<div class="card no-print" style="margin-bottom:16px"><div class="card-h"><h2>What to check</h2></div><div class="card-b">' +
      '<ol style="margin:0;padding-left:20px;color:var(--ink-2)">' +
      "<li>Expand a client and confirm each account should be counted. Set <strong>Include</strong> or <strong>Exclude</strong> to change it.</li>" +
      "<li>Check the total FUM looks right. If a subfund value is wrong, exclude it and note why in the comment.</li>" +
      "<li>Leave both fee boxes alone to accept the rate card fee. Type over <strong>Adviser fee</strong> to set your own, or type a " +
      "figure into <strong>% of FUM</strong> to charge a percentage instead. Clearing the box hands the client back to the rate card.</li>" +
      "<li>To price fund by fund, set a <strong>Fee Type</strong> on any individual fund. The client's fee then becomes the sum of the " +
      "funds &mdash; a fund percentage is charged on that fund's own balance &mdash; and any fund left unset charges nothing.</li>" +
      "<li>Payment sources sit on the funds. Expand the client and use <strong>Set payment on all funds</strong> if it all comes from " +
      "one place, then change the odd one out. The fund amounts have to add up to the fee.</li>" +
      "<li>Missing an account? <strong>+ Add fund</strong> at the bottom of the client adds one with its own name and balance.</li>" +
      "<li><strong>Report / PDF</strong> gives you a tidy copy of your book to keep &mdash; choose <em>Save as PDF</em> in the " +
      "print dialog. Worth doing once you have submitted.</li>" +
      "<li>Add a comment on anything you have changed, then submit.</li>" +
      "</ol></div></div>";
  }

  html += '<div class="card"><div class="card-h"><h2>' + esc(me) + "</h2>" +
    '<div class="sub">' + esc(monthLabel(run.key)) + " &middot; " + list.length + " clients &middot; current " + money(totCur) +
    " &rarr; new " + money(totNew) + "</div>" +
    searchField() +
    '<div class="right no-print">' +
    '<button class="btn ghost" id="btnPrint">Report / PDF</button>' +
    '<button class="btn ghost" id="btnCsv">Export CSV</button>' +
    (locked ? "" : '<button class="btn sky" id="btnSubmit">Submit for approval</button>') +
    "</div></div>";

  /* The totals above are the whole book on purpose — searching narrows what is
     on screen, not what the adviser is signing off. */
  const shown = applyQuery(list);
  if (state.query.trim() && shown.length !== list.length) {
    html += '<div class="card-b small muted" style="padding:10px 18px;border-bottom:1px solid var(--line)">' +
      shown.length + " of " + list.length + ' clients match &ldquo;' + esc(state.query.trim()) + "&rdquo;</div>";
  }
  html += clientTable(shown, locked);
  return html;
}

/* The shared table. Ops and advisers see the same numbers — the difference is
   scope and whether the inputs are live. */
function clientTable(list, locked) {
  /* An adviser is looking at one book, so the adviser column is their own name
     repeated down the page. Drop it and give the width back to the numbers. */
  const showAdviser = !can("ownBook");
  const span = showAdviser ? 13 : 12;
  let html = '<div class="tbl-wrap"><table><thead><tr>' +
    "<th></th><th>Master client</th>" + (showAdviser ? "<th>Adviser</th>" : "") + "<th>Category</th>" +
    '<th class="num">Total FUM</th><th class="num">Current fee</th><th class="num">Rate card</th>' +
    "<th>Fee Type</th><th>Adviser fee</th><th>% of FUM</th>" +
    '<th class="num">Movement</th><th>Payment</th><th>Comment</th></tr></thead><tbody>';

  for (const m of list) {
    const open = !!state.expanded[m.masterId];
    const added = addedFunds(currentRun(), m.masterId);
    /* Direction matters more than the fact of being off band: under the rate
       card is money left behind, over it is money gained. Colour says which. */
    const under = m.outsideBand && m.diffToCard != null && m.diffToCard < 0;
    const bandFlag = (m.outsideBand
        ? ' <span class="pill ' + (under ? "bad" : "ok") + '" title="' + (under ? "Below" : "Above") + " the rate card by more than " +
          (state.rateCard.variancePct * 100) + '%">' + (under ? "&darr; " : "&uarr; ") + money(Math.abs(m.diffToCard)) + " off band</span>"
        : "") +
      (m.belowCurrent ? ' <span class="pill bad" title="Lower than the fee the client pays today">below current</span>' : "") +
      (m.overCap ? ' <span class="pill bad" title="' +
          esc(m.overCapFunds.map(r => (r.fund ? r.fund.name : "fund") + " allows " + money(r.capValue) +
            ", drawing " + money(r.feeShare)).join(" · ")) + '">over platform cap' +
          (m.maxFee != null ? " &mdash; max " + money(Math.floor(m.maxFee))
            : " on " + m.overCapFunds.length + " fund" + (m.overCapFunds.length > 1 ? "s" : "")) + "</span>" : "") +
      (m.underMinBalance.length ? ' <span class="pill bad" title="' +
          esc(m.underMinBalance.map(r => (r.fund ? r.fund.name : "fund") + " needs " + money(r.fund.minBalance) +
            ", balance is " + money(r.valueUsed)).join(" · ")) + '">under platform minimum</span>' : "") +
      (m.splitFunds.length ? ' <span class="pill warn" title="' +
          esc(m.splitFunds.map(r => (r.fund ? r.fund.name : "fund") + ": " + money(r.shortfall) +
            " cannot come off the platform (" + r.limitedBy + ")").join(" · ")) + '">' +
          (m.houseSplitApplies ? "FUM under the minimum &mdash; " : "needs direct debit &mdash; ") +
          money(m.splitFunds.reduce((a, r) => a + r.shortfall, 0)) + " by direct debit</span>" : "") +
      (m.mode === "Variable" && m.unsetFunds ? ' <span class="pill warn">' + m.unsetFunds + " fund" + (m.unsetFunds > 1 ? "s" : "") + " unset</span>" : "");
    html += "<tr>" +
      '<td><button class="expand" data-exp="' + esc(m.masterId) + '">' + (open ? "&minus;" : "+") + "</button></td>" +
      /* Three lines, in the order somebody scans them: who, which record, how
         big. The ID gets a line of its own because it is what gets copied into
         Xplan, and hunting for it inside a run-on line is the whole problem. */
      "<td><strong>" + esc(m.name) + "</strong>" +
        '<div class="small muted mono">Xplan ' + esc(m.masterId) + "</div>" +
        '<div class="small muted">' + m.rows.length + " accounts" + (added.length ? " (" + added.length + " added)" : "") +
        (m.entityWeightTotal ? " &middot; +" + m.entityWeightTotal + " entity wt" : "") + "</div></td>" +
      (showAdviser ? "<td>" + esc(m.adviser) + '<div class="small muted">' + esc(m.region) + "</div></td>" : "") +
      "<td>" + esc(m.category || "—") +
        (m.mappedTo ? '<div class="small muted">prices as ' + esc(m.mappedTo) + "</div>" : "") +
        (m.baseFee == null ? ' <span class="pill bad">no rate</span>' : "") + "</td>" +
      '<td class="num">' + money(m.totalFum) + "</td>" +
      '<td class="num">' + money(m.currentFee) + "</td>" +
      '<td class="num">' + money(m.rateCardFee) +
        '<div class="small muted">' + (m.baseFee == null ? "&mdash;" : money(m.baseFee) + " + " + money(m.entityFee) + " + " + money(m.surcharge)) + "</div></td>" +
      "<td>" + modeCell(m) + "</td>" +
      '<td>' + feeCell(m, locked) + bandFlag + "</td>" +
      "<td>" + pctCell(m, locked) + "</td>" +
      '<td class="num">' + money(m.variance) + "</td>" +
      "<td>" + paymentCell(m) + "</td>" +
      '<td><textarea rows="1" class="grow w140" data-mo="' + esc(m.masterId) + '" data-f="comment"' + (locked ? " disabled" : "") + ">" +
        esc(m.comment) + "</textarea></td>" +
      "</tr>";

    if (open) {
      for (const r of m.rows) {
        const variable = m.mode === "Variable";
        const varPay = m.paymentSource === "Variable";
        html += '<tr class="acct"><td></td>' +
          /* Two lines: the account, then who holds it and where. No Xplan ID —
             it identifies the client, and the client is one row up. */
          '<td colspan="' + (showAdviser ? 2 : 1) + '">' + fundNameCell(r, locked) +
            '<div class="small muted">' + (r.manual ? "" : esc(r.memberName) + " &middot; ") +
            esc(r.vendorUsed) + (!r.manual && r.vendor === "N/A" && r.vendorUsed !== "N/A" ? " (matched from name)" : "") +
            (r.included ? "" : " &middot; not counted in FUM") + "</div></td>" +
          "<td>" + includeSelect(r, locked) + "</td>" +
          '<td class="num">' + fundValueCell(r, locked) + "</td>" +
          '<td class="num small muted">' + pct(r.weight) + " of FUM</td>" +
          '<td class="num small muted">' + (variable ? "&mdash;" : money(r.feeShare) + " share") + "</td>" +
          /* Setting a fee type here is what makes the client variable. */
          "<td>" + (r.included ? fundSelect(r, "mode", ["", "Fixed Fee", "Percentage"], locked) : "") + "</td>" +
          "<td>" + (r.included ? fundFeeCell(r, m, locked) + fundCapNote(r, m, locked) : "") + "</td>" +
          "<td>" + (r.included ? fundPctCell(r, locked) : "") + "</td>" +
          '<td class="num small muted">' + (variable ? "" : money(r.varianceShare)) + "</td>" +
          "<td>" + (r.included ? fundSelect(r, "paymentSource", PAY_SOURCES, locked) + splitPrompt(r) : "") + "</td>" +
          "<td>" + (r.included && varPay ? fundPayCell(r, locked) : "") + "</td>" +
          "</tr>";
      }
      /* The two things that act on every fund at once live under the funds, not
         on the client line — the client line is a summary now. */
      if (!locked) {
        html += '<tr class="acct no-print"><td></td><td colspan="' + (span - 1) + '">' +
          '<button class="btn ghost btn-sm" data-addfund="' + esc(m.masterId) + '">+ Add fund</button> ' +
          '<button class="btn ghost btn-sm" data-payall="' + esc(m.masterId) + '">Set payment on all funds&hellip;</button>' +
          (m.fundsPriced ? ' <span class="small muted">priced by fund &mdash; the client fee is the sum of ' +
            m.fundsPriced + " of " + m.rows.filter(r => r.included).length + " funds</span>" : "") +
          "</td></tr>";
      }
    }
  }
  html += "</tbody></table></div></div>";
  return html;
}

/* Include / Exclude on an account. The only client-line select left; pricing
   and payment both moved onto the funds. */
function includeSelect(r, locked) {
  return '<select class="w110" data-ro="' + esc(r.key) + '" data-f="include"' + (locked ? " disabled" : "") + ">" +
    ["", "Include", "Exclude"].map(o =>
      '<option value="' + esc(o) + '"' + (r.override === o ? " selected" : "") + ">" + esc(o || "Auto") + "</option>").join("") +
    "</select>";
}

/* One name for each way a client can be priced, used on the client line, in
   Exceptions and in the export so the three never drift apart. */
function feeTypeLabel(m) {
  return m.mode === "Variable" ? "By fund"
       : m.mode === "Percentage" ? "% of FUM"
       : m.mode === "Fixed Fee" ? "Fixed fee" : "Rate card";
}

/* The client line reports how the client is being priced; it no longer decides
   it. Every control that sets pricing is either the two typeable cells beside
   this one or a dropdown on a fund. */
function modeCell(m) {
  const label = feeTypeLabel(m);
  const note = m.mode === "Variable" ? m.fundsPriced + " fund" + (m.fundsPriced > 1 ? "s" : "") + " priced"
             : m.mode === "" ? "unchanged" : "adviser set";
  return "<strong>" + label + '</strong><div class="small muted">' + note + "</div>";
}

/* Sources are picked on the funds, so this is a reconciliation, not a control:
   how much of the fee has been accounted for and whether it adds up. */
function paymentCell(m) {
  if (m.paymentSource !== "Variable") {
    return '<span class="small muted">not set</span><div class="small muted">expand to set per fund</div>';
  }
  const total = m.rows.filter(r => r.included).length;
  return '<span class="small">' + m.fundsSourced + " of " + total + " funds</span>" +
    '<div class="small ' + (m.paymentShort ? "pill bad" : "muted") + '">' +
    (m.paymentShort ? "short " + money(m.paymentGap) : money(m.collected) + " allocated") + "</div>" +
    (m.directDebitTotal > 0 ? '<div class="small muted">' + money(m.directDebitTotal) + " by direct debit</div>" : "");
}

/* A hand-added fund is the adviser's own text, so it stays editable — and it is
   the one kind of row that can be taken away again. */
/* Xplan puts the member's surname on the end of most subfund names, and the
   member is named on the line below it, so drop the repeat. Deliberately narrow:
   an exact trailing match on that member's own surname, and only when something
   is left afterwards — a fund genuinely called that keeps its name. */
function fundLabel(r) {
  const raw = String(r.subfundName || "").trim();
  const surname = String(r.memberName || "").split(",")[0].trim();
  if (!surname) return raw || "(unnamed account)";
  const tail = new RegExp("\\s*[-\u2013\u2014]\\s*" + surname.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$", "i");
  const cut = raw.replace(tail, "").trim();
  return cut || raw || "(unnamed account)";
}

function fundNameCell(r, locked) {
  if (!r.manual) return esc(fundLabel(r));
  return '<input type="text" class="grow-x" data-addf="' + esc(r.uid) + '" data-f="name" value="' +
    esc(r.subfundName) + '"' + (locked ? " disabled" : "") + ">" +
    (locked ? "" : ' <button class="btn ghost icon-x" data-delfund="' + esc(r.uid) +
      '" title="Remove this fund" aria-label="Remove this fund">&times;</button>') +
    ' <span class="pill info">added</span>';
}

/* What this platform allows on this account, and whether we are inside it. The
   number matters more than the fact of the breach — an adviser who sees "over
   cap" without being told the ceiling has to go and look it up. */
function fundCapNote(r, m, locked) {
  let out = "";
  if (r.underMinBalance) {
    out += '<div><span class="pill bad" title="' + esc(r.fund.name + " will not process a fee on a balance under " +
      money(r.fund.minBalance) + "; this account holds " + money(r.valueUsed)) +
      '">under ' + money(r.fund.minBalance) + " minimum</span></div>";
  }
  if (r.capValue == null) return out;
  const basis = r.capBinding === "percentage"
    ? r.fund.capPct.toFixed(2) + "% of balance"
    : "flat" + (r.fund.capPct > 0 ? ", under the " + r.fund.capPct.toFixed(2) + "%" : "");
  if (r.overCap) {
    /* The fix only lives here when the fund carries its own fee. On a client
       priced as a whole, one fund's cap is a limit on the client fee, so the
       action belongs on the client line. */
    out += '<div><span class="pill bad">over by ' + money(r.overCapBy) + " &mdash; max " + money(r.capValue) + "</span>" +
      (locked || m.mode !== "Variable" ? "" :
        ' <button class="btn ghost btn-sm" data-tocap="' + esc(r.key) + '">Bring to cap</button>') + "</div>";
  } else {
    out += '<div class="small muted">max ' + money(r.capValue) + " &middot; " + basis + "</div>";
  }
  return out;
}

function fundValueCell(r, locked) {
  if (!r.manual) return money(r.valueUsed) + (r.valueEdited ? ' <span class="pill info">edited</span>' : "");
  return '<input type="number" step="1" class="w110 num" data-addf="' + esc(r.uid) + '" data-f="value" value="' +
    (r.value == null ? "" : Math.round(r.value)) + '"' + (locked ? " disabled" : "") + ">";
}

/* Fund-level controls. Separate from selectCell because a row's include
   override lives on a different field to its fee type and payment settings. */
function fundSelect(r, field, options, locked) {
  const cur = r[field === "mode" ? "feeMode" : field] || "";
  return '<select class="w110" data-ro="' + esc(r.key) + '" data-f="' + field + '"' + (locked ? " disabled" : "") + ">" +
    options.map(o => '<option value="' + esc(o) + '"' + (cur === o ? " selected" : "") + ">" + esc(o || "Auto") + "</option>").join("") + "</select>";
}

function fundFeeCell(r, m, locked) {
  if (m.mode !== "Variable") return '<span class="small muted">&mdash;</span>';
  if (r.feeMode === "Percentage") return '<span class="mono small">' + money(r.fundFee) + "</span>";
  if (r.feeMode === "Fixed Fee") {
    return '<input type="number" step="1" class="w110 num" data-ro="' + esc(r.key) + '" data-f="fee" value="' +
      (r.fundFee == null ? "" : Math.round(r.fundFee)) + '"' + (locked ? " disabled" : "") + ">";
  }
  return '<span class="pill warn" title="This fund charges nothing until a fee type is chosen">not set</span>';
}

function fundPctCell(r, locked) {
  if (r.feeMode !== "Percentage") {
    return r.fundFee != null && r.valueUsed > 0
      ? '<span class="mono small muted">' + pct(r.fundFee / r.valueUsed) + "</span>" : "";
  }
  return '<input type="number" step="0.001" class="w80 num" data-ro="' + esc(r.key) + '" data-f="pct" value="' +
    (r.fundPct == null ? "" : (r.fundPct * 100).toFixed(3)) + '"' + (locked ? " disabled" : "") +
    '><div class="small muted">% of fund</div>';
}

/* Said next to the dropdown rather than in the amount column, because it is the
   reason to change the dropdown. */
function splitPrompt(r) {
  if (!r.needsSplit || r.paymentSource === PAY_SPLIT) return "";
  return '<div><span class="pill bad" title="' + esc(splitReason(r)) + '">' +
    money(r.shortfall) + " can&rsquo;t come off the platform</span>" +
    '<div class="small muted">' + esc(r.limitedBy) + "</div></div>";
}

/* Why the platform cannot carry it, in a sentence. The distinction matters: a
   platform cap is theirs and cannot be argued with, the house rule is ours. */
function splitReason(r) {
  const rc = state.rateCard;
  if (r.limitedBy === "minimum balance") {
    return r.fund.name + " will not draw a fee at all on a balance under " + money(r.fund.minBalance) + ".";
  }
  if (r.limitedBy === "house rule") {
    return "Our rule: this client's FUM is too small for the " + money(rc.absoluteMinimum) +
      " minimum fee to be reachable at " + rc.maxDrawPct + "%, so we draw " + rc.maxDrawPct +
      "% of the balance (" + money(r.houseMax) + ") and direct debit the rest.";
  }
  return r.fund.name + " will only allow " + money(r.platformMax) + " from this account.";
}

/* The dollar actually drawn from this fund. Defaults to its share of the fee so
   that simply naming a source already reconciles. A split shows both halves:
   the platform side is editable, the direct debit side is whatever is left. */
function fundPayCell(r, locked) {
  if (!r.paymentSource) return '<span class="small muted">pick a source</span>';

  if (r.paymentSource === PAY_SPLIT) {
    return (r.paymentAuto
      ? '<div><span class="pill info" title="' + esc(splitReason(r)) +
        '">split set automatically</span></div>' : "") +
      '<div class="small muted">Platform</div>' +
      '<input type="number" step="1" class="w110 num" data-ro="' + esc(r.key) + '" data-f="payPlatform" value="' +
        (r.payPlatform == null ? "" : Math.round(r.payPlatform)) + '"' + (locked ? " disabled" : "") + ">" +
      (r.splitOverPlatform
        ? '<div class="pill bad small">more than ' + money(r.platformMax) + " allowed</div>"
        : (r.payPlatformEdited ? '<div class="small muted">adjusted</div>' : "")) +
      '<div class="small muted" style="margin-top:4px">Direct debit</div>' +
      '<div class="mono">' + money(r.payDirect) + "</div>" +
      '<div class="small muted">the balance of the fee</div>';
  }

  return '<input type="number" step="1" class="w110 num" data-ro="' + esc(r.key) + '" data-f="paymentAmount" value="' +
    (r.paymentAmount == null ? "" : Math.round(r.paymentAmount)) + '"' + (locked ? " disabled" : "") + ">" +
    (r.paymentShort ? '<div class="pill bad small">under by ' + money(Math.round(r.feeShare) - r.paymentAmount) + "</div>"
      : (r.paymentEdited ? '<div class="small muted">adjusted</div>' : ""));
}

function feeCell(m, locked) {
  /* On a Variable client the fee is not typed anywhere — it is whatever the
     funds add up to, so show the total and send the adviser to the funds. */
  if (m.mode === "Variable") {
    return '<span class="mono">' + money(m.fee) + '</span><div class="small muted">sum of ' +
      m.fundsPriced + " priced fund" + (m.fundsPriced > 1 ? "s" : "") + "</div>" +
      (m.feeShadowed ? '<div class="small muted">typed fee not in use</div>' : "");
  }
  /* Typing here is what sets a fixed fee — there is no mode to choose first.
     Clearing the box hands the client back to the rate card. A percentage takes
     precedence, so the box shows what it produces and stops accepting input. */
  const disabled = locked || m.mode === "Percentage";
  return '<input type="number" step="1" class="w110 num" data-mo="' + esc(m.masterId) + '" data-f="fee" value="' +
    (m.fee == null ? "" : Math.round(m.fee)) + '"' + (disabled ? " disabled" : "") + ">" +
    (m.mode === "Percentage" ? '<div class="small muted">from the %</div>'
      : m.feeEdited ? '<div class="small muted">adjusted</div>'
      : m.baseFee == null ? '<div class="small muted">no rate &mdash; type one</div>' : "") +
    /* One fund over its cap caps the whole client fee, because the fee is split
       across the funds by weight. So the fix is here, not on the fund. */
    (m.overCap && m.maxFee != null && !locked
      ? '<div><button class="btn ghost btn-sm" data-tocapm="' + esc(m.masterId) + '">Bring to ' +
        money(Math.floor(m.maxFee)) + "</button></div>" : "");
}

/* The other half of the pair: type a percentage and the client prices off total
   FUM. Read-only only when the funds are doing the pricing. */
function pctCell(m, locked) {
  if (m.mode === "Variable") return '<span class="mono small">' + pct(m.pctOfFum) + "</span>";
  return '<input type="number" step="0.001" class="w80 num" data-mo="' + esc(m.masterId) + '" data-f="pctInput" value="' +
    (m.pctInput == null ? "" : (m.pctInput * 100).toFixed(3)) + '"' + (locked ? " disabled" : "") +
    ' placeholder="' + (m.pctOfFum == null ? "" : (m.pctOfFum * 100).toFixed(3)) + '"><div class="small muted">' +
    (m.mode === "Percentage" ? "% of FUM" : "or type a %") + "</div>";
}

/* ---------------- Exceptions ---------------- */
function viewExceptions() {
  const c = state.calc;
  if (!c) return '<div class="banner warn">Load a run first.</div>';

  let html = "";
  const totalUnpriced = c.unpricedCats.reduce((a, x) => a + x[1], 0);

  html += '<div class="stats">' +
    stat("Unpriced clients", totalUnpriced.toLocaleString("en-AU"), c.unpricedCats.length + " categories", totalUnpriced ? "bad" : "") +
    stat("Codes to confirm", c.ambiguous.length, "letter changed meaning", c.ambiguous.length ? "warn" : "") +
    stat("Unknown advisers", c.unknownAdvisers.length, "not in the directory", c.unknownAdvisers.length ? "warn" : "") +
    stat("Excluded rows", c.droppedRows.toLocaleString("en-AU"), "zero value or no platform") +
    stat("Off band", c.masters.filter(m => m.outsideBand).length, "more than " + (state.rateCard.variancePct * 100) + "% from rate card", c.masters.some(m => m.outsideBand) ? "warn" : "") +
    stat("Below current fee", c.masters.filter(m => m.belowCurrent).length, "breaks the never-decrease rule", c.masters.some(m => m.belowCurrent) ? "bad" : "") +
    stat("Over a platform cap", c.overCap.length, "more than the platform allows", c.overCap.length ? "bad" : "") +
    stat("Under a platform minimum", c.underMinBalance.length, "fee would not be drawn", c.underMinBalance.length ? "bad" : "") +
    stat("Needing a direct debit", c.needSplit.length, "platform can't carry the fee", c.needSplit.length ? "warn" : "") +
    stat("Platforms with no cap set", c.unknownFunds.length, "not in the fund table", c.unknownFunds.length ? "warn" : "") +
    stat("Funds with no fee type", c.unsetFundClients.reduce((a, m) => a + m.unsetFunds, 0),
      "on " + c.unsetFundClients.length + " clients priced by fund", c.unsetFundClients.length ? "warn" : "") +

  html += '<div class="grid2"><div class="card"><div class="card-h"><h2>Clients priced by fund with funds not set</h2>' +
    '<div class="sub">A fund with no fee type charges nothing, so the client total is understated.</div></div><div class="card-b">' +
    (c.unsetFundClients.length
      ? '<table><thead><tr><th>Master client</th><th>Adviser</th><th class="num">Funds unset</th><th class="num">Charging</th></tr></thead><tbody>' +
        c.unsetFundClients.map(m => "<tr><td>" + esc(m.name) + "</td><td>" + esc(m.adviser) +
