/* Kept separate from checkConnection so the report can be rendered from a
   fixture without a tenant. */
function renderConnReport(report) {
  const box = $("#connResult");
  if (!box) return;
  let html = '<div class="spacer"></div>';

  if (report.error) {
    box.innerHTML = html + '<div class="banner bad"><strong>Not connected.</strong> ' + explainAuthError(report.error) + "</div>";
    return;
  }

  html += '<div class="banner ' + (report.ok ? "info" : "bad") + '">' +
    (report.ok
      ? "<strong>Everything matches.</strong> Site: " + esc(report.site.name) + ". Nothing to fix."
      : "<strong>Some lists need attention.</strong> Site: " + esc(report.site.name) + ". Everything below is exactly what to change.") +
    "</div>";

  html += '<table><thead><tr><th>List</th><th class="num">Columns</th><th>State</th></tr></thead><tbody>';
  for (const l of report.lists) {
    const bad = l.findings.filter(f => f.level === "bad").length;
    const warn = l.findings.filter(f => f.level === "warn").length;
    /* A list that is optional and absent is a feature not switched on, not a
       fault. Red on that row sends somebody hunting for a problem. */
    const missingOk = !l.found && l.optional;
    const pill = missingOk ? "warn" : (!l.found || bad) ? "bad" : warn ? "warn" : "ok";
    const label = missingOk ? "not built yet"
      : !l.found ? "not found" : bad ? bad + " to fix" : warn ? warn + " to check" : "ok";
    html += "<tr><td><strong>" + esc(l.title) + '</strong><div class="small muted">' + esc(l.kind) +
      (l.aka ? ' &middot; on the site as "' + esc(l.aka) + '"' : "") + "</div></td>" +
      '<td class="num">' + (l.columnCount == null ? "—" : l.columnCount) + "</td>" +
      '<td><span class="pill ' + pill + '">' + esc(label) + "</span></td></tr>";
    for (const f of l.findings) {
      html += '<tr class="acct"><td colspan="3"><span class="pill ' + (f.level === "bad" ? "bad" : "warn") + '">' +
        esc(f.level === "bad" ? "fix" : "check") + "</span> " +
        (f.column ? "<code>" + esc(f.column) + "</code> " : "") + esc(f.text) + "</td></tr>";
    }
  }
  html += "</tbody></table>";
  box.innerHTML = html;
}

/* =========================================================================
   Event wiring — one pass per render
   ========================================================================= */
function wire() {
  const run = currentRun();

  /* --- file loading --- */
  const drop = $("#drop"), fileInput = $("#fileInput");
  if (drop) {
    drop.addEventListener("click", () => fileInput.click());
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
      e.preventDefault(); drop.classList.remove("over");
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  }
  if ($("#btnSample")) $("#btnSample").addEventListener("click", () => {
    const monthKey = defaultMonth();
    if (state.runs[monthKey] && !confirm("A run already exists for " + monthLabel(monthKey) + ". Replace it with the sample?")) return;
    const rows = sampleRows();
    installSampleReference();
    state.runs[monthKey] = newRun(monthKey, rows, SAMPLE_LABEL);
    state.runs[monthKey].status = "Open for Review";   // so the adviser view has something to show
    state.runKey = monthKey;
    saveRuns(); saveUi(); render();
    toast(rows.length + " sample rows loaded. Nothing here is a real client.", "good");
  });

  /* --- review edits --- */
  document.querySelectorAll("[data-mo]").forEach(el => {
    el.addEventListener("change", () => {
      const f = el.dataset.f;
      let v = el.value;
      if (f === "pctInput") v = v === "" ? null : num(v) / 100;
      else if (f === "fee") v = v === "" ? null : num(v);
      setOverride("master", el.dataset.mo, { [f]: v });
      markInProgress();
      render();
    });
  });
  document.querySelectorAll("[data-ro]").forEach(el => {
    el.addEventListener("change", () => {
      const f = el.dataset.f;
      let v = el.value;
      if (f === "pct") v = v === "" ? null : num(v) / 100;
      else if (f === "fee" || f === "paymentAmount" || f === "value" || f === "payPlatform") v = v === "" ? null : num(v);
      /* Pricing a fund is what makes the client variable. Nothing has to be set
         on the client first — the client line reads the answer back. */
      const wasVariable = (state.calc.masters.find(m =>
        m.rows.some(r => r.key === el.dataset.ro)) || {}).mode === "Variable";
      setOverride("row", el.dataset.ro, { [f]: v });
      if (v && f === "mode" && !wasVariable) {
        const row = state.calc.rows.find(r => r.key === el.dataset.ro);
        if (row) toast(row.masterName + " is now priced fund by fund.");
      }
      markInProgress();
      render();
    });
  });

  /* Hand-added funds. Their name and balance are the adviser's own text, so they
     are edited in place rather than through the override machinery. */
  document.querySelectorAll("[data-addf]").forEach(el =>
    el.addEventListener("change", () => {
      const mid = masterOfAddedFund(el.dataset.addf);
      if (!mid) return;
      const list = addedFunds(currentRun(), mid).map(a => a.uid === el.dataset.addf
        ? { ...a, [el.dataset.f]: el.dataset.f === "value" ? num(el.value) : el.value }
        : a);
      setAddedFunds(mid, list);
      markInProgress();
      render();
    }));
  document.querySelectorAll("[data-delfund]").forEach(el =>
    el.addEventListener("click", () => {
      const uid = el.dataset.delfund;
      const mid = masterOfAddedFund(uid);
      if (!mid) return;
      const gone = addedFunds(currentRun(), mid).find(a => a.uid === uid);
      if (!confirm("Remove " + (gone && gone.name ? gone.name : "this fund") + " from this client?")) return;
      const run = currentRun();
      delete run.overrides["row:add~" + uid];
      setAddedFunds(mid, addedFunds(run, mid).filter(a => a.uid !== uid));
      markInProgress();
      render();
      toast("Fund removed.");
    }));
  /* --- bringing a fee inside a platform's cap --- */
  document.querySelectorAll("[data-tocap]").forEach(el =>
    el.addEventListener("click", () => {
      const r = state.calc.rows.find(x => x.key === el.dataset.tocap);
      if (!r || r.capValue == null) return;
      const cap = Math.floor(r.capValue);
      /* Match how the fund is already priced rather than switching it to a
         fixed fee behind the adviser's back. */
      if (r.feeMode === "Percentage" && r.valueUsed > 0) setOverride("row", r.key, { pct: cap / r.valueUsed });
      else setOverride("row", r.key, { mode: "Fixed Fee", fee: cap });
      markInProgress();
      render();
      toast((r.fund ? r.fund.name : "Fund") + " brought to its cap of " + money(cap) + ".", "good");
    }));
  document.querySelectorAll("[data-tocapm]").forEach(el =>
    el.addEventListener("click", () => {
      const m = state.calc.masters.find(x => x.masterId === el.dataset.tocapm);
      if (!m || m.maxFee == null) return;
      const cap = Math.floor(m.maxFee);
      /* Clearing pctInput matters: a percentage still set would keep winning
         over the typed fee and the change would look like it did nothing. */
      setOverride("master", m.masterId, { fee: cap, pctInput: null });
      markInProgress();
      render();
      toast(m.name + " brought to " + money(cap) + " — the most its platforms allow.", "good");
    }));
  document.querySelectorAll("[data-addfund]").forEach(el =>
    el.addEventListener("click", () => openAddFundDialog(el.dataset.addfund)));
  document.querySelectorAll("[data-payall]").forEach(el =>
    el.addEventListener("click", () => openPayAllDialog(el.dataset.payall)));
  /* Comments grow with what is typed rather than hiding it behind a scrollbar. */
  document.querySelectorAll("textarea.grow").forEach(el => {
    const fit = () => { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 220) + "px"; };
    el.addEventListener("input", fit);
    fit();
  });
  document.querySelectorAll("input.grow-x").forEach(el => {
    fitInputWidth(el);
    el.addEventListener("input", () => fitInputWidth(el));
  });
  document.querySelectorAll("[data-exp]").forEach(el =>
    el.addEventListener("click", () => {
      state.expanded[el.dataset.exp] = !state.expanded[el.dataset.exp];
      render();
    }));
  document.querySelectorAll("[data-expa]").forEach(el =>
    el.addEventListener("click", () => {
      state.expandedAdviser[el.dataset.expa] = !state.expandedAdviser[el.dataset.expa];
      render();
    }));

  const fAdv = $("#fAdv"), fReg = $("#fReg"), fQ = $("#fQ");
  if (fAdv) fAdv.addEventListener("change", e => { state.filterAdviser = e.target.value; render(); });
  if (fReg) fReg.addEventListener("change", e => { state.filterRegion = e.target.value; render(); });
  if (fQ) {
    /* The whole page is re-rendered on every keystroke, which throws the caret
       away with the old input. Put it back where it was. */
    fQ.addEventListener("input", e => {
      state.query = e.target.value;
      const at = e.target.selectionStart;
      render();
      const box = $("#fQ");
      if (box) { box.focus(); try { box.setSelectionRange(at, at); } catch (err) {} }
    });
  }
  if ($("#btnCsv")) $("#btnCsv").addEventListener("click", exportCsv);
  if ($("#btnPrint")) $("#btnPrint").addEventListener("click", openPrintDialog);
  if ($("#btnSubmit")) $("#btnSubmit").addEventListener("click", async () => {
    const me = scopedAdviser();
    if (!me) return;
    if (!confirm("Submit your " + monthLabel(state.runKey) + " clients for approval? They become read-only until approved or sent back.")) return;
    setAdviserStatus(me, "Submitted");
    toast("Submitted for approval.", "good");
    render();
    await notifySubmitted(currentRun(), me);
  });

  /* --- approvals --- */
  document.querySelectorAll("[data-appr]").forEach(el =>
    el.addEventListener("click", async () => {
      setAdviserStatus(el.dataset.appr, "Approved");
      render();
      toast(el.dataset.appr + " approved.", "good");
      await notifyApproved(currentRun(), el.dataset.appr);
    }));
  document.querySelectorAll("[data-ret]").forEach(el =>
    el.addEventListener("click", async () => {
      const note = prompt("What needs changing? (emailed to the adviser, and shown on their screen)");
      if (note === null) return;
      setAdviserStatus(el.dataset.ret, "Returned", note);
      render();
      await notifyReturned(currentRun(), el.dataset.ret, note);
    }));
  document.querySelectorAll("[data-sub]").forEach(el =>
    el.addEventListener("click", () => { setAdviserStatus(el.dataset.sub, "Submitted"); render(); }));
  document.querySelectorAll("[data-remind]").forEach(el =>
    el.addEventListener("click", async () => {
      const who = el.dataset.remind;
      if (!confirm("Email a reminder to " + who + "?" +
        (regionalManagersFor(who).length ? "\n\nTheir regional manager is copied in." : ""))) return;
      await notifyReminder(currentRun(), who);
    }));
  if ($("#btnNotify")) $("#btnNotify").addEventListener("click", async () => {
    const r = currentRun();
    if (!r) return;
    if (!confirm("Queue the review invitation for any adviser who has not had one for " +
      monthLabel(r.key) + "?\n\nAnyone already invited is skipped, so this is safe to press more than once.")) return;
    reportNotifyResult(await notifyRunOpened(r));
  });
  if ($("#btnRemindAll")) $("#btnRemindAll").addEventListener("click", () => {
    const c = state.calc;
    const outstanding = [...new Set(c.masters.map(m => m.adviser))].filter(a => a && adviserState(a).status !== "Approved");
    const dir = new Map(state.advisers.map(a => [a.name, a.email]));
    const text = outstanding.map(a => a + (dir.get(a) ? " <" + dir.get(a) + ">" : "")).join("; ");
    navigator.clipboard.writeText(text).then(
      () => toast(outstanding.length + " advisers copied to the clipboard."),
      () => toast("Could not copy — clipboard blocked.", "bad"));
  });

  /* --- pricing calculator ---
     Quantities and amounts repaint in place on every keystroke. Anything that
     changes the shape of the screen — the tab, the client type, a checkbox that
     rewrites the explanation under it — rebuilds, and those are all clicks, so
     no one is typing when it happens. */
  document.querySelectorAll("[data-ptab]").forEach(el =>
    el.addEventListener("click", () => { pricingInputs.tab = el.dataset.ptab; render(); }));
  document.querySelectorAll("[data-ptype]").forEach(el =>
    el.addEventListener("click", () => { pricingInputs.clientType = el.dataset.ptype; render(); }));
  document.querySelectorAll("[data-pq]").forEach(el =>
    el.addEventListener("input", () => { pricingInputs.qty[el.dataset.pq] = num(el.value); paintPricing(); }));
  document.querySelectorAll("[data-pstep]").forEach(el =>
    el.addEventListener("click", () => {
      const id = el.dataset.pstep;
      const box = document.querySelector('[data-pq="' + id + '"]');
      /* Hours move in quarters and counts in whole numbers, so the step comes
         off the box rather than being assumed. */
      const step = box && box.step === "0.25" ? 0.25 : 1;
      const next = Math.max(0, Math.round((num(pricingInputs.qty[id] || 0) + step * (+el.dataset.d)) * 100) / 100);
      pricingInputs.qty[id] = next;
      if (box) box.value = next || "";
      paintPricing();
    }));
  document.querySelectorAll("[data-pf]").forEach(el =>
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      pricingInputs[el.dataset.pf] = el.dataset.pf === "rateIdx" ? parseInt(el.value, 10) || 0 : num(el.value);
      paintPricing();
    }));
  document.querySelectorAll("[data-pb]").forEach(el =>
    el.addEventListener("change", () => { pricingInputs[el.dataset.pb] = el.checked; render(); }));
  document.querySelectorAll("[data-pfold]").forEach(el => {
    const toggle = () => { pricingInputs.open[el.dataset.pfold] = !pricingInputs.open[el.dataset.pfold]; render(); };
    el.addEventListener("click", toggle);
    /* The header is a div doing a button's job, so it needs a button's keys. */
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });

  /* --- pricing editor, on Rate/Fee Settings --- */
  const pr = () => state.rateCard.pricing || (state.rateCard.pricing = JSON.parse(JSON.stringify(EMPTY_PRICING)));
  const PE_TEXT = ["label", "name", "title", "body", "kind", "reviewed"];

  document.querySelectorAll("[data-pe]").forEach(el =>
    el.addEventListener("change", () => {
      const p = pr(), i = +el.dataset.i, f = el.dataset.f;
      const v = PE_TEXT.includes(f) ? el.value
        : (f === "newPrice" || f === "existingPrice") ? priceVal(el.value)
        : num(el.value);
      switch (el.dataset.pe) {
        case "scalar":      p[f] = v; break;
        case "item":        p.items[i][f] = v; break;
        case "itemBool":    p.items[i][f] = el.checked; break;
        case "ladder":      p.ladders[el.dataset.ct][i][f] = v; break;
        case "pack":        p.packages[i][f] = v; break;
        case "noCsa":       p.noCsa[f] = v; break;
        case "tier":        p.claims.tiers[i][f] = v; break;
        case "crate":       p.claims.rates[i][f] = v; break;
        case "claimScalar": p.claims[f] = v; break;
        case "ref":         p.reference[i][f] = v; break;
      }
      saveRateCard(); render();
    }));

  document.querySelectorAll("[data-peadd]").forEach(el =>
    el.addEventListener("click", () => {
      const p = pr();
      /* A new band starts above the current top one, which is where it almost
         always goes, rather than at zero where it collides with the first. */
      const above = (list, step) => { const t = (list || []).map(x => num(x.from)); return t.length ? Math.max(...t) + step : 0; };
      switch (el.dataset.peadd) {
        case "item":
          p.items.push({ id: newItemId(p.items), section: el.dataset.sec, label: "New line",
                         kind: el.dataset.sec === "hourly" ? "hour" : "each",
                         newPrice: 0, existingPrice: 0, suppressesMin: false, note: "" });
          break;
        case "ladder":
          (p.ladders[el.dataset.ct] = p.ladders[el.dataset.ct] || [])
            .push({ from: above(p.ladders[el.dataset.ct], 500000), rate: 0 });
          break;
        case "pack":
          p.packages.push({ name: "New package", from: above(p.packages, 5000), cas: 0, mtf: 0 });
          break;
        case "tier":
          (p.claims.tiers = p.claims.tiers || []).push({ from: above(p.claims.tiers, 250000), rate: 0 });
          break;
        case "crate":
          (p.claims.rates = p.claims.rates || []).push({ label: "New policy type", hourly: 0, ipMonthly: 0 });
          break;
        case "ref":
          (p.reference = p.reference || []).push({ title: "New panel", body: "" });
          break;
      }
      saveRateCard(); render();
    }));

  document.querySelectorAll("[data-pedel]").forEach(el =>
    el.addEventListener("click", () => {
      const p = pr(), i = +el.dataset.i, what = el.dataset.pedel;
      const list = { item: p.items, ladder: (p.ladders || {})[el.dataset.ct], pack: p.packages,
                     tier: p.claims.tiers, crate: p.claims.rates, ref: p.reference }[what];
      if (!list || !list[i]) return;
      const named = list[i].label || list[i].name || list[i].title || "";
      if (named && !confirm('Remove "' + named + '"?')) return;
      list.splice(i, 1);
      saveRateCard(); render();
    }));

  if ($("#btnPriceCopy")) $("#btnPriceCopy").addEventListener("click", () =>
    navigator.clipboard.writeText(JSON.stringify(pricing(), null, 2)).then(
      () => toast("Pricing copied as JSON."),
      () => toast("Could not copy — the clipboard is blocked.", "bad")));

  if ($("#btnPriceLoad")) $("#btnPriceLoad").addEventListener("click", () =>
    showDialog("Load pricing",
      '<p class="small muted">Paste the pricing sheet as JSON. Everything on this card is replaced, ' +
      "and the change saves with the rate card like any other edit here.</p>" +
      '<textarea id="priceJson" class="mono" rows="14" style="width:100%" placeholder="{ &quot;items&quot;: [ … ] }"></textarea>',
      "Load", () => {
        let parsed;
        try { parsed = JSON.parse((($("#priceJson") || {}).value || "").trim()); }
        catch (e) { toast("That is not valid JSON, so nothing was changed.", "bad"); return false; }
        if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.items)) {
          toast("That JSON has no items list, so it is not a pricing sheet.", "bad"); return false;
        }
        const seed = JSON.parse(JSON.stringify(EMPTY_PRICING));
        state.rateCard.pricing = { ...seed, ...parsed,
          ladders: { ...seed.ladders, ...(parsed.ladders || {}) },
          noCsa:   { ...seed.noCsa,   ...(parsed.noCsa   || {}) },
          claims:  { ...seed.claims,  ...(parsed.claims  || {}) } };
        /* Ids are the key quantities are held against on the calculator, so a
           pasted sheet missing them, or repeating one, is repaired here rather
           than silently tying two lines to the same box. */
        const seen = new Set(); let n = 0;
        for (const it of state.rateCard.pricing.items) {
          if (!it.id || seen.has(it.id)) { do { n++; } while (seen.has("i" + n)); it.id = "i" + n; }
          seen.add(it.id);
        }
        pricingInputs.qty = {};
        saveRateCard(); render();
        toast(state.rateCard.pricing.items.length + " pricing lines loaded.", "good");
      }));

  /* --- rate card --- */
  document.querySelectorAll('[data-rc="cat"],[data-rc="wt"],[data-rc="band"]').forEach(el =>
    el.addEventListener("change", () => {
      const bucket = { cat: "categories", wt: "entityWeights", band: "surchargeBands" }[el.dataset.rc];
      const f = el.dataset.f;
      state.rateCard[bucket][+el.dataset.i][f] = (f === "name") ? el.value : num(el.value);
      saveRateCard(); render();
    }));
  if ($("#optDefaults")) $("#optDefaults").addEventListener("change", e => {
    state.showEmptyDefaults = e.target.checked;
    saveUi();
    recalc();
    render();
    toast(state.showEmptyDefaults ? "Empty Default accounts are now shown." : "Empty Default accounts hidden.");
  });

  document.querySelectorAll('[data-rc="scalar"]').forEach(el =>
    el.addEventListener("change", () => { state.rateCard[el.dataset.f] = num(el.value); saveRateCard(); render(); }));
  document.querySelectorAll('[data-rc="bool"]').forEach(el =>
    el.addEventListener("change", () => { state.rateCard[el.dataset.f] = el.checked; saveRateCard(); render(); }));

  /* --- fund fee caps --- */
  document.querySelectorAll("[data-fund]").forEach(el =>
    el.addEventListener("change", () => {
      const f = state.funds[+el.dataset.fund];
      if (!f) return;
      const k = el.dataset.f;
      if (k === "aliases") f.aliases = splitAliases(el.value);
      else if (k === "capInclGst" || k === "active") f[k] = el.checked;
      else if (k === "name") f.name = el.value;
      else f[k] = num(el.value);
      state.funds[+el.dataset.fund] = normaliseFund(f);
      saveFunds();
      render();
    }));
  if ($("#btnGoFunds")) $("#btnGoFunds").addEventListener("click", () => { state.view = "ratecard"; render(); });
  if ($("#btnAddFund")) $("#btnAddFund").addEventListener("click", () => {
    state.funds.push(normaliseFund({ name: "New fund" }));
    saveFunds();
    render();
    /* Straight into the name box — the row is useless until it is named. */
    const boxes = document.querySelectorAll('[data-f="name"][data-fund]');
    const last = boxes[boxes.length - 1];
    if (last) { last.focus(); last.select(); }
  });
  document.querySelectorAll("[data-delfundrow]").forEach(el =>
    el.addEventListener("click", () => {
      const f = state.funds[+el.dataset.delfundrow];
      if (!f) return;
      if (!confirm("Remove " + (f.name || "this fund") + " and its cap?")) return;
      state.funds.splice(+el.dataset.delfundrow, 1);
      saveFunds();
      render();
      toast((f.name || "Fund") + " removed.");
    }));
  document.querySelectorAll("[data-map]").forEach(el =>
    el.addEventListener("change", () => {
      const cat = el.dataset.map;
      if (el.value) state.rateCard.aliases[cat] = el.value; else delete state.rateCard.aliases[cat];
      saveRateCard(); render();
      toast(el.value ? '"' + cat + '" now prices as ' + el.value + "." : 'Mapping cleared for "' + cat + '".');
    }));
  if ($("#btnClearMap")) $("#btnClearMap").addEventListener("click", () => {
    if (!confirm("Clear every category mapping?")) return;
    state.rateCard.aliases = {}; saveRateCard(); render();
  });
  if ($("#btnAddCat")) $("#btnAddCat").addEventListener("click", () => {
    state.rateCard.categories.push({ name: "New category", annual: 0 }); saveRateCard(); render();
  });
  document.querySelectorAll("[data-delcat]").forEach(el =>
    el.addEventListener("click", () => { state.rateCard.categories.splice(+el.dataset.delcat, 1); saveRateCard(); render(); }));

  if ($("#btnAddWt")) $("#btnAddWt").addEventListener("click", () => {
    state.rateCard.entityWeights.push({ name: "New entity type", weight: 1 });
    saveRateCard(); render();
    /* Into the name box, since the row does nothing until it matches what Xplan
       calls that entity type. */
    const boxes = document.querySelectorAll('[data-rc="wt"][data-f="name"]');
    const last = boxes[boxes.length - 1];
    if (last) { last.focus(); last.select(); }
  });
  document.querySelectorAll("[data-delwt]").forEach(el =>
    el.addEventListener("click", () => {
      const w = state.rateCard.entityWeights[+el.dataset.delwt];
      if (!confirm("Remove " + (w && w.name ? w.name : "this entity type") +
        "? Clients holding one stop picking up its fee.")) return;
      state.rateCard.entityWeights.splice(+el.dataset.delwt, 1);
      saveRateCard(); render();
    }));

  if ($("#btnAddBand")) $("#btnAddBand").addEventListener("click", () => {
    /* Start above the current top band, which is where a new one almost always
       goes, rather than at zero where it would collide with the first. */
    const tops = state.rateCard.surchargeBands.map(b => num(b.from));
    const from = tops.length ? Math.max(...tops) + 1000000 : 0;
    state.rateCard.surchargeBands.push({ from, rate: 0 });
    saveRateCard(); render();
  });
  document.querySelectorAll("[data-delband]").forEach(el =>
    el.addEventListener("click", () => {
      const b = state.rateCard.surchargeBands[+el.dataset.delband];
      if (!confirm("Remove the band from " + money(b ? b.from : 0) +
        "? The band below it then runs on to the next threshold.")) return;
      state.rateCard.surchargeBands.splice(+el.dataset.delband, 1);
      saveRateCard(); render();
    }));
  document.querySelectorAll("[data-addcat]").forEach(el =>
    el.addEventListener("click", () => {
      state.view = "ratecard"; render();
      const row = document.querySelector('[data-map="' + el.dataset.addcat.replace(/"/g, '\\"') + '"]');
      if (row) { row.scrollIntoView({ block: "center" }); row.focus(); }
      toast('Choose the tier "' + el.dataset.addcat + '" should price as.');
    }));

  /* --- advisers --- */
  document.querySelectorAll("[data-adv]").forEach(el =>
    el.addEventListener("change", () => {
      const a = state.advisers[+el.dataset.adv], f = el.dataset.f;
      a[f] = (f === "active") ? el.checked : el.value;
      saveAdvisers(); render();
    }));
  document.querySelectorAll("[data-addrole]").forEach(el =>
    el.addEventListener("click", () => {
      const role = el.dataset.addrole;
      state.advisers.push({
        name: role === "Adviser" ? "Surname, First" : "New " + role.toLowerCase(),
        role, region: role === "Adviser" ? REGIONS[0] : REGION_NONE, email: "", active: true
      });
      saveAdvisers(); render();
    }));
  document.querySelectorAll("[data-deladv]").forEach(el =>
    el.addEventListener("click", () => { state.advisers.splice(+el.dataset.deladv, 1); saveAdvisers(); render(); }));
  document.querySelectorAll("[data-addadv]").forEach(el =>
    el.addEventListener("click", () => {
      state.advisers.push({ name: el.dataset.addadv, role: "Adviser", region: REGIONS[0], email: "", active: true });
      saveAdvisers(); state.view = "people"; render();
      toast("Added " + el.dataset.addadv + " — set their region and email.");
    }));

  /* --- settings --- */
  document.querySelectorAll("[data-delrun]").forEach(el =>
    el.addEventListener("click", () => {
      if (!confirm("Delete the " + monthLabel(el.dataset.delrun) + " run? This cannot be undone.")) return;
      delete state.runs[el.dataset.delrun];
      if (state.runKey === el.dataset.delrun) state.runKey = Object.keys(state.runs).sort().pop() || null;
      saveRuns(); saveUi(); render();
    }));
  if ($("#btnCheckConn")) $("#btnCheckConn").addEventListener("click", async () => {
    const btn = $("#btnCheckConn"), box = $("#connResult");
    btn.disabled = true;
    box.innerHTML = '<div class="spacer"></div><div class="small muted">Checking…</div>';
    try {
      renderConnReport(await checkConnection());
    } catch (e) {
      box.innerHTML = '<div class="spacer"></div><div class="banner bad"><strong>Could not connect.</strong> ' +
        explainAuthError(e) + "</div>";
    } finally {
      btn.disabled = false;
    }
  });
  if ($("#btnResetRef")) $("#btnResetRef").addEventListener("click", () => {
    if (!confirm("Clear the rate card and adviser directory?\n\nBoth are emptied and will need entering again, or loading from SharePoint. Runs are not affected.")) return;
    state.rateCard = JSON.parse(JSON.stringify(EMPTY_RATE_CARD));
    state.advisers = JSON.parse(JSON.stringify(EMPTY_ADVISERS));
    saveRateCard(); saveAdvisers(); render();
    toast("Rate card and advisers cleared.", "good");
  });
}

/* An adviser touching anything moves them off "Not started" without a click. */
function markInProgress() {
  const me = scopedAdviser();
  if (!currentRun() || !can("ownBook") || !me) return;
  const st = adviserState(me);
  if (st.status === "Not started" || st.status === "Returned") setAdviserStatus(me, "In progress");
}

function setAdviserStatus(name, status, note) {
  const run = currentRun();
  if (!run || !name || name === "all") return;
  const prev = run.adviserStatus[name] || {};
  run.adviserStatus[name] = {
    ...prev, status, note: note || "",
    submittedAt: status === "Submitted" ? new Date().toISOString() : prev.submittedAt,
    approvedAt: status === "Approved" ? new Date().toISOString() : prev.approvedAt
  };
  saveRuns();
}

/* =========================================================================
   File load
   ========================================================================= */
/* Read and check the file first, then ask which month it belongs to. Choosing
   the month before anyone knows whether the file even parsed was the wrong way
   round — and overwriting the wrong month costs an adviser their work. */
async function loadFile(file) {
  try {
    toast("Reading " + file.name + "…");
    let grid;
    if (/\.csv$/i.test(file.name)) grid = parseCsv(await file.text());
    else grid = parseXlsx(await readZip(await file.arrayBuffer()));
    const { recs, missing } = gridToRecords(grid);
    openImportDialog(file.name, recs, missing);
  } catch (e) {
    toast(e.message || "Could not read that file.", "bad");
  }
}

function openImportDialog(fileName, recs, missing) {
  const suggested = defaultMonth();          // the dialog is where the month is chosen
  const advisers = new Set(), masters = new Set();
  let fum = 0;
  let placeholders = 0;
  for (const r of recs) {
    if (r.adviser) advisers.add(r.adviser);
    if (r.masterId) masters.add(r.masterId);
    fum += Math.max(r.value, 0);
    if (isEmptyDefault(r)) placeholders++;
  }

  const body =
    '<div class="kv" style="margin-bottom:16px">' +
    '<div class="k">File</div><div class="v">' + esc(fileName) + "</div>" +
    '<div class="k">Rows</div><div class="v">' + recs.length.toLocaleString("en-AU") +
      (placeholders ? ' <span class="small muted">(' + placeholders.toLocaleString("en-AU") +
        " empty Default placeholders, hidden on review)</span>" : "") + "</div>" +
    '<div class="k">Master clients</div><div class="v">' + masters.size + "</div>" +
    '<div class="k">Advisers</div><div class="v">' + advisers.size + "</div>" +
    '<div class="k">Total value</div><div class="v">' + money(fum) + "</div></div>" +
    (missing.length
      ? '<div class="banner warn">These columns were not found by name and were matched by position instead: <strong>' +
        esc(missing.join(", ")) + "</strong>. Check the numbers before opening the run.</div>"
      : '<div class="banner info">All 12 Xplan columns matched by name.</div>') +
    '<div class="field"><label>Which month is this run for?</label>' +
    '<input type="month" id="dlgMonth" value="' + esc(suggested) + '"></div>' +
    '<div id="dlgWarn" class="small" style="margin-top:8px"></div>';

  showDialog("Confirm import", body, "Import run", () => {
    const monthKey = $("#dlgMonth").value || suggested;
    if (state.runs[monthKey] && !confirm(
      "A run already exists for " + monthLabel(monthKey) + ".\n\nReplacing it discards every adviser edit and approval for that month. Continue?")) return false;

    const existed = !!state.runs[monthKey];
    state.runs[monthKey] = newRun(monthKey, recs, fileName);
    state.runKey = monthKey;
    saveUi();

    if (localMode()) {
      saveRuns();
      render();
      toast(recs.length.toLocaleString("en-AU") + " rows imported for " + monthLabel(monthKey) + ".", "good");
      celebrate();
      return true;
    }

    /* Connected, an import is three writes and none of them is a keystroke, so
       it runs now rather than through the debounce — and the extract goes to
       the library as a file, not as 1,800 list items. */
    publishRun(monthKey, recs, fileName, existed);
    return true;
  }, () => {
    /* Live warning while they pick, so a clash is visible before they commit. */
    const sync = () => {
      const k = $("#dlgMonth").value;
      const warn = $("#dlgWarn");
      warn.innerHTML = state.runs[k]
        ? '<span class="pill bad">' + esc(monthLabel(k)) + " already has a run — importing replaces it</span>"
        : '<span class="muted">' + esc(monthLabel(k)) + " has no run yet.</span>";
    };
    $("#dlgMonth").addEventListener("input", sync);
    sync();
  });
}

/* An account Xplan does not know about — a new platform, or one the extract
   missed. It joins the client's FUM group, so it changes the surcharge and every
   other fund's share of the fee, which is the point. */
function openAddFundDialog(masterId) {
  const m = state.calc.masters.find(x => x.masterId === masterId);
  if (!m) return;

  const body =
    '<div class="kv" style="margin-bottom:16px">' +
    '<div class="k">Client</div><div class="v">' + esc(m.name) + "</div>" +
    '<div class="k">Xplan ID</div><div class="v mono">' + esc(m.masterId) + "</div>" +
    '<div class="k">FUM today</div><div class="v">' + money(m.totalFum) + "</div></div>" +
    '<div class="field"><label>Fund name</label><input type="text" id="afName" placeholder="e.g. HUB24 Super"></div>' +
    '<div class="spacer"></div><div class="field"><label>Platform (optional)</label>' +
    '<input type="text" id="afVendor" placeholder="e.g. HUB24"></div>' +
    '<div class="spacer"></div><div class="field"><label>FUM</label>' +
    '<input type="number" step="1" id="afValue" value="0"></div>' +
    '<div class="spacer"></div><div class="field"><label>Fee for this fund (optional)</label>' +
    '<input type="number" step="1" id="afFee" placeholder="leave blank to keep the client on one fee"></div>' +
    '<div id="afWarn" class="small" style="margin-top:10px"></div>';

  showDialog("Add a fund to " + m.name, body, "Add fund", () => {
    const name = $("#afName").value.trim();
    if (!name) { toast("Give the fund a name.", "bad"); return false; }
    const uid = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const feeRaw = $("#afFee").value;
    setAddedFunds(masterId, addedFunds(currentRun(), masterId).concat([{
      uid, name, vendor: $("#afVendor").value.trim(), value: num($("#afValue").value)
    }]));
    if (feeRaw !== "") setOverride("row", "add~" + uid, { mode: "Fixed Fee", fee: num(feeRaw) });
    state.expanded[masterId] = true;
    markInProgress();
    render();
    toast(name + " added to " + m.name + ".", "good");
    return true;
  }, () => {
    /* Putting a fee on one fund is what switches the whole client to fund-by-fund
       pricing, and every other fund then charges nothing until it is priced too.
       That is a surprise worth having before the button is pressed, not after. */
    const sync = () => {
      const box = $("#afWarn");
      const others = m.rows.filter(r => r.included).length;
      box.innerHTML = $("#afFee").value === ""
        ? '<span class="muted">No fee here means the client keeps its single fee and this fund simply adds to the FUM.</span>'
        : '<span class="pill warn">Pricing this fund prices the client fund by fund</span>' +
          '<div class="small muted" style="margin-top:6px">The client\'s fee becomes the sum of the funds. The other ' +
          others + " fund" + (others === 1 ? "" : "s") + " will charge nothing until each one is given a fee too.</div>";
    };
    $("#afFee").addEventListener("input", sync);
    sync();
  });
}

/* One pick for every fund. The client line used to do this in a single dropdown;
   with the sources on the funds it would otherwise be one click per fund. */
function openPayAllDialog(masterId) {
  const m = state.calc.masters.find(x => x.masterId === masterId);
  if (!m) return;
  const funds = m.rows.filter(r => r.included);

  const body =
    '<div class="small muted" style="margin-bottom:12px">Sets the payment source on all ' + funds.length +
    " included fund" + (funds.length === 1 ? "" : "s") + " of <strong>" + esc(m.name) +
    "</strong>. Change the odd one out afterwards on the fund itself.</div>" +
    '<div class="field"><label>Payment source</label><select id="paSrc">' +
    '<option value="' + esc(PAY_DIRECT) + '">' + esc(PAY_DIRECT) + "</option>" +
    '<option value="' + esc(PAY_PLATFORM) + '">' + esc(PAY_PLATFORM) + "</option>" +
    '<option value="' + esc(PAY_SPLIT) + '">' + esc(PAY_SPLIT) + "</option>" +
    '<option value="">Clear &mdash; no source on any fund</option></select></div>' +
    (m.splitFunds.length
      ? '<div class="banner warn" style="margin-top:12px">' + m.splitFunds.length + " fund" +
        (m.splitFunds.length === 1 ? "" : "s") + " cannot carry the whole fee &mdash; " +
        money(m.splitFunds.reduce((a, r) => a + r.shortfall, 0)) + " would have to be direct debited. " +
        "Choosing the split fills both amounts.</div>"
      : "");

  showDialog("Set payment on all funds", body, "Apply", () => {
    const src = $("#paSrc").value;
    const run = currentRun();
    for (const r of funds) {
      const k = "row:" + r.key;
      const ov = { ...(run.overrides[k] || {}) };
      if (src) ov.paymentSource = src; else delete ov.paymentSource;
      if (Object.keys(ov).length) run.overrides[k] = ov; else delete run.overrides[k];
    }
    saveRuns();
    recalc();
    markInProgress();
    render();
    toast(src ? funds.length + " funds set to " + src + "." : "Payment source cleared on " + funds.length + " funds.", "good");
    return true;
  });
}

/* One modal, used by the import flow. Returning false from onConfirm keeps it
   open so a rejected sub-confirmation does not lose the dialog. */
function showDialog(title, bodyHtml, confirmLabel, onConfirm, afterRender) {
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="modal-h"><h2>' + esc(title) + "</h2></div>" +
    '<div class="modal-b">' + bodyHtml + "</div>" +
    '<div class="modal-f"><button class="btn ghost" data-x>Cancel</button>' +
    '<button class="btn sky" data-ok>' + esc(confirmLabel) + "</button></div></div>";
  document.body.appendChild(back);

  const close = () => { document.removeEventListener("keydown", onKey); back.remove(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  back.addEventListener("mousedown", e => { if (e.target === back) close(); });
  back.querySelector("[data-x]").addEventListener("click", close);
  back.querySelector("[data-ok]").addEventListener("click", () => { if (onConfirm() !== false) close(); });
  if (afterRender) afterRender();
  const first = back.querySelector("input,select,textarea");
  if (first) first.focus();
}

/* =========================================================================
   The printed report

   What an adviser keeps as their record of the month, and what anyone else
   reads on paper instead of a spreadsheet. Built into #report rather than
   printed from the review screen, because the review screen is thirteen
   columns of live inputs and a document it is not.
   ========================================================================= */

/* Movement is the number people look for first, and "$-1,240" reads as a typo.
   A sign in front of it, and a real minus rather than a hyphen. */
const signed = n => (n == null || !isFinite(n)) ? "—"
  : (Math.round(n) === 0 ? "$0" : (n > 0 ? "+" : "−") + "$" + Math.abs(Math.round(n)).toLocaleString("en-AU"));

/* Short enough to sit at the end of a row without wrapping it. */
function reportFlags(m) {
  const f = [];
  if (m.baseFee == null) f.push("no rate");
  if (m.outsideBand) f.push((m.diffToCard < 0 ? "↓" : "↑") + " off band");
  if (m.belowCurrent) f.push("below current");
  if (m.overCap) f.push("over platform cap" + (m.maxFee != null ? " — max " + money(Math.floor(m.maxFee)) : ""));
  if (m.underMinBalance.length) f.push("under platform minimum");
  if (m.mode === "Variable" && m.unsetFunds) f.push(m.unsetFunds + " fund" + (m.unsetFunds > 1 ? "s" : "") + " unset");
  if (m.paymentShort) f.push("payment short");
  return f;
}

/* Exactly the clients the screen is showing, so the count in the dialog is the
   count on the paper and the report is never a surprise. */
function reportList() {
  const c = state.calc;
  if (!c) return [];
  const me = scopedAdviser();
  let list = c.masters;
  if (me) list = list.filter(m => m.adviser === me);
  if (!can("ownBook") && state.filterRegion !== "all") list = list.filter(m => m.region === state.filterRegion);
  return applyQuery(list);
}

function buildReport(opts) {
  const run = currentRun(), c = state.calc;
  if (!run || !c) return "";
  const me = scopedAdviser();
  const list = reportList();

  const totCur = list.reduce((a, m) => a + (m.currentFee || 0), 0);
  const totNew = list.reduce((a, m) => a + (m.fee || 0), 0);
  const totFum = [...new Set(list.map(m => m.fumKey))]
    .reduce((a, k) => a + (list.find(m => m.fumKey === k).totalFum || 0), 0);

  const status = me ? adviserState(me).status : run.status;
  const scope = me ? me
    : (state.filterRegion !== "all" ? state.filterRegion + " region" : "All advisers");
  const now = new Date().toLocaleString("en-AU",
    { day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit" });

  let h = '<div class="rep">';

  h += '<div class="rep-head"><img src="' + logoSrc() + '" alt="Coastal Advisory">' +
    '<div class="rep-title"><h1>Adviser Fee Review</h1>' +
    '<div class="who">' + esc(scope) + "</div>" +
    '<div class="when">' + esc(monthLabel(run.key)) + "</div></div></div>";

  h += '<div class="rep-meta">' +
    "<span><b>Status</b> " + esc(status) + "</span>" +
    "<span><b>Clients</b> " + list.length + "</span>" +
    (me ? "" : "<span><b>Advisers</b> " + new Set(list.map(m => m.adviser)).size + "</span>") +
    "<span><b>Rate card</b> " + esc(state.rateCard.version || "not named") + "</span>" +
    (run.sourceName ? "<span><b>Source</b> " + esc(run.sourceName) + "</span>" : "") +
    "<span><b>Prepared</b> " + esc(now) + "</span></div>";

  if (run.isSample) {
    h += '<div class="note"><b>Sample data.</b> Every client, figure and adviser name in this report is ' +
      "fictional. It is not a record of anything.</div>";
  }
  h += '<div class="rep-sum">' +
    '<div><div class="k">Total FUM</div><div class="v">' + money(totFum) + "</div></div>" +
    '<div><div class="k">Current fees</div><div class="v">' + money(totCur) + "</div></div>" +
    '<div><div class="k">New fees</div><div class="v">' + money(totNew) + "</div></div>" +
    '<div><div class="k">Movement</div><div class="v">' + signed(totNew - totCur) + "</div></div>" +
    "</div>";

  if (!list.length) {
    return h + '<div class="empty">No clients to report.</div></div>';
  }

  /* Ops read this adviser by adviser; an adviser has only their own book, so the
     grouping collapses to one unlabelled group. */
  let groups;
  if (me) groups = [[me, list]];
  else {
    const byAdviser = new Map();
    for (const m of list) {
      if (!byAdviser.has(m.adviser)) byAdviser.set(m.adviser, []);
      byAdviser.get(m.adviser).push(m);
    }
    groups = [...byAdviser].sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  }

  h += "<h2>Fees by client</h2>";
  h += '<table><thead><tr>' +
    "<th>Client</th><th>Category</th>" +
    '<th class="r">Accts</th><th class="r">Total FUM</th><th class="r">Current fee</th>' +
    '<th class="r">New fee</th><th class="r">Movement</th><th>Fee type</th>' +
    "</tr></thead><tbody>";

  groups.forEach(([adviser, rows], gi) => {
    if (!me) {
      /* The name carries the weight; the counts sit behind it so the eye lands
         on who this section belongs to and nothing else. */
      const gc0 = rows.reduce((a, m) => a + (m.currentFee || 0), 0);
      const gn0 = rows.reduce((a, m) => a + (m.fee || 0), 0);
      h += '<tr class="grp' + (opts.pageBreak && gi > 0 ? " brk" : "") + '"><td colspan="8">' +
        esc(adviser || "(no adviser)") +
        '<span class="meta"> &nbsp;' + rows.length + " client" + (rows.length === 1 ? "" : "s") +
        " &middot; " + esc(adviserState(adviser).status) +
        " &middot; " + money(gc0) + " &rarr; " + money(gn0) +
        " &middot; " + signed(gn0 - gc0) + "</span></td></tr>";
    }
    for (const m of rows) {
      const flags = reportFlags(m);
      h += '<tr class="cli">' +
        '<td><div class="nm">' + esc(m.name) + '</div><div class="id">Xplan ' + esc(m.masterId) + "</div></td>" +
        "<td>" + esc(m.category || "—") + (m.mappedTo ? '<div class="id">as ' + esc(m.mappedTo) + "</div>" : "") + "</td>" +
        '<td class="r">' + m.rows.length + "</td>" +
        '<td class="r">' + money(m.totalFum) + "</td>" +
        '<td class="r">' + money(m.currentFee) + "</td>" +
        '<td class="r">' + money(m.fee) + "</td>" +
        '<td class="r">' + signed(m.variance) + "</td>" +
        "<td>" + esc(feeTypeLabel(m)) +
          flags.map(f => '<span class="flag">' + esc(f) + "</span>").join("") + "</td></tr>";

      if (opts.comments && m.comment) {
        h += '<tr class="cmt"><td colspan="8"><b>Note:</b> ' + esc(m.comment) + "</td></tr>";
      }
      if (opts.funds) {
        for (const r of m.rows) {
          h += '<tr class="fnd"><td colspan="2">' + esc(r.manual ? r.subfundName : fundLabel(r)) +
            (r.manual ? " (added)" : "") +
            '<div class="id">' + esc(r.memberName) + " &middot; " + esc(r.vendorUsed) +
            (r.included ? "" : " &middot; excluded") + "</div></td>" +
            '<td class="r"></td>' +
            '<td class="r">' + money(r.valueUsed) + "</td>" +
            '<td class="r"></td>' +
            '<td class="r">' + (r.feeShare == null ? "—" : money(r.feeShare)) + "</td>" +
            '<td class="r"></td>' +
            "<td>" + esc(r.paymentSource || "") + "</td></tr>";
        }
      }
    }
    if (!me && groups.length > 1) {
      const gc = rows.reduce((a, m) => a + (m.currentFee || 0), 0);
      const gn = rows.reduce((a, m) => a + (m.fee || 0), 0);
      h += '<tr class="sub"><td colspan="4" class="r">End of ' + esc(adviser || "(no adviser)") +
        " &middot; " + rows.length + " client" + (rows.length === 1 ? "" : "s") + "</td>" +
        '<td class="r">' + money(gc) + '</td><td class="r">' + money(gn) +
        '</td><td class="r">' + signed(gn - gc) + "</td><td></td></tr>";
    }
  });

  h += '</tbody><tfoot><tr><td colspan="3">Total &middot; ' + list.length + " client" + (list.length === 1 ? "" : "s") + "</td>" +
    '<td class="r">' + money(totFum) + '</td><td class="r">' + money(totCur) +
    '</td><td class="r">' + money(totNew) + '</td><td class="r">' + signed(totNew - totCur) +
    "</td><td></td></tr></tfoot></table>";

  const anyFlag = list.some(m => reportFlags(m).length);
  if (anyFlag) {
    h += '<div class="legend"><b>Flags.</b> ' +
      "<i>no rate</i> — the category has no rate card entry, so the fee is not set. " +
      "<i>off band</i> — more than " + (state.rateCard.variancePct * 100) + "% from the rate card fee. " +
      "<i>below current</i> — lower than the client pays today. " +
      "<i>over platform cap</i> — more than the platform will let us draw from an account; the maximum is shown. " +
      "<i>under platform minimum</i> — the balance is below what the platform needs before it will process a fee at all. " +
      "<i>funds unset</i> — priced by fund, and a fund has no fee type, so it charges nothing. " +
      "<i>payment short</i> — the fund amounts add up to less than the fee." +
      "</div>";
  }

  return h + "</div>";
}

/* The brand mark travels as whatever the page already has, so the report works
   both from the project folder and from a build with the logo inlined. */
function logoSrc() {
  const img = document.querySelector(".brand-logo-img");
  return img ? img.getAttribute("src") : "";
}

function openPrintDialog() {
  const run = currentRun();
  if (!run || !state.calc) { toast("Load a run first.", "bad"); return; }
  const n = reportList().length;
  const me = scopedAdviser();

  const body =
    '<div class="kv" style="margin-bottom:16px">' +
    '<div class="k">Month</div><div class="v">' + esc(monthLabel(run.key)) + "</div>" +
    '<div class="k">Covering</div><div class="v">' + esc(me || (state.filterRegion !== "all" ? state.filterRegion + " region" : "All advisers")) + "</div>" +
    '<div class="k">Clients</div><div class="v">' + n + "</div></div>" +
    '<label class="toggle-row" style="cursor:pointer;margin-bottom:8px">' +
      '<input type="checkbox" id="prComments" checked> Include adviser comments</label>' +
    '<label class="toggle-row" style="cursor:pointer;margin-bottom:8px">' +
      '<input type="checkbox" id="prFunds" checked> Break each client down by account</label>' +
    (me ? "" : '<label class="toggle-row" style="cursor:pointer;margin-bottom:8px">' +
      '<input type="checkbox" id="prBreak"> Start each adviser on a new page</label>') +
    '<div class="small muted" style="margin-top:12px">Opens your browser\'s print dialog. Choose ' +
    '<strong>Save as PDF</strong> there to keep a copy. Background graphics are not needed &mdash; the ' +
    "report is drawn with rules, so it prints the same either way.</div>";

  showDialog("Print report", body, "Print", () => {
    printReport({
      comments: $("#prComments").checked,
      funds: $("#prFunds").checked,
      pageBreak: $("#prBreak") ? $("#prBreak").checked : false
    });
    return true;
  });
}

function printReport(opts) {
  const box = $("#report");
  box.innerHTML = buildReport(opts);
  /* The class is what tells the print stylesheet to send the report rather than
     the screen, so it has to be on before print() and off after — including if
     print() throws, or the app is left permanently blank. */
  document.body.classList.add("printing");
  /* Straight into print(), which lays the page out itself. An earlier version
     waited a frame first; requestAnimationFrame never fires in a background tab,
     so that was a print that silently never happened. */
  try { window.print(); }
  finally {
    /* Deliberately long. afterprint below is what normally puts the page back;
       this is only here so the markup cannot leak if that never fires, and it
       has to outlast someone reading the preview — a short timeout would blank
       the preview they are still looking at. */
    setTimeout(endPrint, 60000);
  }
}

function endPrint() {
  document.body.classList.remove("printing");
  const box = $("#report");
  if (box) box.innerHTML = "";
}

/* Fires when printing actually finishes, however long the preview was open. */
window.addEventListener("afterprint", endPrint);

/* =========================================================================
   Export
   ========================================================================= */
function exportCsv() {
  const c = state.calc, run = currentRun();
  if (!c) return;
  const me = scopedAdviser();
  let list = c.masters;
  if (me) list = list.filter(m => m.adviser === me);
  if (!can("ownBook") && state.filterRegion !== "all") list = list.filter(m => m.region === state.filterRegion);

  const head = ["Xplan ID", "Master client", "Adviser", "Region", "Category", "Accounts",
    "Total FUM", "Current fee", "Rate card fee", "Base", "Entity fee", "FUM surcharge",
    "Fee Type", "Adviser fee", "% of FUM", "Movement", "Payment source", "Comment", "Flags"];
  const lines = [head];
  for (const m of list) {
    const flags = [m.baseFee == null ? "no rate" : "", m.outsideBand ? "off band" : "",
      m.belowCurrent ? "below current" : "",
      m.overCap ? "over platform cap" + (m.maxFee != null ? " (max " + Math.floor(m.maxFee) + ")" : "") : "",
      m.underMinBalance.length ? "under platform minimum" : ""].filter(Boolean).join("; ");
    lines.push([m.masterId, m.name, m.adviser, m.region, m.category, m.rows.length,
      round2(m.totalFum), round2(m.currentFee), m.rateCardFee == null ? "" : round2(m.rateCardFee),
      m.baseFee == null ? "" : m.baseFee, round2(m.entityFee), round2(m.surcharge),
      feeTypeLabel(m), m.fee == null ? "" : round2(m.fee),
      m.pctOfFum == null ? "" : (m.pctOfFum * 100).toFixed(4) + "%",
      m.variance == null ? "" : round2(m.variance),
      m.paymentSource === "Variable" ? "By fund" : "", m.comment, flags]);
  }
  const csv = lines.map(r => r.map(v => {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");

  const who = me ? me.replace(/[^\w]+/g, "-") : "All advisers";
  download(csv, "Fee Review " + run.key + " " + who + ".csv", "text/csv;charset=utf-8");
}

const round2 = n => Math.round((n || 0) * 100) / 100;

/* Two hosts, two ways of handing over a file. Served normally, a blob link is
   the right answer. Inside the claude.ai artifact viewer a page cannot start a
   download at all — the host mediates it and the viewer confirms — so ask for
   that when it is there and fall through when it is not. */
async function download(text, name, mime) {
  const body = "﻿" + text;                       // BOM so Excel reads UTF-8
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const downloads = await window.claude.use("downloads");
      if (downloads) {
        await downloads.save({ filename: name, data: body });
        toast("Saved " + name, "good");
        return;
      }
    } catch (e) {
      if (e && e.code === "declined") return;         // viewer said no; not an error
      toast("Could not save the file. " + ((e && e.message) || ""), "bad");
      return;
    }
  }
  const url = URL.createObjectURL(new Blob([body], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* =========================================================================
   Boot
   An empty app teaches nobody anything, so a first visit lands on the sample
   month. It is labelled everywhere it appears and the first real extract
   replaces it.
   ========================================================================= */
loadAll();

applyTheme();
/* System → Light → Dark → System. Three states because "follow the OS" is a
   real preference, not the absence of one. */
$("#themeBtn").addEventListener("click", () => {
  const order = ["system", "light", "dark"];
  state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
  saveUi();
  applyTheme();
});

/* The sidebar is outside the re-rendered page, so it is wired once. */
$("#navToggle").addEventListener("click", () => {
  const collapsedNow = document.body.classList.contains("nav-mini");
  state.navCollapsed = !collapsedNow;
  saveUi();
  applyNavWidth();
});
/* While nobody has pinned it, the viewport decides. */
addEventListener("resize", () => {
  if (state.navCollapsed === null) applyNavWidth();
  measureTopbar();                 // the bar rewraps, so the pinned panel's offset moves with it
});

/* Sample data belongs to local mode only. Connected, the site is the source of
   truth and an invented run would be indistinguishable from a real one. */
if (localMode()) {
  if (!Object.keys(state.runs).length) {
    const key = defaultMonth();
    state.runs[key] = newRun(key, sampleRows(), SAMPLE_LABEL);
    state.runs[key].status = "Open for Review";
    state.runKey = key;
    saveRuns(); saveUi();
  }
  /* Sample runs are disposable, so bring any stale one up to date rather than
     leaving it pointing at advisers and pricing that no longer exist. */
  for (const [key, run] of Object.entries(state.runs)) {
    if (run.isSample && run.sampleVersion !== SAMPLE_VERSION) {
      state.runs[key] = newRun(key, sampleRows(), SAMPLE_LABEL);
      state.runs[key].status = run.status || "Open for Review";
    }
  }
  if (currentRun() && currentRun().isSample) installSampleReference();
  saveRuns();
  render();
} else {
  state.runs = {};
  state.runKey = null;
  /* Coming back from the Entra redirect there is already an account in the
     cache, so pick straight up rather than making somebody press sign in
     twice. Otherwise show the gate and wait to be asked. */
  renderGate();
  ensureMsal()
    .then(app => { if (app.getActiveAccount()) return startSession(); })
    .catch(e => { state.authState = "error"; state.authError = explainAuthError(e); renderGate(); });
}
